<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重設密碼</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f7f7f7; }
        .container { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); text-align: center; }
        #fallback { display: none; } /* 預設隱藏網頁表單 */
        input { width: 90%; padding: 10px; margin-bottom: 1rem; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 12px; background-color: #673AB7; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .message { margin-top: 1rem; }
    </style>
</head>
<body>
    <div class="container">
        <h2>正在嘗試開啟 PlantDoctor App...</h2>
        <p>如果 App 沒有自動開啟，請在下方完成密碼重設。</p>

        <!-- 備用網頁表單 -->
        <div id="fallback">
            <h3>在網頁上重設密碼</h3>
            <input type="password" id="newPassword" placeholder="請輸入新密碼">
            <input type="password" id="confirmPassword" placeholder="請再次輸入新密碼">
            <button onclick="resetPasswordOnWeb()">確認重設</button>
            <p id="message" class="message"></p>
        </div>
    </div>

    <script>
        // 1. 從網址取得 token
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (token) {
            // 2. 嘗試用自訂協定開啟 App
            const appUrl = `plantdoctor://reset/reset-password?token=${token}`;
            window.location.href = appUrl;

            // 3. 設定一個計時器，如果 2 秒後使用者還停留在這個頁面，就顯示備用表單
            setTimeout(function() {
                document.getElementById('fallback').style.display = 'block';
                document.querySelector('h2').textContent = '無法開啟 App';
            }, 2000);
        } else {
            document.querySelector('h2').textContent = '錯誤：缺少 Token';
        }

        // 4. 在網頁上重設密碼的函式
        async function resetPasswordOnWeb() {
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const messageEl = document.getElementById('message');

            if (newPassword !== confirmPassword) {
                messageEl.textContent = '錯誤：兩次輸入的密碼不一致！';
                return;
            }

            try {
                const response = await fetch('/api/v1/auth/user/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        token: token,
                        new_password: newPassword,
                        confirm_password: confirmPassword
                    })
                });

                if (response.ok) {
                    messageEl.textContent = '密碼重設成功！您可以關閉此頁面並返回 App 登入。';
                } else {
                    const error = await response.json();
                    messageEl.textContent = `錯誤：${error.detail || '發生未知錯誤'}`;
                }
            } catch (error) {
                messageEl.textContent = '網路連線錯誤，請稍後再試。';
            }
        }
    </script>
</body>
</html>
