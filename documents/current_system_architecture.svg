<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .title { font: 700 44px "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif; fill: #26352d; }
      .subtitle { font: 400 20px "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif; fill: #59665f; }
      .lane { font: 700 24px "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif; fill: #315942; }
      .head { font: 700 21px "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif; fill: #26352d; }
      .text { font: 400 17px "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif; fill: #3d4d43; }
      .small { font: 400 15px "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif; fill: #5a695f; }
      .lane-box { fill: #f7faf7; stroke: #9fb5a0; stroke-width: 2; }
      .client { fill: #e7f2e4; stroke: #789879; stroke-width: 2; }
      .service { fill: #ffffff; stroke: #73966f; stroke-width: 2; }
      .safety { fill: #fff7e6; stroke: #d3a354; stroke-width: 2; }
      .external { fill: #eef3f7; stroke: #7b929f; stroke-width: 2; }
      .line { stroke: #667b6b; stroke-width: 2.3; fill: none; marker-end: url(#arrow); }
      .return { stroke: #8a9b8e; stroke-width: 1.8; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow2); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#667b6b"/>
    </marker>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#8a9b8e"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="60" y="60" class="title">現行系統架構圖</text>
  <text x="60" y="92" class="subtitle">前端介面、FastAPI 服務、安全校驗、資料層與外部服務</text>

  <rect x="50" y="126" width="380" height="690" rx="8" class="lane-box"/>
  <rect x="470" y="126" width="650" height="690" rx="8" class="lane-box"/>
  <rect x="1160" y="126" width="390" height="690" rx="8" class="lane-box"/>
  <text x="240" y="166" text-anchor="middle" class="lane">使用介面</text>
  <text x="795" y="166" text-anchor="middle" class="lane">FastAPI 後端</text>
  <text x="1355" y="166" text-anchor="middle" class="lane">資料與外部服務</text>

  <!-- Clients -->
  <rect x="86" y="205" width="308" height="132" rx="8" class="client"/>
  <text x="240" y="244" text-anchor="middle" class="head">Android App</text>
  <text x="240" y="277" text-anchor="middle" class="text">帳號、拍照診斷、歷史紀錄</text>
  <text x="240" y="306" text-anchor="middle" class="small">Kotlin / Retrofit / JWT</text>

  <rect x="86" y="385" width="308" height="132" rx="8" class="client"/>
  <text x="240" y="424" text-anchor="middle" class="head">Webcam 監控介面</text>
  <text x="240" y="457" text-anchor="middle" class="text">單株、多區域、定時擷取</text>
  <text x="240" y="486" text-anchor="middle" class="small">Android CameraX / Browser</text>

  <rect x="86" y="565" width="308" height="132" rx="8" class="client"/>
  <text x="240" y="604" text-anchor="middle" class="head">管理後台</text>
  <text x="240" y="637" text-anchor="middle" class="text">統計、紀錄、使用者查詢</text>
  <text x="240" y="666" text-anchor="middle" class="small">Jinja2 / HTML</text>

  <!-- Backend -->
  <rect x="510" y="205" width="570" height="94" rx="8" class="service"/>
  <text x="795" y="243" text-anchor="middle" class="head">API 與身分驗證層</text>
  <text x="795" y="274" text-anchor="middle" class="text">Auth / Predict / Diaries / Webcam / Knowledge / Admin</text>

  <rect x="510" y="337" width="270" height="142" rx="8" class="service"/>
  <text x="645" y="375" text-anchor="middle" class="head">圖片診斷服務</text>
  <text x="645" y="407" text-anchor="middle" class="text">圖片品質與格式檢查</text>
  <text x="645" y="436" text-anchor="middle" class="text">Gemini 影像初判</text>

  <rect x="810" y="337" width="270" height="142" rx="8" class="service"/>
  <text x="945" y="375" text-anchor="middle" class="head">Webcam 警報服務</text>
  <text x="945" y="407" text-anchor="middle" class="text">連續影格一致判定</text>
  <text x="945" y="436" text-anchor="middle" class="text">警報、Email、確認與刪除</text>

  <rect x="510" y="520" width="570" height="132" rx="8" class="safety"/>
  <text x="795" y="559" text-anchor="middle" class="head">防幻覺安全校驗閘門</text>
  <text x="795" y="591" text-anchor="middle" class="text">名稱清單 → 作物關聯 → 信心門檻 → 官方來源</text>
  <text x="795" y="621" text-anchor="middle" class="small">未通過：requires_review=true，不建立 Webcam 自動警報</text>

  <rect x="510" y="694" width="570" height="88" rx="8" class="service"/>
  <text x="795" y="729" text-anchor="middle" class="head">日誌與管理服務</text>
  <text x="795" y="758" text-anchor="middle" class="text">確認儲存、查詢、備註、修正、刪除、統計</text>

  <!-- Data and external services -->
  <rect x="1196" y="205" width="318" height="140" rx="8" class="external"/>
  <text x="1355" y="244" text-anchor="middle" class="head">MySQL</text>
  <text x="1355" y="276" text-anchor="middle" class="text">user / plant_diary / webcam_alert</text>
  <text x="1355" y="305" text-anchor="middle" class="small">crop / disease / pests / tokens</text>

  <rect x="1196" y="385" width="318" height="126" rx="8" class="external"/>
  <text x="1355" y="424" text-anchor="middle" class="head">知識庫與官方資料</text>
  <text x="1355" y="456" text-anchor="middle" class="text">農業部公開資料 / RAG</text>
  <text x="1355" y="485" text-anchor="middle" class="small">來源網址與紀錄編號可追溯</text>

  <rect x="1196" y="551" width="150" height="128" rx="8" class="external"/>
  <text x="1271" y="591" text-anchor="middle" class="head">Gemini</text>
  <text x="1271" y="623" text-anchor="middle" class="text">圖片初判</text>
  <text x="1271" y="650" text-anchor="middle" class="small">不直接當事實</text>

  <rect x="1364" y="551" width="150" height="128" rx="8" class="external"/>
  <text x="1439" y="591" text-anchor="middle" class="head">SMTP</text>
  <text x="1439" y="623" text-anchor="middle" class="text">驗證與警報</text>
  <text x="1439" y="650" text-anchor="middle" class="small">未設定不影響紀錄</text>

  <!-- Main flows -->
  <path d="M394 271 H510" class="line"/>
  <path d="M394 451 H510" class="line"/>
  <path d="M394 631 H510" class="line"/>
  <text x="451" y="255" text-anchor="middle" class="small">HTTPS / JSON</text>

  <path d="M645 299 V337" class="line"/>
  <path d="M945 299 V337" class="line"/>
  <path d="M645 479 V520" class="line"/>
  <path d="M945 479 V520" class="line"/>
  <path d="M795 652 V694" class="line"/>

  <path d="M1080 251 H1196" class="line"/>
  <path d="M1080 586 H1196 V448" class="line"/>
  <path d="M780 408 H1150 V615 H1196" class="line"/>
  <path d="M1080 408 H1130 V615 H1364" class="line"/>
  <path d="M1080 738 H1138 V275 H1196" class="line"/>

  <path d="M1196 318 H1100 V285 H1080" class="return"/>
  <path d="M1196 475 H1108 V610 H1080" class="return"/>
  <path d="M1196 642 H1120 V445 H780" class="return"/>

  <rect x="50" y="838" width="1500" height="36" rx="6" fill="#eef5ee" stroke="#b1c6b1"/>
  <text x="800" y="862" text-anchor="middle" class="small">診斷結果在寫入日誌或觸發警報前，必須先通過資料庫校驗；Gemini 僅提供候選結果。</text>
</svg>
