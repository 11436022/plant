<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 860" width="1560" height="860">
  <defs>
    <style>
      text {
        font-family: 'Microsoft JhengHei', '微軟正黑體', 'PingFang TC', sans-serif;
      }
      .title {
        font-family: 'Microsoft JhengHei', '微軟正黑體', 'PingFang TC', sans-serif;
        font-size: 24px;
        font-weight: bold;
        fill: #1A281E;
      }
      .group-title {
        font-family: 'Microsoft JhengHei', '微軟正黑體', 'PingFang TC', sans-serif;
        font-size: 16px;
        font-weight: bold;
        fill: #223827;
      }
      .state-name {
        font-family: 'Microsoft JhengHei', '微軟正黑體', 'PingFang TC', sans-serif;
        font-size: 15px;
        font-weight: bold;
        fill: #223827;
      }
      .diamond-text {
        font-family: 'Microsoft JhengHei', '微軟正黑體', 'PingFang TC', sans-serif;
        font-size: 13.5px;
        font-weight: bold;
        fill: #1A281E;
        text-anchor: middle;
      }
      .action-text {
        font-family: 'Microsoft JhengHei', '微軟正黑體', 'PingFang TC', sans-serif;
        font-size: 13px;
        fill: #2D3748;
      }
      .transition-text {
        font-family: 'Microsoft JhengHei', '微軟正黑體', 'PingFang TC', sans-serif;
        font-size: 13px;
        fill: #2D5837;
        font-weight: bold;
        paint-order: stroke fill;
        stroke: #FFFFFF;
        stroke-width: 4px;
        stroke-linejoin: round;
      }
      .guard-text {
        font-family: 'Microsoft JhengHei', '微軟正黑體', 'PingFang TC', sans-serif;
        font-size: 12.5px;
        fill: #993B36;
        font-style: italic;
        font-weight: bold;
        paint-order: stroke fill;
        stroke: #FFFFFF;
        stroke-width: 3.5px;
        stroke-linejoin: round;
      }

      .composite-bg { fill: #F8FAF7; stroke: #B5C6B3; stroke-width: 1.5; stroke-dasharray: 6,4; rx: 8; ry: 8; }
      .composite-header { fill: #E5EDE3; stroke: #B5C6B3; stroke-width: 1.5; }

      .state-box { fill: #FFFFFF; stroke: #4F7057; stroke-width: 1.5; rx: 6; ry: 6; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.04)); }
      .state-header { fill: #DDEAD7; stroke: #4F7057; stroke-width: 1.5; }

      .alert-box { fill: #FFFFFF; stroke: #BA5D57; stroke-width: 1.5; rx: 6; ry: 6; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.04)); }
      .alert-header { fill: #F8E2E0; stroke: #BA5D57; stroke-width: 1.5; }

      .choice-diamond { fill: #E5EDE3; stroke: #334035; stroke-width: 1.5; }

      .line { stroke: #334035; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .line-branch { stroke: #4F7057; stroke-width: 1.5; fill: none; marker-end: url(#arrow-branch); }
      .line-back { stroke: #BA5D57; stroke-width: 1.5; stroke-dasharray: 5,4; fill: none; marker-end: url(#arrow-back); }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#334035" />
    </marker>
    <marker id="arrow-branch" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#4F7057" />
    </marker>
    <marker id="arrow-back" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#BA5D57" />
    </marker>
  </defs>

  <!-- Root Background (Pure White to prevent dark mode transparency issues) -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Title -->
  <text x="780" y="36" class="title" text-anchor="middle">圖 7-4-6 Webcam 監控與自動警報 狀態圖 (State Diagram)</text>

  <!-- ========================================================================= -->
  <!-- 1. COMPOSITE 1: MONITORING & SAMPLING LOOP (x=75, y=62, w=570, h=755)     -->
  <!-- ========================================================================= -->
  <g transform="translate(75, 62)">
    <rect width="570" height="755" class="composite-bg" />
    <path d="M 0 8 Q 0 0 8 0 L 562 0 Q 570 0 570 8 L 570 34 L 0 34 Z" class="composite-header" />
    <text x="18" y="23" class="group-title">即時視訊採樣與推論循環 (Monitoring Loop)</text>

    <!-- State 1: 監控配置與作物設定 (w=500, h=108) -->
    <g transform="translate(35, 50)">
      <rect width="500" height="108" class="state-box" />
      <path d="M 0 6 Q 0 0 6 0 L 494 0 Q 500 0 500 6 L 500 28 L 0 28 Z" class="state-header" />
      <text x="250" y="19" class="state-name" text-anchor="middle">監控配置與作物設定 (Monitoring_Ready)</text>
      <text x="14" y="51" class="action-text">entry / 獲取相機權限，載入作物知識庫 (GET /knowledge/crops)</text>
      <text x="14" y="73" class="action-text">do / 單區：選取目標作物；多區：各 ROI 框選獨立綁定不同植物</text>
      <text x="14" y="95" class="action-text">exit / 各區域獨立設定採樣間隔 (interval)，啟動定時監控任務</text>
    </g>

    <!-- Transition S1 -> S2 -->
    <line x1="285" y1="158" x2="285" y2="212" class="line" />
    <text x="297" y="189" class="transition-text">啟動定時監控</text>

    <!-- State 2: 影格擷取與品質校驗 (w=500, h=108) -->
    <g transform="translate(35, 212)">
      <rect width="500" height="108" class="state-box" id="state-sampling" />
      <path d="M 0 6 Q 0 0 6 0 L 494 0 Q 500 0 500 6 L 500 28 L 0 28 Z" class="state-header" />
      <text x="250" y="19" class="state-name" text-anchor="middle">影格擷取與品質校驗 (Frame_Sampling)</text>
      <text x="14" y="51" class="action-text">entry / 依各區排程自動倒數，按歸一化座標 (rectNorm) 擷取影像</text>
      <text x="14" y="73" class="action-text">do / 驗證裁切圖片解析度 (MIN_SIZE) 與資料完整性</text>
      <text x="14" y="95" class="action-text">exit / 攜帶 region_id 與 crop_name 上傳後端進行分析</text>
    </g>

    <!-- Transition S2 -> S3 -->
    <line x1="285" y1="320" x2="285" y2="374" class="line" />
    <text x="297" y="351" class="transition-text">影格上傳送檢</text>

    <!-- State 3: AI 初篩與資料庫覆核 (w=500, h=108) -->
    <g transform="translate(35, 374)">
      <rect width="500" height="108" class="state-box" />
      <path d="M 0 6 Q 0 0 6 0 L 494 0 Q 500 0 500 6 L 500 28 L 0 28 Z" class="state-header" />
      <text x="250" y="19" class="state-name" text-anchor="middle">AI 初篩與資料庫覆核 (Diagnostic_Grounding)</text>
      <text x="14" y="51" class="action-text">entry / 依區域指定之植物類別驅動 ConvNeXt-Base 執行推論</text>
      <text x="14" y="73" class="action-text">do / 比對專家植物病害知識庫進行真實性覆核 (Grounding)</text>
      <text x="14" y="95" class="action-text">exit / 產出各區專屬診斷指紋 (crop_name, category, disease_name)</text>
    </g>

    <!-- Transition S3 -> Diamond 1 -->
    <line x1="285" y1="482" x2="285" y2="538" class="line" />

    <!-- Choice Diamond 1: 病害判定 (Center: x=285, y=566; w=110, h=56) -->
    <polygon points="285,538 340,566 285,594 230,566" class="choice-diamond" />
    <text x="285" y="571" class="diamond-text">病害判定</text>

    <!-- Loop back: Normal -> State 2 -->
    <!-- From Diamond left (230, 566) -> Left to 20 -> Up to 266 -> Right to State 2 left (33, 266) -->
    <path d="M 230 566 L 20 566 L 20 266 L 33 266" class="line-back" />
    <text x="125" y="557" class="guard-text" text-anchor="middle">[正常健康 / 未達門檻] 重置計數</text>

    <!-- Stop Monitoring Flow -->
    <line x1="285" y1="594" x2="285" y2="672" class="line" />
    <text x="297" y="636" class="transition-text">手動停止監控</text>
    <circle cx="285" cy="695" r="10" stroke="#1A281E" stroke-width="1.6" fill="none" />
    <circle cx="285" cy="695" r="6" fill="#1A281E" />
    <text x="285" y="725" class="action-text" font-weight="bold" text-anchor="middle">監控終止 [*]</text>
  </g>

  <!-- Initial State: Entry to Ready -->
  <circle cx="32" cy="166" r="7" fill="#1A281E" />
  <line x1="39" y1="166" x2="108" y2="166" class="line" />

  <!-- ========================================================================= -->
  <!-- 2. INTER-CONTAINER BRANCH: ANOMALY ROUTING                                -->
  <!-- From Diamond 1 right (abs x=415, y=628) -> Right into Sub-process 2 (778, 628) -->
  <!-- ========================================================================= -->
  <path d="M 415 628 L 778 628" class="line-branch" />
  <text x="596" y="618" class="transition-text" text-anchor="middle">[檢出病害異常] 進入防抖比對</text>

  <!-- ========================================================================= -->
  <!-- 3. COMPOSITE 2: ALERT CONSENSUS & DISPATCH (x=780, y=62, w=710, h=755)    -->
  <!-- ========================================================================= -->
  <g transform="translate(780, 62)">
    <rect width="710" height="755" class="composite-bg" />
    <path d="M 0 8 Q 0 0 8 0 L 702 0 Q 710 0 710 8 L 710 34 L 0 34 Z" class="composite-header" fill="#E5EDE3" />
    <text x="18" y="23" class="group-title" fill="#1A281E">警報防抖確認與通報處置 (Alert Consensus &amp; Notification)</text>

    <!-- State 4: 連續影格一致性比對 (w=630, h=108) -->
    <g transform="translate(40, 50)">
      <rect width="630" height="108" class="state-box" />
      <path d="M 0 6 Q 0 0 6 0 L 624 0 Q 630 0 630 6 L 630 28 L 0 28 Z" class="state-header" />
      <text x="315" y="19" class="state-name" text-anchor="middle">連續影格一致性比對 (Consensus_Tracking)</text>
      <text x="14" y="51" class="action-text">entry / 依 (user_id, session_id, region_id) 隔離提取區域指紋</text>
      <text x="14" y="73" class="action-text">do / 比對該區前次指紋：吻合則累計連續匹配 (streak += 1)，否則重置</text>
      <text x="14" y="95" class="action-text">exit / 評估該區連續匹配是否達標 (streak &gt;= required_matches)</text>
    </g>

    <!-- Transition S4 -> Diamond 2 -->
    <line x1="355" y1="158" x2="355" y2="212" class="line" />

    <!-- Choice Diamond 2: 門檻與冷卻判定 (Center: x=355, y=240; w=120, h=56) -->
    <polygon points="355,212 415,240 355,268 295,240" class="choice-diamond" />
    <text x="355" y="245" class="diamond-text">門檻與冷卻</text>

    <!-- Transition Diamond 2 Down -> State 5 -->
    <line x1="355" y1="268" x2="355" y2="322" class="line" />
    <text x="367" y="299" class="transition-text">[該區連續異常達標且未冷卻]</text>

    <!-- State 5: 警報建立與多渠道通報 (w=630, h=132) -->
    <g transform="translate(40, 322)">
      <rect width="630" height="132" class="alert-box" />
      <path d="M 0 6 Q 0 0 6 0 L 624 0 Q 630 0 630 6 L 630 28 L 0 28 Z" class="alert-header" />
      <text x="315" y="19" class="state-name" fill="#85312C" text-anchor="middle">警報建立與多渠道通報 (Alert_Triggered)</text>
      <text x="14" y="51" class="action-text">entry / 於 MySQL webcam_alert 資料表記錄區域與植物名稱</text>
      <text x="14" y="73" class="action-text">do / 患病影格永久儲存至 static/uploads/alerts 目錄</text>
      <text x="14" y="95" class="action-text">do / 觸發後端異步發送緊急 Email 通知與前台聲光告警</text>
      <text x="14" y="117" class="action-text">exit / 記錄該區域之警報時間戳記 (last_alert_at) 與指紋</text>
    </g>

    <!-- Transition S5 -> S6 -->
    <line x1="355" y1="454" x2="355" y2="512" class="line" />
    <text x="367" y="487" class="transition-text">啟動防抖冷卻計時</text>

    <!-- State 6: 警報冷卻防抖態 (w=630, h=108) -->
    <g transform="translate(40, 512)">
      <rect width="630" height="108" class="state-box" />
      <path d="M 0 6 Q 0 0 6 0 L 624 0 Q 630 0 630 6 L 630 28 L 0 28 Z" class="state-header" />
      <text x="315" y="19" class="state-name" text-anchor="middle">警報冷卻防抖態 (Alert_Cooldown)</text>
      <text x="14" y="51" class="action-text">entry / 針對該區域指紋啟動獨立冷卻倒數 (cooldown_seconds)</text>
      <text x="14" y="73" class="action-text">do / 抑制相同指紋之重複通知，其他區域監控不受影響</text>
      <text x="14" y="95" class="action-text">exit / 冷卻結束，恢復該區域新警報觸發許可</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- 4. GLOBAL RETURN PATHS (LOOP BACK TO LEFT CONTAINER STATE 2)              -->
  <!-- State 2 absolute right border is at x=610, spanning y in [274, 382]       -->
  <!-- ========================================================================= -->
  <!-- Return Path 1: Diamond 2 Left (abs x=1075, y=302) -> Straight Left to State 2 right (612, 302) -->
  <path d="M 1075 302 L 612 302" class="line-back" />
  <text x="940" y="291" class="guard-text" text-anchor="middle">[未達門檻或冷卻中] 抑制警報</text>

  <!-- Return Path 2: State 6 Left (abs x=820, y=560) -> Left to 715 -> Up to 340 -> State 2 right (612, 340) -->
  <path d="M 820 560 L 715 560 L 715 340 L 612 340" class="line-back" />
  <text x="765" y="550" class="transition-text" text-anchor="middle">冷卻完畢 [返回採樣]</text>

</svg>
