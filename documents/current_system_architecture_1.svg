<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880">
  <defs>
    <style>
      .title { font: 700 36px 'Microsoft JhengHei', 'PingFang TC', sans-serif; fill: #000000; }
      .subtitle { font: 500 16px 'Microsoft JhengHei', 'PingFang TC', sans-serif; fill: #000000; }
      .lane { font: 700 21px 'Microsoft JhengHei', 'PingFang TC', sans-serif; fill: #000000; }
      .head { font: 700 17px 'Microsoft JhengHei', 'PingFang TC', sans-serif; fill: #000000; }
      .text { font: 500 14px 'Microsoft JhengHei', 'PingFang TC', sans-serif; fill: #000000; }
      
      .lane-box { fill: #F8FAF7; stroke: #8FA892; stroke-width: 2; }
      .client { fill: #E2EFE0; stroke: #2D5837; stroke-width: 2; }
      .service { fill: #ffffff; stroke: #2D5837; stroke-width: 2; }
      .safety { fill: #E2EFE0; stroke: #2D5837; stroke-width: 2.2; }
      .external { fill: #F0F6EE; stroke: #2D5837; stroke-width: 2; }
      .ai-box { fill: #E2EFE0; stroke: #2D5837; stroke-width: 2; }
      
      .line { stroke: #1A281E; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .return { stroke: #1A281E; stroke-width: 1.8; stroke-dasharray: 6 4; fill: none; marker-end: url(#arrow2); }
      
      .flow-label {
        font: 700 13px 'Microsoft JhengHei', 'PingFang TC', sans-serif;
        fill: #000000;
        paint-order: stroke fill;
        stroke: #ffffff;
        stroke-width: 4px;
        stroke-linejoin: round;
      }
      .halo-text {
        font: 700 13px 'Microsoft JhengHei', 'PingFang TC', sans-serif;
        fill: #000000;
        paint-order: stroke fill;
        stroke: #ffffff;
        stroke-width: 4px;
        stroke-linejoin: round;
      }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#1A281E"/>
    </marker>
    <marker id="arrow2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#1A281E"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1600" height="880" fill="#ffffff"/>
  
  <!-- Diagram Title -->
  <text x="60" y="52" class="title">圖 3-1-1 系統架構圖 (System Architecture)</text>
  <text x="60" y="82" class="subtitle">前端展示介面、FastAPI 後端核心服務、ConvNeXt 快篩與 Gemini 兜底階層推論、RAG 知識檢索與資料庫持久層</text>

  <!-- ================= LANE 1: 客戶端展示層 ================= -->
  <rect x="50" y="110" width="380" height="730" rx="8" class="lane-box"/>
  <text x="240" y="152" text-anchor="middle" class="lane">客戶端展示層</text>

  <!-- 1. Android Client App -->
  <rect x="86" y="185" width="308" height="145" rx="8" class="client"/>
  <text x="240" y="232" text-anchor="middle" class="head">Android 行動端 App</text>
  <text x="240" y="268" text-anchor="middle" class="text">拍照診斷與病害處方查閱</text>
  <text x="240" y="298" text-anchor="middle" class="text">個人備忘筆記與糾錯反饋</text>

  <!-- 2. Webcam Edge Monitor -->
  <rect x="86" y="365" width="308" height="145" rx="8" class="client"/>
  <text x="240" y="412" text-anchor="middle" class="head">Webcam 即時監控介面</text>
  <text x="240" y="448" text-anchor="middle" class="text">連續影像串流與定時取樣</text>
  <text x="240" y="478" text-anchor="middle" class="text">即時病害警報響應與鈴聲提示</text>

  <!-- 3. Web Admin Dashboard -->
  <rect x="86" y="545" width="308" height="145" rx="8" class="client"/>
  <text x="240" y="592" text-anchor="middle" class="head">Web 管理者後台</text>
  <text x="240" y="628" text-anchor="middle" class="text">統計儀表板與全站病歷維護</text>
  <text x="240" y="658" text-anchor="middle" class="text">使用者糾錯審核與資料標註</text>

  <!-- ================= LANE 2: 後端微服務應用層 ================= -->
  <rect x="470" y="110" width="650" height="730" rx="8" class="lane-box"/>
  <text x="795" y="152" text-anchor="middle" class="lane">FastAPI 後端核心服務</text>

  <!-- 1. API Route & Security Gateway -->
  <rect x="510" y="185" width="570" height="80" rx="8" class="service"/>
  <text x="795" y="218" text-anchor="middle" class="head">API 路由與安全層</text>
  <text x="795" y="248" text-anchor="middle" class="text">OAuth2 / JWT 驗證與各模組端點請求分派</text>

  <!-- 2A. Webcam Edge Monitoring Service (Left) -->
  <rect x="510" y="295" width="270" height="150" rx="8" class="service"/>
  <text x="645" y="342" text-anchor="middle" class="head">Webcam 邊緣監控服務</text>
  <text x="645" y="378" text-anchor="middle" class="text">連續 3 影格共識判定</text>
  <text x="645" y="408" text-anchor="middle" class="text">過濾晃動、快取異常狀態</text>

  <!-- 2B. Cascade Diagnosis Dispatch Service (Right) -->
  <rect x="810" y="295" width="270" height="150" rx="8" class="service"/>
  <text x="945" y="342" text-anchor="middle" class="head">階層式診斷調度服務</text>
  <text x="945" y="378" text-anchor="middle" class="text">步驟 1: 優先本地快篩</text>
  <text x="945" y="408" text-anchor="middle" class="text">步驟 2: 未命中 Gemini 兜底</text>

  <!-- 3. Decision Integration & RAG Core -->
  <rect x="510" y="480" width="570" height="130" rx="8" class="safety"/>
  <text x="795" y="522" text-anchor="middle" class="head">決策整合與 RAG 校驗核心</text>
  <text x="795" y="558" text-anchor="middle" class="text">步驟 3: FAISS 向量檢索比對農業部官方資料庫</text>
  <text x="795" y="588" text-anchor="middle" class="text">動態精準處方生成；信心度門檻評估 (≥ 70%)</text>

  <!-- 4. Diary, Feedback & Training Data Operations -->
  <rect x="510" y="645" width="570" height="105" rx="8" class="service"/>
  <text x="795" y="688" text-anchor="middle" class="head">日誌與回饋數據管理服務</text>
  <text x="795" y="722" text-anchor="middle" class="text">診斷病歷存檔、檢索與個人備忘筆記維護</text>

  <!-- ================= LANE 3: 資料層與外部服務 ================= -->
  <rect x="1160" y="110" width="390" height="730" rx="8" class="lane-box"/>
  <text x="1355" y="152" text-anchor="middle" class="lane">資料層與外部服務</text>

  <!-- 1. MySQL Relational DB -->
  <rect x="1196" y="185" width="318" height="100" rx="8" class="external"/>
  <text x="1355" y="228" text-anchor="middle" class="head">MySQL 關聯式資料庫</text>
  <text x="1355" y="262" text-anchor="middle" class="text">帳號、診斷病歷與警報紀錄</text>

  <!-- 2. Local ConvNeXt Fast Screen (Step 1) -->
  <rect x="1196" y="315" width="318" height="105" rx="8" class="ai-box"/>
  <text x="1355" y="358" text-anchor="middle" class="head">本地自訓 ConvNeXt 模型</text>
  <text x="1355" y="392" text-anchor="middle" class="text">步驟 1: 特定作物病斑分類快篩</text>

  <!-- 3. Gemini Multimodal Fallback (Step 2) -->
  <rect x="1196" y="435" width="318" height="105" rx="8" class="ai-box"/>
  <text x="1355" y="478" text-anchor="middle" class="head">Gemini 3.8 Flash 雲端模型</text>
  <text x="1355" y="512" text-anchor="middle" class="text">步驟 2: 多模態影像初判與兜底</text>

  <!-- 4. Agricultural Knowledge Base & FAISS (Step 3) -->
  <rect x="1196" y="555" width="318" height="100" rx="8" class="external"/>
  <text x="1355" y="598" text-anchor="middle" class="head">官方知識庫與 FAISS</text>
  <text x="1355" y="632" text-anchor="middle" class="text">步驟 3: 農業部病害知識檢索</text>

  <!-- 5. External Services: SMTP, Weather -->
  <rect x="1196" y="670" width="318" height="95" rx="8" class="external"/>
  <text x="1355" y="710" text-anchor="middle" class="head">外部支援服務 (SMTP / CWA)</text>
  <text x="1355" y="744" text-anchor="middle" class="text">Gmail SMTP 驗證與警報推播</text>

  <!-- ================= Connecting Flows & Arrows ================= -->
  <!-- 1. Lane 1 -> Lane 2 -->
  <path d="M394 225 H510" class="line"/>
  <path d="M394 410 H510" class="line"/>
  <path d="M394 595 H510" class="line"/>
  <text x="452" y="216" text-anchor="middle" class="halo-text">HTTPS / JSON</text>
  <text x="452" y="401" text-anchor="middle" class="halo-text">Frame Stream</text>
  <text x="452" y="586" text-anchor="middle" class="halo-text">REST / Admin</text>

  <!-- 2. Inside Lane 2 -->
  <path d="M645 265 V295" class="line"/>
  <path d="M945 265 V295" class="line"/>
  <path d="M645 445 V480" class="line"/>
  <path d="M945 445 V480" class="line"/>
  <path d="M795 610 V645" class="line"/>

  <!-- 3. Lane 2 <-> Lane 3 Connections -->
  <!-- Flow 1: API Layer <-> MySQL (y=215 & y=245) -->
  <path d="M1080 215 H1196" class="line"/>
  <path d="M1196 245 H1080" class="return"/>
  <text x="1138" y="204" text-anchor="middle" class="flow-label">查詢／驗證</text>

  <!-- Flow 2: 診斷調度 -> 本地 ConvNeXt (y=348 & y=380) -->
  <path d="M1080 348 H1196" class="line"/>
  <path d="M1196 380 H1080" class="return"/>
  <text x="1138" y="336" text-anchor="middle" class="flow-label">步驟 1: 本地快篩</text>
  <text x="1138" y="398" text-anchor="middle" class="flow-label">回傳病斑特徵</text>

  <!-- Flow 3: 診斷調度 -> Gemini 兜底 (y=468 & y=500) -->
  <path d="M1080 468 H1196" class="line"/>
  <path d="M1196 500 H1080" class="return"/>
  <text x="1138" y="456" text-anchor="middle" class="flow-label">步驟 2: 雲端兜底</text>
  <text x="1138" y="518" text-anchor="middle" class="flow-label">回傳多模態初判</text>

  <!-- Flow 4: 決策整合核心 <-> FAISS RAG (y=580 & y=612) -->
  <path d="M1080 580 H1196" class="line"/>
  <path d="M1196 612 H1080" class="return"/>
  <text x="1138" y="568" text-anchor="middle" class="flow-label">步驟 3: RAG 檢索</text>
  <text x="1138" y="630" text-anchor="middle" class="flow-label">回傳官方處方</text>

  <!-- Flow 5: 決策整合核心 -> SMTP 外部郵件 (x=1168 track) -->
  <path d="M1080 600 H1168 V700 H1196" class="line"/>
  <text x="1168" y="692" text-anchor="middle" class="flow-label">觸發警報</text>

  <!-- Flow 6: 日誌管理服務 -> MySQL (x=1148 track up to MySQL) -->
  <path d="M1080 675 H1148 V270 H1196" class="line"/>
  <text x="1148" y="262" text-anchor="middle" class="flow-label">寫入紀錄</text>

  <!-- Flow 7: CWA 氣象開放資料 -> 服務層 (y=735) -->
  <path d="M1196 735 H1080" class="return"/>
  <text x="1138" y="726" text-anchor="middle" class="flow-label">氣象回傳</text>

</svg>