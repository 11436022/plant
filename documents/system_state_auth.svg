<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1210 680" width="1210" height="680">
  <defs>
    <style>
      .title { font-family: 'Microsoft JhengHei', sans-serif; font-size: 21px; font-weight: bold; fill: #1A281E; }
      .group-title { font-family: 'Microsoft JhengHei', sans-serif; font-size: 14px; font-weight: bold; fill: #223827; }
      .state-name { font-family: 'Microsoft JhengHei', sans-serif; font-size: 13px; font-weight: bold; fill: #1A281E; text-anchor: middle; }
      .diamond-text { font-family: 'Microsoft JhengHei', sans-serif; font-size: 11px; font-weight: bold; fill: #1A281E; text-anchor: middle; }
      .action-text { font-family: 'Microsoft JhengHei', sans-serif; font-size: 11px; fill: #2D3748; }
      .transition-text { font-family: 'Microsoft JhengHei', sans-serif; font-size: 11px; fill: #2D5837; font-weight: bold; }
      .guard-text { font-family: 'Microsoft JhengHei', sans-serif; font-size: 10px; fill: #993B36; font-style: italic; font-weight: bold; }
      
      /* Composite Groups */
      .composite-bg { fill: #F8FAF7; stroke: #B5C6B3; stroke-width: 1.5; stroke-dasharray: 6,4; rx: 8; ry: 8; }
      .composite-header { fill: #E5EDE3; stroke: #B5C6B3; stroke-width: 1.5; }
      
      /* Standard States (Streamlined Compact) */
      .state-box { fill: #FFFFFF; stroke: #4F7057; stroke-width: 1.4; rx: 6; ry: 6; }
      .state-header { fill: #DDEAD7; stroke: #4F7057; stroke-width: 1.4; }
      
      /* Choice Diamond */
      .choice-diamond { fill: #DDEAD7; stroke: #4F7057; stroke-width: 1.5; }
      
      /* Error States */
      .error-state-box { fill: #FCF7F6; stroke: #BA5D57; stroke-width: 1.4; rx: 6; ry: 6; }
      .error-state-header { fill: #F8E2E0; stroke: #BA5D57; stroke-width: 1.4; }
      
      /* Lines */
      .line { stroke: #334035; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
      .line-inter { stroke: #4F7057; stroke-width: 1.5; fill: none; stroke-dasharray: 6,4; marker-end: url(#green-arrow); }
      .line-back { stroke: #BA5D57; stroke-width: 1.3; stroke-dasharray: 5,4; fill: none; marker-end: url(#red-arrow); }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#334035" />
    </marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#4F7057" />
    </marker>
    <marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#BA5D57" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Diagram Title -->
  <text x="605" y="32" class="title" text-anchor="middle">圖 7-4-1 帳號註冊與認證登入 狀態圖 (State Diagram)</text>

  <!-- ========================================================================= -->
  <!-- 1. COMPOSITE STATE 1: REGISTRATION & VERIFICATION (x=25, y=55, w=560)     -->
  <!-- ========================================================================= -->
  <g transform="translate(25, 55)">
    <rect width="560" height="605" class="composite-bg" />
    <path d="M 0 8 Q 0 0 8 0 L 552 0 Q 560 0 560 8 L 560 30 L 0 30 Z" class="composite-header" />
    <text x="14" y="20" class="group-title">狀態群組 1：帳號註冊與信箱驗證 (Registration &amp; Verification)</text>

    <!-- Initial State -->
    <circle cx="135" cy="46" r="8" fill="#1A281E" />
    <line x1="135" y1="54" x2="135" y2="68" class="line" />

    <!-- State S1: 未註冊 (Unregistered) -->
    <g transform="translate(20, 68)">
      <rect width="230" height="56" class="state-box" />
      <path d="M 0 6 Q 0 0 6 0 L 224 0 Q 230 0 230 6 L 230 22 L 0 22 Z" class="state-header" />
      <text x="115" y="16" class="state-name">未註冊 (Unregistered)</text>
      <text x="10" y="42" class="action-text">do / 填寫帳號、信箱與密碼表單</text>
    </g>

    <!-- Transition S1 -> S2 -->
    <line x1="135" y1="124" x2="135" y2="150" class="line" />
    <text x="145" y="141" class="transition-text">點擊註冊 [格式正確]</text>

    <!-- State S2: 註冊處理與寄信 (Registering) -->
    <g transform="translate(20, 150)">
      <rect width="230" height="66" class="state-box" />
      <path d="M 0 6 Q 0 0 6 0 L 224 0 Q 230 0 230 6 L 230 22 L 0 22 Z" class="state-header" />
      <text x="115" y="16" class="state-name">註冊處理與寄信 (Registering)</text>
      <text x="10" y="40" class="action-text">do / Bcrypt 密碼雜湊與生成 Token</text>
      <text x="10" y="56" class="action-text">exit / SMTP 寄出專屬郵件啟用信</text>
    </g>

    <!-- Transition S2 -> Diamond 1 -->
    <line x1="135" y1="216" x2="135" y2="236" class="line" />

    <!-- Choice Diamond 1: 查核結果 (cx=135, cy=252; w=84, h=34) -->
    <polygon points="135,236 177,252 135,268 93,252" class="choice-diamond" />
    <text x="135" y="256" class="diamond-text">唯一性查核</text>

    <!-- Branch Right: S2/Diamond 1 -> Error E1 -->
    <line x1="177" y1="252" x2="348" y2="252" class="line" />
    <text x="260" y="244" class="guard-text" text-anchor="middle">[帳號/信箱重複]</text>

    <!-- Error State E1: 註冊失敗 (Reg_Failed) -->
    <g transform="translate(350, 222)">
      <rect width="195" height="58" class="error-state-box" />
      <path d="M 0 6 Q 0 0 6 0 L 189 0 Q 195 0 195 6 L 195 22 L 0 22 Z" class="error-state-header" />
      <text x="97" y="16" class="state-name" fill="#85312C">註冊失敗 (Reg_Failed)</text>
      <text x="10" y="43" class="action-text" fill="#85312C">entry / 回傳 400 (帳號信箱已存在)</text>
    </g>

    <!-- Loop back from E1 to S1 -->
    <path d="M 448 222 L 448 96 L 252 96" class="line-back" />
    <text x="350" y="88" class="guard-text" text-anchor="middle">返回修正表單</text>

    <!-- Branch Down: Diamond 1 -> State S3 -->
    <line x1="135" y1="268" x2="135" y2="304" class="line" />
    <text x="145" y="290" class="transition-text">[帳號可用 / 寄信成功]</text>

    <!-- State S3: 等待信箱驗證 (Awaiting_Verify) -->
    <g transform="translate(20, 304)">
      <rect width="230" height="66" class="state-box" />
      <path d="M 0 6 Q 0 0 6 0 L 224 0 Q 230 0 230 6 L 230 22 L 0 22 Z" class="state-header" />
      <text x="115" y="16" class="state-name">等待信箱驗證 (Awaiting_Verify)</text>
      <text x="10" y="40" class="action-text">entry / 提示查收驗證信 (24h有效)</text>
      <text x="10" y="56" class="action-text">do / 接收 GET /verify-email 請求</text>
    </g>

    <!-- Transition S3 -> Diamond 2 -->
    <line x1="135" y1="370" x2="135" y2="390" class="line" />

    <!-- Choice Diamond 2: Token核對 (cx=135, cy=406; w=84, h=34) -->
    <polygon points="135,390 177,406 135,422 93,406" class="choice-diamond" />
    <text x="135" y="410" class="diamond-text">Token核對</text>

    <!-- Branch Right: Diamond 2 -> Error E2 -->
    <line x1="177" y1="406" x2="348" y2="406" class="line" />
    <text x="260" y="398" class="guard-text" text-anchor="middle">[連結過期/失效]</text>

    <!-- Error State E2: 驗證失敗 (Verify_Failed) -->
    <g transform="translate(350, 376)">
      <rect width="195" height="58" class="error-state-box" />
      <path d="M 0 6 Q 0 0 6 0 L 189 0 Q 195 0 195 6 L 195 22 L 0 22 Z" class="error-state-header" />
      <text x="97" y="16" class="state-name" fill="#85312C">驗證失敗 (Verify_Failed)</text>
      <text x="10" y="43" class="action-text" fill="#85312C">entry / 回傳 400 (Token已失效)</text>
    </g>

    <!-- Loop back from E2 to S3 -->
    <path d="M 448 434 L 448 450 L 290 450 L 290 338 L 252 338" class="line-back" />
    <text x="370" y="445" class="guard-text" text-anchor="middle">申請重發信件</text>

    <!-- Branch Down: Diamond 2 -> State S4 -->
    <line x1="135" y1="422" x2="135" y2="466" class="line" />
    <text x="145" y="448" class="transition-text">[Token 核對成功]</text>

    <!-- State S4: 帳號已啟用 (Activated) -->
    <g transform="translate(20, 466)">
      <rect width="230" height="66" class="state-box" />
      <path d="M 0 6 Q 0 0 6 0 L 224 0 Q 230 0 230 6 L 230 22 L 0 22 Z" class="state-header" />
      <text x="115" y="16" class="state-name">帳號已啟用 (Activated)</text>
      <text x="10" y="40" class="action-text">entry / 更新 is_email_verified=1</text>
      <text x="10" y="56" class="action-text">exit / 自動導向登入介面</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- INTER-COMPOSITE TRANSITION: Group 1 -> Group 2                           -->
  <!-- ========================================================================= -->
  <path d="M 160 587 L 160 642 L 605 642 L 605 142 L 643 142" class="line-inter" />
  <text x="382" y="632" class="transition-text" text-anchor="middle">帳號啟用成功 / 導向登入介面</text>

  <!-- ========================================================================= -->
  <!-- 2. COMPOSITE STATE 2: AUTHENTICATION & SESSION (x=625, y=55, w=560)      -->
  <!-- ========================================================================= -->
  <g transform="translate(625, 55)">
    <rect width="560" height="605" class="composite-bg" />
    <path d="M 0 8 Q 0 0 8 0 L 552 0 Q 560 0 560 8 L 560 30 L 0 30 Z" class="composite-header" />
    <text x="14" y="20" class="group-title">狀態群組 2：身分認證與會話授權 (Authentication &amp; Session)</text>

    <!-- Initial State -->
    <circle cx="135" cy="46" r="8" fill="#1A281E" />
    <line x1="135" y1="54" x2="135" y2="68" class="line" />

    <!-- State S5: 未登入 (Logged_Out) -->
    <g transform="translate(20, 68)">
      <rect width="230" height="56" class="state-box" />
      <path d="M 0 6 Q 0 0 6 0 L 224 0 Q 230 0 230 6 L 230 22 L 0 22 Z" class="state-header" />
      <text x="115" y="16" class="state-name">未登入 (Logged_Out)</text>
      <text x="10" y="42" class="action-text">do / 輸入帳號與密碼</text>
    </g>

    <!-- Transition S5 -> S6 -->
    <line x1="135" y1="124" x2="135" y2="150" class="line" />
    <text x="145" y="141" class="transition-text">點擊登入 [表單已填寫]</text>

    <!-- State S6: 憑證校驗中 (Verifying) -->
    <g transform="translate(20, 150)">
      <rect width="230" height="66" class="state-box" />
      <path d="M 0 6 Q 0 0 6 0 L 224 0 Q 230 0 230 6 L 230 22 L 0 22 Z" class="state-header" />
      <text x="115" y="16" class="state-name">憑證校驗中 (Verifying)</text>
      <text x="10" y="40" class="action-text">do / Bcrypt 密碼比對演算</text>
      <text x="10" y="56" class="action-text">do / 查核信箱已驗證標記 (is_verified)</text>
    </g>

    <!-- Transition S6 -> Diamond 3 -->
    <line x1="135" y1="216" x2="135" y2="236" class="line" />

    <!-- Choice Diamond 3: 身分核對 (cx=135, cy=252; w=84, h=34) -->
    <polygon points="135,236 177,252 135,268 93,252" class="choice-diamond" />
    <text x="135" y="256" class="diamond-text">身分核對</text>

    <!-- Branch Right: Diamond 3 -> Error E3 -->
    <line x1="177" y1="252" x2="348" y2="252" class="line" />
    <text x="260" y="244" class="guard-text" text-anchor="middle">[密碼錯/未驗證]</text>

    <!-- Error State E3: 登入失敗 (Login_Failed) -->
    <g transform="translate(350, 222)">
      <rect width="195" height="58" class="error-state-box" />
      <path d="M 0 6 Q 0 0 6 0 L 189 0 Q 195 0 195 6 L 195 22 L 0 22 Z" class="error-state-header" />
      <text x="97" y="16" class="state-name" fill="#85312C">登入失敗 (Login_Failed)</text>
      <text x="10" y="43" class="action-text" fill="#85312C">entry / 回傳 400 (帳密錯) 或 403 (未驗)</text>
    </g>

    <!-- Loop back from E3 to S5 -->
    <path d="M 448 222 L 448 96 L 252 96" class="line-back" />
    <text x="350" y="88" class="guard-text" text-anchor="middle">返回重新輸入</text>

    <!-- Branch Down: Diamond 3 -> State S7 -->
    <line x1="135" y1="268" x2="135" y2="304" class="line" />
    <text x="145" y="290" class="transition-text">[密碼相符且已驗證]</text>

    <!-- State S7: 簽發 Token (JWT_Issued) -->
    <g transform="translate(20, 304)">
      <rect width="230" height="66" class="state-box" />
      <path d="M 0 6 Q 0 0 6 0 L 224 0 Q 230 0 230 6 L 230 22 L 0 22 Z" class="state-header" />
      <text x="115" y="16" class="state-name">簽發 Token (JWT_Issued)</text>
      <text x="10" y="40" class="action-text">do / 生成 HS256 JWT Access Token</text>
      <text x="10" y="56" class="action-text">exit / 回傳 Bearer 授權憑證</text>
    </g>

    <!-- Transition S7 -> S8 -->
    <line x1="135" y1="370" x2="135" y2="408" class="line" />
    <text x="145" y="392" class="transition-text">安全儲存憑證</text>

    <!-- State S8: 已授權就緒 (Auth_Active) -->
    <g transform="translate(20, 408)">
      <rect width="230" height="66" class="state-box" />
      <path d="M 0 6 Q 0 0 6 0 L 224 0 Q 230 0 230 6 L 230 22 L 0 22 Z" class="state-header" />
      <text x="115" y="16" class="state-name">已授權就緒 (Auth_Active)</text>
      <text x="10" y="40" class="action-text">entry / 存入安全 SharedPreferences</text>
      <text x="10" y="56" class="action-text">do / 解鎖主功能選單 (診斷/歷史/筆記)</text>
    </g>

    <!-- Transition S8 -> Final State [*] -->
    <line x1="252" y1="441" x2="400" y2="441" class="line" />
    <text x="325" y="432" class="transition-text" text-anchor="middle">會話建立完成</text>

    <!-- Final State -->
    <circle cx="415" cy="441" r="11" stroke="#1A281E" stroke-width="1.8" fill="none" />
    <circle cx="415" cy="441" r="6" fill="#1A281E" />
    <text x="415" y="468" class="action-text" text-anchor="middle" font-weight="bold">會話就緒 [*]</text>
  </g>
</svg>
