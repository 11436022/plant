<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1210 680" width="1210" height="680">
  <defs>
    <style>
      <![CDATA[
      .title { font-family: 'Times New Roman', 'DFKai-SB', '標楷體', 'BiauKai', serif; font-size: 22px; font-weight: bold; fill: #0f172a; }
      .group-title { font-family: 'Times New Roman', 'DFKai-SB', '標楷體', 'BiauKai', serif; font-size: 14.5px; font-weight: bold; fill: #1e293b; }
      .state-name { font-family: 'Times New Roman', 'DFKai-SB', '標楷體', 'BiauKai', serif; font-size: 14px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
      .action-text { font-family: 'Times New Roman', 'DFKai-SB', '標楷體', 'BiauKai', serif; font-size: 12px; fill: #000000; }
      .transition-text { font-family: 'Times New Roman', 'DFKai-SB', '標楷體', serif; font-size: 11.5px; fill: #1e40af; font-weight: bold; }
      .guard-text { font-family: 'Times New Roman', 'DFKai-SB', '標楷體', serif; font-size: 11.5px; fill: #b91c1c; font-style: italic; font-weight: bold; }
      
      /* Subtle Academic Composite Group */
      .composite-bg { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 6,4; rx: 8; ry: 8; }
      .composite-header { fill: #e2e8f0; stroke: #94a3b8; stroke-width: 1.5; }
      
      /* Standard States (Crisp Refreshing Blue) - ONLY STATES HAVE BOXES */
      .state-box { fill: #ffffff; stroke: #2563eb; stroke-width: 1.5; rx: 6; ry: 6; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.06)); }
      .state-header { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
      
      /* Error States (Warning Coral Red) */
      .error-state-box { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.5; rx: 6; ry: 6; }
      .error-state-header { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
      
      /* Lines and Connectors - 100% UNBROKEN */
      .line { stroke: #1e293b; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
      .line-inter { stroke: #2563eb; stroke-width: 1.5; fill: none; stroke-dasharray: 6,4; marker-end: url(#blue-arrow); }
      .line-back { stroke: #dc2626; stroke-width: 1.4; stroke-dasharray: 5,4; fill: none; marker-end: url(#red-arrow); }
      ]]>
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#1e293b" />
    </marker>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
    <marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Diagram Title -->
  <text x="605" y="32" class="title" text-anchor="middle">圖 7-4-1 帳號註冊與認證登入 狀態圖 (State Diagram)</text>

  <!-- ========================================================================= -->
  <!-- 1. COMPOSITE STATE 1: REGISTRATION & VERIFICATION (x=25, y=55, w=560)     -->
  <!-- ========================================================================= -->
  <g transform="translate(25, 55)">
    <rect width="560" height="605" class="composite-bg" />
    <path d="M 0 8 Q 0 0 8 0 L 552 0 Q 560 0 560 8 L 560 30 L 0 30 Z" class="composite-header" />
    <text x="14" y="20" class="group-title">狀態群組 1：帳號註冊與信箱驗證 (Registration &amp; Verification)</text>

    <!-- Initial State -->
    <circle cx="126" cy="48" r="8" fill="#0f172a" />
    <line x1="126" y1="56" x2="126" y2="70" class="line" />

    <!-- State S1: 未註冊 (Unregistered) -->
    <g transform="translate(18, 70)">
      <rect width="216" height="78" class="state-box" />
      <path d="M 0 6 Q 0 0 6 0 L 210 0 Q 216 0 216 6 L 216 24 L 0 24 Z" class="state-header" />
      <text x="108" y="17" class="state-name">未註冊 (Unregistered)</text>
      <text x="10" y="44" class="action-text">entry / 載入註冊表單介面</text>
      <text x="10" y="64" class="action-text">do / 輸入帳號、信箱與密碼</text>
    </g>

    <!-- Transition S1 -> S2: Unbroken Vertical Line at x=75, Pure Text at right -->
    <line x1="75" y1="148" x2="75" y2="183" class="line" />
    <text x="90" y="170" class="transition-text">點擊註冊 [格式正確]</text>

    <!-- State S2: 註冊處理與寄信 (Registering) -->
    <g transform="translate(18, 185)">
      <rect width="216" height="102" class="state-box" />
      <path d="M 0 6 Q 0 0 6 0 L 210 0 Q 216 0 216 6 L 216 24 L 0 24 Z" class="state-header" />
      <text x="108" y="17" class="state-name">註冊處理與寄信 (Registering)</text>
      <text x="10" y="42" class="action-text">do / 查核帳號與信箱唯一性 (DB)</text>
      <text x="10" y="60" class="action-text">do / Bcrypt 密碼安全雜湊演算</text>
      <text x="10" y="78" class="action-text">do / 產生 URL-safe Token (32 Bytes)</text>
      <text x="10" y="96" class="action-text">do / SMTP 寄出專屬郵件啟用連結</text>
    </g>

    <!-- Transition S2 -> Error E1: Unbroken Horizontal Line at y=236, Pure Guard text ABOVE line -->
    <line x1="234" y1="236" x2="348" y2="236" class="line" />
    <text x="291" y="216" class="guard-text" text-anchor="middle">[帳號/信箱重複]</text>

    <!-- Error State E1: 註冊失敗 (Reg_Failed) -->
    <g transform="translate(350, 202)">
      <rect width="195" height="78" class="error-state-box" />
      <path d="M 0 6 Q 0 0 6 0 L 189 0 Q 195 0 195 6 L 195 24 L 0 24 Z" class="error-state-header" />
      <text x="97" y="17" class="state-name" fill="#991b1b">註冊失敗 (Reg_Failed)</text>
      <text x="10" y="43" class="action-text" fill="#b91c1c">entry / 回傳 400 Bad Request</text>
      <text x="10" y="63" class="action-text" fill="#b91c1c">do / 提示帳號或信箱已被使用</text>
    </g>

    <!-- Loop back from E1 to S1: Unbroken Red dashed line, Pure Guard text ABOVE horizontal line -->
    <path d="M 448 202 L 448 109 L 236 109" class="line-back" />
    <text x="342" y="95" class="guard-text" text-anchor="middle">返回修正表單</text>

    <!-- Transition S2 -> S3: Unbroken Vertical Line at x=75, Pure Text at right -->
    <line x1="75" y1="287" x2="75" y2="323" class="line" />
    <text x="90" y="310" class="transition-text">[驗證郵件寄出成功]</text>

    <!-- State S3: 等待信箱驗證 (Awaiting_Verify) -->
    <g transform="translate(18, 325)">
      <rect width="216" height="102" class="state-box" />
      <path d="M 0 6 Q 0 0 6 0 L 210 0 Q 216 0 216 6 L 216 24 L 0 24 Z" class="state-header" />
      <text x="108" y="17" class="state-name">等待信箱驗證 (Awaiting_Verify)</text>
      <text x="10" y="42" class="action-text">entry / 提示查收驗證信 (24h有效)</text>
      <text x="10" y="60" class="action-text">do / 使用者於信箱點擊啟用連結</text>
      <text x="10" y="78" class="action-text">do / 發送 GET verify-email 請求</text>
      <text x="10" y="96" class="action-text">do / (可選) 申請重新補寄驗證信</text>
    </g>

    <!-- Transition S3 -> Error E2: Unbroken Horizontal Line at y=375, Pure Guard text ABOVE line -->
    <line x1="234" y1="375" x2="348" y2="375" class="line" />
    <text x="291" y="355" class="guard-text" text-anchor="middle">[連結失效]</text>

    <!-- Error State E2: 驗證失敗 (Verify_Failed) -->
    <g transform="translate(350, 342)">
      <rect width="195" height="78" class="error-state-box" />
      <path d="M 0 6 Q 0 0 6 0 L 189 0 Q 195 0 195 6 L 195 24 L 0 24 Z" class="error-state-header" />
      <text x="97" y="17" class="state-name" fill="#991b1b">驗證失敗 (Verify_Failed)</text>
      <text x="10" y="43" class="action-text" fill="#b91c1c">entry / 回傳 400 (Token失效或逾期)</text>
      <text x="10" y="63" class="action-text" fill="#b91c1c">do / 提示重新申請補寄驗證信</text>
    </g>

    <!-- Loop back from E2 to S3: Unbroken Red dashed line, Pure Guard text ABOVE horizontal line -->
    <path d="M 448 420 L 448 442 L 280 442 L 280 395 L 236 395" class="line-back" />
    <text x="364" y="428" class="guard-text" text-anchor="middle">申請重發信件</text>

    <!-- Transition S3 -> S4: Unbroken Vertical Line at x=75, Pure Text at right -->
    <line x1="75" y1="427" x2="75" y2="463" class="line" />
    <text x="90" y="450" class="transition-text">[Token 驗證核對成功]</text>

    <!-- State S4: 帳號已啟用 (Activated) -->
    <g transform="translate(18, 465)">
      <rect width="216" height="102" class="state-box" />
      <path d="M 0 6 Q 0 0 6 0 L 210 0 Q 216 0 216 6 L 216 24 L 0 24 Z" class="state-header" />
      <text x="108" y="17" class="state-name">帳號已啟用 (Activated)</text>
      <text x="10" y="42" class="action-text">entry / 更新 is_email_verified=1</text>
      <text x="10" y="60" class="action-text">do / 記錄 email_verified_at 驗證時間</text>
      <text x="10" y="78" class="action-text">do / 標記 used_at 作廢一次性Token</text>
      <text x="10" y="96" class="action-text">exit / 自動導向登入介面</text>
    </g>
  </g>


  <!-- ========================================================================= -->
  <!-- INTER-COMPOSITE TRANSITION: Group 1 -> Group 2 (Planar, ZERO Crossing)   -->
  <!-- Unbroken Blue dashed line along y=642; Pure Text placed cleanly ABOVE line -->
  <!-- ========================================================================= -->
  <path d="M 151 622 L 151 642 L 605 642 L 605 164 L 641 164" class="line-inter" />
  <text x="378" y="630" class="transition-text" text-anchor="middle">帳號啟用成功 / 導向登入介面</text>


  <!-- ========================================================================= -->
  <!-- 2. COMPOSITE STATE 2: AUTHENTICATION & SESSION (x=625, y=55, w=560)      -->
  <!-- ========================================================================= -->
  <g transform="translate(625, 55)">
    <rect width="560" height="605" class="composite-bg" />
    <path d="M 0 8 Q 0 0 8 0 L 552 0 Q 560 0 560 8 L 560 30 L 0 30 Z" class="composite-header" />
    <text x="14" y="20" class="group-title">狀態群組 2：身分認證與會話授權 (Authentication &amp; Session)</text>

    <!-- Initial State -->
    <circle cx="126" cy="48" r="8" fill="#0f172a" />
    <line x1="126" y1="56" x2="126" y2="70" class="line" />

    <!-- State S5: 未登入 (Logged_Out) -->
    <g transform="translate(18, 70)">
      <rect width="216" height="78" class="state-box" />
      <path d="M 0 6 Q 0 0 6 0 L 210 0 Q 216 0 216 6 L 216 24 L 0 24 Z" class="state-header" />
      <text x="108" y="17" class="state-name">未登入 (Logged_Out)</text>
      <text x="10" y="44" class="action-text">entry / 呈現登入表單介面</text>
      <text x="10" y="64" class="action-text">do / 輸入帳號與密碼</text>
    </g>

    <!-- Transition S5 -> S6: Unbroken Vertical Line at x=75, Pure Text at right -->
    <line x1="75" y1="148" x2="75" y2="183" class="line" />
    <text x="90" y="170" class="transition-text">點擊登入 [表單已填寫]</text>

    <!-- State S6: 憑證校驗中 (Verifying) -->
    <g transform="translate(18, 185)">
      <rect width="216" height="102" class="state-box" />
      <path d="M 0 6 Q 0 0 6 0 L 210 0 Q 216 0 216 6 L 216 24 L 0 24 Z" class="state-header" />
      <text x="108" y="17" class="state-name">憑證校驗中 (Verifying)</text>
      <text x="10" y="42" class="action-text">do / 查詢帳號使用者是否存在</text>
      <text x="10" y="60" class="action-text">do / Bcrypt 密碼雜湊安全核對</text>
      <text x="10" y="78" class="action-text">do / 查核 is_email_verified 驗證標記</text>
      <text x="10" y="96" class="action-text">do / 未驗證信箱者拋出 403 拒絕</text>
    </g>

    <!-- Transition S6 -> Error E3: Unbroken Horizontal Line at y=236, Pure Guard text ABOVE line -->
    <line x1="234" y1="236" x2="348" y2="236" class="line" />
    <text x="291" y="216" class="guard-text" text-anchor="middle">[驗證未過]</text>

    <!-- Error State E3: 登入失敗 (Login_Failed) -->
    <g transform="translate(350, 202)">
      <rect width="195" height="78" class="error-state-box" />
      <path d="M 0 6 Q 0 0 6 0 L 189 0 Q 195 0 195 6 L 195 24 L 0 24 Z" class="error-state-header" />
      <text x="97" y="17" class="state-name" fill="#991b1b">登入失敗 (Login_Failed)</text>
      <text x="10" y="43" class="action-text" fill="#b91c1c">entry / 回傳 400 帳密錯 / 403 未驗</text>
      <text x="10" y="63" class="action-text" fill="#b91c1c">do / 提示重新輸入或前往信箱啟用</text>
    </g>

    <!-- Loop back from E3 to S5: Unbroken Red dashed line, Pure Guard text ABOVE horizontal line -->
    <path d="M 448 202 L 448 109 L 236 109" class="line-back" />
    <text x="342" y="95" class="guard-text" text-anchor="middle">返回重新輸入</text>

    <!-- Transition S6 -> S7: Unbroken Vertical Line at x=75, Pure Text at right -->
    <line x1="75" y1="287" x2="75" y2="323" class="line" />
    <text x="90" y="310" class="transition-text">[密碼相符且信箱已驗證]</text>

    <!-- State S7: 簽發 Token (JWT_Issued) -->
    <g transform="translate(18, 325)">
      <rect width="216" height="102" class="state-box" />
      <path d="M 0 6 Q 0 0 6 0 L 210 0 Q 216 0 216 6 L 216 24 L 0 24 Z" class="state-header" />
      <text x="108" y="17" class="state-name">簽發 Token (JWT_Issued)</text>
      <text x="10" y="42" class="action-text">do / 生成 HS256 簽署 Access Token</text>
      <text x="10" y="60" class="action-text">do / 寫入 sub, user_id 與 role 權限</text>
      <text x="10" y="78" class="action-text">do / 設定過期時間 (24小時 / 1440分)</text>
      <text x="10" y="96" class="action-text">do / 回傳 Bearer Access Token</text>
    </g>

    <!-- Transition S7 -> S8: Unbroken Vertical Line at x=75, Pure Text at right -->
    <line x1="75" y1="427" x2="75" y2="463" class="line" />
    <text x="90" y="450" class="transition-text">客戶端安全儲存憑證</text>

    <!-- State S8: 已授權就緒 (Auth_Active) -->
    <g transform="translate(18, 465)">
      <rect width="216" height="102" class="state-box" />
      <path d="M 0 6 Q 0 0 6 0 L 210 0 Q 216 0 216 6 L 216 24 L 0 24 Z" class="state-header" />
      <text x="108" y="17" class="state-name">已授權就緒 (Auth_Active)</text>
      <text x="10" y="42" class="action-text">entry / 存入安全 SharedPreferences</text>
      <text x="10" y="60" class="action-text">do / 進入 App 主畫面 (拍照/歷史/筆記)</text>
      <text x="10" y="78" class="action-text">do / 請求自動附加 Bearer Token</text>
      <text x="10" y="96" class="action-text">exit / 登出時清除本機憑證</text>
    </g>

    <!-- Transition S8 -> Final State [*]: Unbroken Horizontal Line at y=516, Pure Text ABOVE line -->
    <line x1="234" y1="516" x2="433" y2="516" class="line" />
    <text x="334" y="502" class="transition-text" text-anchor="middle">會話建立就緒</text>

    <!-- Final State -->
    <circle cx="448" cy="516" r="11" stroke="#0f172a" stroke-width="1.8" fill="none" />
    <circle cx="448" cy="516" r="6" fill="#0f172a" />
    <text x="448" y="542" class="action-text" text-anchor="middle" font-weight="bold">會話就緒 [*]</text>
  </g>
</svg>