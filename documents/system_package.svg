      .dep-label-start { font-family: 'Microsoft JhengHei', sans-serif; font-size: 11.5px; fill: #2D5837; font-weight: bold; text-anchor: start; paint-order: stroke fill; stroke: #ffffff; stroke-width: 3px; stroke-linejoin: round; }
      
