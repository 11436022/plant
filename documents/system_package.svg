      .pkg-body { fill: #F8FAF7; stroke: #B5C6B3; stroke-width: 1.3; rx: 6; ry: 6; }
      
      .subpkg-tab { fill: #DDEAD7; stroke: #4F7057; stroke-width: 1.2; }
      .subpkg-body { fill: #ffffff; stroke: #4F7057; stroke-width: 1.2; rx: 4; ry: 4; }
      
      .ext-tab { fill: #E5EDE3; stroke: #4F7057; stroke-width: 1.2; }
      .ext-body { fill: #ffffff; stroke: #4F7057; stroke-width: 1.2; rx: 4; ry: 4; }
      
      .dep-line { stroke: #334035; stroke-width: 1.3; stroke-dasharray: 4,3.5; fill: none; marker-end: url(#arrow); }
      .http-line { stroke: #4F7057; stroke-width: 1.5; stroke-dasharray: 5,3.5; fill: none; marker-start: url(#green-arrow-start); marker-end: url(#green-arrow-end); }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#334035" />
    </marker>
    <marker id="green-arrow-end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#4F7057" />
    </marker>
    <marker id="green-arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 10 1.5 L 0 5 L 10 8.5 z" fill="#4F7057" />
