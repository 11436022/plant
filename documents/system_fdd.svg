  <rect x="64" y="718" width="1472" height="116" rx="8" fill="#fff7e6" stroke="#d6aa61" stroke-width="1.5"/>
  <text x="92" y="749" text-anchor="start" class="note">儲存與警報：unknown／requires_review 結果可由本人確認保存並保留標記，但不得觸發自動警報。</text>
  <text x="92" y="780" text-anchor="start" class="note">監控範圍：後端依 user_id + session_id + region_id 分開累計；瀏覽器僅 full-frame，Android 支援單株／多區域。</text>
  <text x="92" y="811" text-anchor="start" class="note">知識維護：由維護者執行同步與建庫腳本；RAG 僅讀取可追溯的 data.json 農業資料，不讀取專題手冊 DOCX。</text>
  <text x="1536" y="857" text-anchor="end" class="note">後端隔離測試通過，範圍與數量另見驗證報告；已具程式流程不代表完整整合或部署驗收。</text>
  <text x="1536" y="885" text-anchor="end" class="note">MySQL 僅 SQL 離線檢查；Android 缺 SDK 未建置，實機待驗證。</text>
</svg>
