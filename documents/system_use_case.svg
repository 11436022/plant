<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1220" viewBox="0 0 1600 1220">
  <defs>
    <style>
      .title { font: 700 42px "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif; fill: #1A281E; }
      .subtitle { font: 400 19px "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif; fill: #2D3748; }
      .group { font: 700 18px "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif; fill: #4F7057; }
      .uc { font: 400 16px "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif; fill: #1A281E; }
      .actor { font: 700 18px "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif; fill: #1A281E; }
      .small { font: 400 14px "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif; fill: #2D3748; }
      .boundary { fill: #F8FAF7; stroke: #B5C6B3; stroke-width: 2.5; }
      .case { fill: #ffffff; stroke: #B5C6B3; stroke-width: 2; }
      .shared { fill: #DDEAD7; stroke: #B5C6B3; stroke-width: 2; }
      .support { fill: #DDEAD7; stroke: #4F7057; stroke-width: 1.7; stroke-dasharray: 7 5; }
      .line { stroke: #B5C6B3; stroke-width: 1.8; fill: none; }
      .actor-line { stroke: #4F7057; stroke-width: 3; fill: none; }
      .include { stroke: #4F7057; stroke-width: 1.6; stroke-dasharray: 7 5; fill: none; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#4F7057"/>
    </marker>
  </defs>
  <style>.uc {font-size:15px}</style>
  <rect width="1600" height="1220" fill="#ffffff"/>
  <text x="60" y="58" text-anchor="start" class="title">使用個案圖</text>
  <text x="60" y="91" text-anchor="start" class="subtitle">沿用 UC-01～UC-12；UC-13 登出、UC-14 重設密碼、UC-15 補寄驗證信、UC-16 管理員新增。</text>
  <rect x="210" y="112" width="1180" height="995" rx="8" class="boundary"/>
  <text x="800" y="143" text-anchor="middle" class="group">植葉神醫 Plant Doctor</text>
<g transform="translate(95,360)"><circle cx="0" cy="0" r="23" fill="#fff" stroke="#4F7057" stroke-width="3"/><path d="M0 23 V94 M-40 49 H40 M0 94 L-34 141 M0 94 L34 141" class="actor-line"/>  <text x="0" y="176" text-anchor="middle" class="actor">一般使用者</text></g>
<g transform="translate(1505,360)"><circle cx="0" cy="0" r="23" fill="#fff" stroke="#4F7057" stroke-width="3"/><path d="M0 23 V94 M-40 49 H40 M0 94 L-34 141 M0 94 L34 141" class="actor-line"/>  <text x="0" y="176" text-anchor="middle" class="actor">管理員</text></g>
<g transform="translate(1505,904)"><circle cx="0" cy="0" r="23" fill="#fff" stroke="#4F7057" stroke-width="3"/><path d="M0 23 V94 M-40 49 H40 M0 94 L-34 141 M0 94 L34 141" class="actor-line"/>  <text x="0" y="176" text-anchor="middle" class="actor">維護者</text></g>
  <path d="M135 409 H192 V230 H230 M192 278 H230 M192 326 H230 M192 374 H230 M192 409 V470 H230 M192 422 H230" class="line"/>
  <path d="M192 409 V165 H606 V230 H620" class="line"/>
  <path d="M192 409 H200 V155 H985 V310 H1000 M985 230 H1000" class="line"/>
  <path d="M135 409 H185 V710 H220 M185 610 H220" class="line"/>
  <path d="M185 710 V922 H610 V650 H640 M610 745 H640" class="line"/>
  <path d="M1465 409 H1410 V855 H1330 M1410 585 H1330 M1410 675 H1330 M1410 765 H1330" class="line"/>
  <path d="M1410 855 V936 H978 V650 H960 M978 745 H960" class="line"/>
  <path d="M1465 953 H1415 V1012 H1045" class="line"/>
  <text x="380" y="187" text-anchor="middle" class="group">F1 帳號與身分驗證</text>
<ellipse cx="380" cy="230" rx="150" ry="22" class="case"/>
  <text x="380" y="236" text-anchor="middle" class="uc">UC-01 使用者註冊</text>
<ellipse cx="380" cy="278" rx="150" ry="22" class="case"/>
  <text x="380" y="284" text-anchor="middle" class="uc">UC-02 電子郵件信箱驗證</text>
<ellipse cx="380" cy="326" rx="150" ry="22" class="case"/>
  <text x="380" y="332" text-anchor="middle" class="uc">UC-03 使用者登入</text>
<ellipse cx="380" cy="374" rx="150" ry="22" class="case"/>
  <text x="380" y="380" text-anchor="middle" class="uc">UC-13 使用者登出</text>
<ellipse cx="380" cy="422" rx="150" ry="22" class="case"/>
  <text x="380" y="428" text-anchor="middle" class="uc">UC-14 忘記與重設密碼</text>
<ellipse cx="380" cy="470" rx="150" ry="22" class="case"/>
  <text x="380" y="476" text-anchor="middle" class="uc">UC-15 補寄驗證信</text>
  <text x="790" y="187" text-anchor="middle" class="group">F2 植物影像診斷</text>
<ellipse cx="790" cy="230" rx="170" ry="30" class="case"/>
  <text x="790" y="236" text-anchor="middle" class="uc">UC-04 拍照／選圖並取得分析</text>
<ellipse cx="790" cy="337" rx="170" ry="35" class="support"/>
  <text x="790" y="332" text-anchor="middle" class="uc">F5 資料庫校驗、信心門檻</text>
  <text x="790" y="354" text-anchor="middle" class="uc">來源回傳與人工複核標記</text>
<path d="M790 260 V299" class="include" marker-end="url(#arrow)"/>
  <text x="845" y="286" text-anchor="middle" class="small">&lt;&lt;include&gt;&gt;</text>
  <text x="790" y="414" text-anchor="middle" class="small">JWT＋上傳者歸屬；暫存 15 分鐘</text>
  <text x="790" y="442" text-anchor="middle" class="small">複核標記不等於專業複核已完成</text>
  <text x="1170" y="187" text-anchor="middle" class="group">F3 診斷紀錄管理</text>
<ellipse cx="1170" cy="230" rx="170" ry="30" class="case"/>
  <text x="1170" y="236" text-anchor="middle" class="uc">UC-05 確認並保存診斷</text>
<ellipse cx="1170" cy="310" rx="170" ry="30" class="case"/>
  <text x="1170" y="316" text-anchor="middle" class="uc">UC-06 查看歷史與來源</text>
  <text x="1170" y="382" text-anchor="middle" class="small">unknown 可確認保存並保留複核標記</text>
  <text x="1170" y="410" text-anchor="middle" class="small">保存來源快照；圖片存檔案系統</text>
  <text x="385" y="546" text-anchor="middle" class="group">F4 Webcam 監控警報</text>
<ellipse cx="385" cy="610" rx="165" ry="35" class="case"/>
  <text x="385" y="605" text-anchor="middle" class="uc">UC-10 影格監控</text>
  <text x="385" y="627" text-anchor="middle" class="uc">與後端判定自動警報</text>
<ellipse cx="385" cy="710" rx="165" ry="30" class="case"/>
  <text x="385" y="716" text-anchor="middle" class="uc">UC-11 查詢／確認／刪除警報</text>
<ellipse cx="385" cy="825" rx="165" ry="35" class="support"/>
  <text x="385" y="820" text-anchor="middle" class="uc">連續一致且通過資料庫校驗</text>
  <text x="385" y="842" text-anchor="middle" class="uc">unknown／需複核不發警報</text>
<path d="M550 610 H575 V825 H550" class="include" marker-end="url(#arrow)"/>
  <text x="575" y="783" text-anchor="middle" class="small">&lt;&lt;include&gt;&gt;</text>
  <text x="385" y="880" text-anchor="middle" class="small">Android 單株／多區域；瀏覽器僅全畫面</text>
  <text x="385" y="904" text-anchor="middle" class="small">累計鍵：user_id + session_id + region_id</text>
  <text x="800" y="546" text-anchor="middle" class="group">F3 / F6 紀錄維護</text>
<ellipse cx="800" cy="650" rx="160" ry="30" class="shared"/>
  <text x="800" y="656" text-anchor="middle" class="uc">UC-08 備註／修正／修改紀錄</text>
<ellipse cx="800" cy="745" rx="160" ry="30" class="shared"/>
  <text x="800" y="751" text-anchor="middle" class="uc">UC-09 刪除診斷紀錄</text>
  <text x="800" y="812" text-anchor="middle" class="small">一般使用者僅限自己的紀錄</text>
  <text x="800" y="839" text-anchor="middle" class="small">管理員經後台權限查核後維護</text>
  <text x="800" y="866" text-anchor="middle" class="small">使用者修正不表示建議已重新核准</text>
  <text x="1180" y="534" text-anchor="middle" class="group">F6 管理後台</text>
<ellipse cx="1180" cy="585" rx="150" ry="30" class="case"/>
  <text x="1180" y="591" text-anchor="middle" class="uc">管理員登入／登出</text>
<ellipse cx="1180" cy="675" rx="150" ry="30" class="case"/>
  <text x="1180" y="681" text-anchor="middle" class="uc">UC-07 儀表板與紀錄查詢</text>
<ellipse cx="1180" cy="765" rx="150" ry="30" class="case"/>
  <text x="1180" y="771" text-anchor="middle" class="uc">UC-12 查詢使用者列表</text>
<ellipse cx="1180" cy="855" rx="150" ry="30" class="case"/>
  <text x="1180" y="861" text-anchor="middle" class="uc">UC-16 手動新增診斷紀錄</text>
  <text x="1180" y="902" text-anchor="middle" class="small">/admin/login；驗證信箱＋role=admin</text>
  <text x="800" y="967" text-anchor="middle" class="group">F5 知識資料維護</text>
<ellipse cx="800" cy="1012" rx="245" ry="37" class="case"/>
  <text x="800" y="1007" text-anchor="middle" class="uc">維護者執行同步／建庫腳本</text>
  <text x="800" y="1029" text-anchor="middle" class="uc">data.json 農業語料 → FAISS＋來源 manifest</text>
  <text x="800" y="1083" text-anchor="middle" class="small">知識同步不是管理後台 CRUD；RAG 不讀手冊 DOCX。後台未提供 Webcam 警報管理功能。</text>
  <text x="800" y="1145" text-anchor="middle" class="small">SMTP 失敗會妨礙新帳號驗證與登入，但不撤銷已存警報；實際收信、跨裝置與部署狀態仍須另行驗證。</text>
  <text x="800" y="1172" text-anchor="middle" class="small">前端已實作信心／來源／複核欄位流程；Android 缺 SDK 未建置，實機驗證待完成。</text>
  <text x="800" y="1198" text-anchor="middle" class="small">後端隔離測試通過，範圍與數量另見驗證報告。</text>
</svg>
