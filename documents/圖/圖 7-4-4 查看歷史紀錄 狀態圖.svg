<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 750" width="1380" height="750">
  <defs>
    <style>
      .title { font-family: 'Microsoft JhengHei', sans-serif; font-size: 23px; font-weight: bold; fill: #1A281E; }
      .group-title { font-family: 'Microsoft JhengHei', sans-serif; font-size: 14px; font-weight: bold; fill: #223827; }
      .state-name { font-family: 'Microsoft JhengHei', sans-serif; font-size: 13.5px; font-weight: bold; fill: #223827; }
      .diamond-text { font-family: 'Microsoft JhengHei', sans-serif; font-size: 12.5px; font-weight: bold; fill: #1A281E; text-anchor: middle; }
      .action-text { font-family: 'Microsoft JhengHei', sans-serif; font-size: 11.5px; fill: #2D3748; }
      .transition-text { font-family: 'Microsoft JhengHei', sans-serif; font-size: 12.5px; fill: #2D5837; font-weight: bold; paint-order: stroke fill; stroke: #FFFFFF; stroke-width: 4px; stroke-linejoin: round; }
      .guard-text { font-family: 'Microsoft JhengHei', sans-serif; font-size: 11.5px; fill: #993B36; font-style: italic; font-weight: bold; paint-order: stroke fill; stroke: #FFFFFF; stroke-width: 3.5px; }

      .composite-bg { fill: #F8FAF7; stroke: #B5C6B3; stroke-width: 1.5; stroke-dasharray: 6,4; rx: 8; }
      .composite-header { fill: #E5EDE3; stroke: #B5C6B3; stroke-width: 1.5; }

      .state-box { fill: #FFFFFF; stroke: #334035; stroke-width: 1.5; rx: 6; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.04)); }
      .state-header { fill: #DDEAD7; stroke: #334035; stroke-width: 1.5; }

      .edit-box { fill: #FFFFFF; stroke: #4F7057; stroke-width: 1.5; rx: 6; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.04)); }
      .edit-header { fill: #E5EDE3; stroke: #4F7057; stroke-width: 1.5; }

      .feedback-box { fill: #FFFFFF; stroke: #BA5D57; stroke-width: 1.5; rx: 6; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.04)); }
      .feedback-header { fill: #F8E2E0; stroke: #BA5D57; stroke-width: 1.5; }

      .choice-diamond { fill: #E5EDE3; stroke: #334035; stroke-width: 1.5; }

      .line { stroke: #334035; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .line-branch { stroke: #4F7057; stroke-width: 1.5; fill: none; marker-end: url(#arrow-branch); }
      .line-back { stroke: #BA5D57; stroke-width: 1.5; fill: none; stroke-dasharray: 5,4; marker-end: url(#arrow-back); }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#334035" />
    </marker>
    <marker id="arrow-branch" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#4F7057" />
    </marker>
    <marker id="arrow-back" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#BA5D57" />
    </marker>
  </defs>

  <!-- Root Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Title -->
  <text x="690" y="34" class="title" text-anchor="middle">圖 7-4-4 查看歷史紀錄與備忘編輯 狀態圖 (State Diagram)</text>

  <!-- ========================================================================= -->
  <!-- 1. MAIN FLOW COMPOSITE STATE: BROWSING HISTORY & DETAIL                   -->
  <!-- ========================================================================= -->
  <g transform="translate(80, 60)">
    <!-- Composite Container (w=350, h=640) -->
    <rect width="350" height="640" class="composite-bg" />
    <path d="M 0 8 Q 0 0 8 0 L 342 0 Q 350 0 350 8 L 350 32 L 0 32 Z" class="composite-header" />
    <text x="16" y="21" class="group-title">主歷程檢視狀態 (Browsing History &amp; Detail)</text>

    <!-- State 1: 加載日誌列表 (w=300, h=78) -->
    <g transform="translate(25, 50)">
      <rect width="300" height="78" class="state-box" />
      <path d="M 0 6 Q 0 0 6 0 L 294 0 Q 300 0 300 6 L 300 26 L 0 26 Z" class="state-header" />
      <text x="150" y="18" class="state-name" text-anchor="middle">加載日誌列表 (Loading_Diaries)</text>
      <text x="12" y="45" class="action-text">entry / GET /api/v1/diaries (JWT 驗證)</text>
      <text x="12" y="65" class="action-text">do / 查詢 plant_diary 按時間降冪排序</text>
    </g>

    <!-- Transition S1 -> S2 -->
    <line x1="175" y1="128" x2="175" y2="185" class="line" />
    <text x="185" y="162" class="transition-text">清單載入完畢</text>

    <!-- State 2: 日誌清單展示 (w=300, h=92) -->
    <g transform="translate(25, 185)">
      <rect width="300" height="92" class="state-box" />
      <path d="M 0 6 Q 0 0 6 0 L 294 0 Q 300 0 300 6 L 300 26 L 0 26 Z" class="state-header" />
      <text x="150" y="18" class="state-name" text-anchor="middle">日誌清單展示 (Diary_List_Active)</text>
      <text x="12" y="45" class="action-text">entry / 列表渲染縮圖與病害摘要</text>
      <text x="12" y="63" class="action-text">do / 支援下拉更新與關鍵字篩選</text>
      <text x="12" y="81" class="action-text">exit / 點選特定病歷項目</text>
    </g>

    <!-- Transition S2 -> S3 -->
    <line x1="175" y1="277" x2="175" y2="330" class="line" />
    <text x="185" y="308" class="transition-text">點擊單筆日誌項目</text>

    <!-- State 3: 日誌詳情檢視 (w=300, h=95) -->
    <g transform="translate(25, 330)">
      <rect width="300" height="95" class="state-box" id="state-detail" />
      <path d="M 0 6 Q 0 0 6 0 L 294 0 Q 300 0 300 6 L 300 26 L 0 26 Z" class="state-header" />
      <text x="150" y="18" class="state-name" text-anchor="middle">檢視日誌詳情 (Viewing_Detail)</text>
      <text x="12" y="45" class="action-text">entry / 載入完整病歷詳情頁面</text>
      <text x="12" y="65" class="action-text">do / 呈現病斑照片、診斷結論與處方</text>
      <text x="12" y="85" class="action-text">do / 顯示個人備忘筆記與操作按鈕</text>
    </g>

    <!-- Final State: Exit History -->
    <line x1="175" y1="425" x2="175" y2="530" class="line" />
    <text x="185" y="480" class="transition-text">離開歷史頁面</text>
    <circle cx="175" cy="555" r="10" stroke="#1A281E" stroke-width="1.6" fill="none" />
    <circle cx="175" cy="555" r="6" fill="#1A281E" />
    <text x="175" y="585" class="action-text" text-anchor="middle" font-weight="bold">流程結束 [*]</text>
  </g>

  <!-- Initial State: Entry to Loading_Diaries -->
  <circle cx="35" cy="149" r="7" fill="#1A281E" />
  <line x1="42" y1="149" x2="103" y2="149" class="line" />

  <!-- ========================================================================= -->
  <!-- 2. BRANCH A: EDIT USER NOTE CONTAINER (x=780, y=60, w=480, h=285)          -->
  <!-- ========================================================================= -->
  <g transform="translate(780, 60)">
    <rect width="480" height="285" class="composite-bg" />
    <path d="M 0 8 Q 0 0 8 0 L 472 0 Q 480 0 480 8 L 480 32 L 0 32 Z" class="composite-header" fill="#E5EDE3" />
    <text x="16" y="21" class="group-title" fill="#1A281E">分支狀態 A：編輯個人備忘筆記 (UC-08)</text>

    <!-- State 4: 編輯備忘對話框 (w=430, h=85) -->
    <g transform="translate(25, 48)">
      <rect width="430" height="85" class="edit-box" />
      <path d="M 0 6 Q 0 0 6 0 L 424 0 Q 430 0 430 6 L 430 26 L 0 26 Z" class="edit-header" />
      <text x="215" y="18" class="state-name" fill="#1A281E" text-anchor="middle">備忘編輯狀態 (Editing_User_Note)</text>
      <text x="12" y="46" class="action-text">entry / 彈出對話框，預載既有筆記內容</text>
      <text x="12" y="63" class="action-text">do / 編輯照護心得與施藥復原進展</text>
      <text x="12" y="80" class="action-text">exit / 點擊「儲存」發送 PATCH /diaries/{id}/note</text>
    </g>

    <!-- Transition S4 -> S5 -->
    <line x1="240" y1="133" x2="240" y2="180" class="line" />
    <text x="250" y="162" class="transition-text">送出變更</text>

    <!-- State 5: 資料庫寫入與同步 (w=430, h=80) -->
    <g transform="translate(25, 180)">
      <rect width="430" height="80" class="edit-box" />
      <path d="M 0 6 Q 0 0 6 0 L 424 0 Q 430 0 430 6 L 430 26 L 0 26 Z" class="edit-header" />
      <text x="215" y="18" class="state-name" fill="#1A281E" text-anchor="middle">筆記寫入與同步 (Note_Updated)</text>
      <text x="12" y="47" class="action-text">do / 後端更新 plant_diary.user_note 欄位 (200 OK)</text>
      <text x="12" y="67" class="action-text">exit / 提示「筆記儲存成功」，即時同步詳情頁</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- 3. BRANCH B: SUBMIT FEEDBACK CONTAINER (x=780, y=390, w=480, h=310)       -->
  <!-- ========================================================================= -->
  <g transform="translate(780, 390)">
    <rect width="480" height="310" class="composite-bg" />
    <path d="M 0 8 Q 0 0 8 0 L 472 0 Q 480 0 480 8 L 480 32 L 0 32 Z" class="composite-header" fill="#E5EDE3" />
    <text x="16" y="21" class="group-title" fill="#1A281E">分支狀態 B：提交診斷反饋與糾錯 (UC-13)</text>

    <!-- State 6: 填寫糾錯資訊 (w=430, h=88) -->
    <g transform="translate(25, 48)">
      <rect width="430" height="88" class="feedback-box" />
      <path d="M 0 6 Q 0 0 6 0 L 424 0 Q 430 0 430 6 L 430 26 L 0 26 Z" class="feedback-header" />
      <text x="215" y="18" class="state-name" fill="#1A281E" text-anchor="middle">填寫糾錯反饋 (Filling_Feedback_Modal)</text>
      <text x="12" y="47" class="action-text">entry / 彈出糾錯表單，顯示 AI 原始判定結果</text>
      <text x="12" y="65" class="action-text">do / 勾選誤判類別，鍵入正確之作物與病名</text>
      <text x="12" y="82" class="action-text">exit / 發送 POST /api/v1/feedback</text>
    </g>

    <!-- Transition S6 -> S7 -->
    <line x1="240" y1="136" x2="240" y2="190" class="line" />
    <text x="250" y="168" class="transition-text">提交糾錯資料</text>

    <!-- State 7: 寫入 diagnosis_feedback (w=430, h=88) -->
    <g transform="translate(25, 190)">
      <rect width="430" height="88" class="feedback-box" />
      <path d="M 0 6 Q 0 0 6 0 L 424 0 Q 430 0 430 6 L 430 26 L 0 26 Z" class="feedback-header" />
      <text x="215" y="18" class="state-name" fill="#1A281E" text-anchor="middle">反饋持久化 (Feedback_Persisted)</text>
      <text x="12" y="47" class="action-text">do / 寫入 MySQL diagnosis_feedback 資料表</text>
      <text x="12" y="65" class="action-text">do / 患病影像歸檔至 feedback_uploads 儲存庫</text>
      <text x="12" y="82" class="action-text">exit / 提示「反饋成功」，供專家審核與模型複訓</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- 4. DECISION & BRANCH ROUTING (Rendered ON TOP of containers)               -->
  <!-- ========================================================================= -->
  <!-- From Detail Right Edge (x=405, y=435) -> Choice Diamond Left Tip (x=480, y=435) -->
  <line x1="405" y1="435" x2="478" y2="435" class="line" />
  <text x="442" y="425" class="transition-text" text-anchor="middle">使用者操作</text>

  <!-- Choice Diamond (Center: x=530, y=435; w=100, h=50) -->
  <polygon points="530,410 580,435 530,460 480,435" class="choice-diamond" />
  <text x="530" y="439" class="diamond-text">功能選擇</text>

  <!-- Branch A: From Diamond top (530, 410) -> Up to y=150 -> Right into Group A (780, 150) -->
  <path d="M 530 410 L 530 150 L 778 150" class="line-branch" />
  <text x="548" y="140" class="transition-text">點擊「編輯備忘筆記」(UC-08)</text>

  <!-- Branch B: From Diamond bottom (530, 460) -> Down to y=490 -> Right into Group B (780, 490) -->
  <path d="M 530 460 L 530 490 L 778 490" class="line-branch" />
  <text x="548" y="482" class="transition-text">點擊「反饋糾錯」(UC-13)</text>

  <!-- ========================================================================= -->
  <!-- 5. LOOP BACK RETURN PATHS (Cleanly separated without any line crossing)   -->
  <!-- ========================================================================= -->
  <!-- Loop back from Note (x=780, y=280) -> left to 650 -> down to 405 -> left to Detail (405, 405) -->
  <path d="M 780 280 L 650 280 L 650 405 L 407 405" class="line-back" />
  <text x="765" y="272" text-anchor="end" class="guard-text">儲存完成 [返回詳情頁]</text>

  <!-- Loop back from Feedback (x=780, y=625) -> left to 442 -> up to 465 -> left to Detail (405, 465) -->
  <path d="M 780 625 L 442 625 L 442 465 L 407 465" class="line-back" />
  <text x="765" y="617" text-anchor="end" class="guard-text">反饋完成 [返回詳情頁]</text>

</svg>
