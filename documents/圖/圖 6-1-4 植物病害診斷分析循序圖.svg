<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 920" width="760" height="920">
  <defs>
    <style>
      .title { font-family: 'Microsoft JhengHei', sans-serif; font-size: 17px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
      .life-title { font-family: 'Microsoft JhengHei', sans-serif; font-size: 13px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
      .life-sub { font-family: 'Microsoft JhengHei', sans-serif; font-size: 10px; fill: #64748b; text-anchor: middle; }
      .life-line { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 4,4; }
      .life-box { fill: #f1f5f9; stroke: #334155; stroke-width: 1.5; rx: 5; ry: 5; }
      .life-ai { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.5; rx: 5; ry: 5; }
      .life-db { fill: #fefce8; stroke: #ca8a04; stroke-width: 1.5; rx: 5; ry: 5; }
      .activation { fill: #cbd5e1; stroke: #475569; stroke-width: 1.2; rx: 2; ry: 2; }
      .msg-line { stroke: #1e293b; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
      .ret-line { stroke: #2563eb; stroke-width: 1.4; stroke-dasharray: 4,4; fill: none; marker-end: url(#blue-arrow); }
      .msg-text { font-family: 'Microsoft JhengHei', sans-serif; font-size: 11px; fill: #1e293b; }
      .ret-text { font-family: 'Microsoft JhengHei', sans-serif; font-size: 11px; fill: #1d4ed8; }
      .msg-shield { fill: #ffffff; fill-opacity: 0.94; }
      .alt-box { fill: #f8fafc; fill-opacity: 0.45; stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 5,3; }
      .alt-header { fill: #e2e8f0; stroke: #64748b; stroke-width: 1.2; }
      .alt-tag { font-family: 'Microsoft JhengHei', sans-serif; font-size: 11px; font-weight: bold; fill: #334155; }
      .alt-cond { font-family: 'Microsoft JhengHei', sans-serif; font-size: 11px; font-weight: bold; fill: #1e40af; }
      .alt-div { stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 4,4; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b" />
    </marker>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff" />
  <text x="380.0" y="32" class="title">▲圖 6-1-4 植物病害診斷分析循序圖</text>

  <!-- Lifelines -->
  <!-- 1. 使用者 (User) -->
  <line x1="60.0" y1="97" x2="60.0" y2="885" class="life-line" />
  <rect x="10.0" y="55" width="100" height="42" class="life-box" />
  <text x="60.0" y="73" class="life-title">使用者</text>
  <text x="60.0" y="88" class="life-sub">User</text>

  <!-- 2. Android App (Client) -->
  <line x1="175.0" y1="97" x2="175.0" y2="885" class="life-line" />
  <rect x="125.0" y="55" width="100" height="42" class="life-box" />
  <text x="175.0" y="73" class="life-title">Android App</text>
  <text x="175.0" y="88" class="life-sub">Client</text>

  <!-- 3. FastAPI (後端核心) -->
  <line x1="295.0" y1="97" x2="295.0" y2="885" class="life-line" />
  <rect x="245.0" y="55" width="100" height="42" class="life-box" />
  <text x="295.0" y="73" class="life-title">FastAPI</text>
  <text x="295.0" y="88" class="life-sub">後端閘道與核心</text>

  <!-- 4. ConvNeXt (自訓快篩/CAM) -->
  <line x1="420.0" y1="97" x2="420.0" y2="885" class="life-line" />
  <rect x="365.0" y="55" width="110" height="42" class="life-ai" />
  <text x="420.0" y="73" class="life-title">ConvNeXt</text>
  <text x="420.0" y="88" class="life-sub">本地快篩 &amp; CAM</text>

  <!-- 5. 視覺記憶與雲端 (Visual Memory & Gemini) -->
  <line x1="565.0" y1="97" x2="565.0" y2="885" class="life-line" />
  <rect x="505.0" y="55" width="120" height="42" class="life-ai" />
  <text x="565.0" y="73" class="life-title">記憶庫與 Gemini</text>
  <text x="565.0" y="88" class="life-sub">Visual RAG &amp; 雲端</text>

  <!-- 6. 權威資料庫 (MySQL & FAISS) -->
  <line x1="700.0" y1="97" x2="700.0" y2="885" class="life-line" />
  <rect x="645.0" y="55" width="110" height="42" class="life-db" />
  <text x="700.0" y="73" class="life-title">權威處方庫</text>
  <text x="700.0" y="88" class="life-sub">MySQL &amp; 專書 FAISS</text>

  <!-- Activations -->
  <rect x="55.0" y="110" width="10" height="735" class="activation" />
  <rect x="170.0" y="110" width="10" height="735" class="activation" />
  <rect x="290.0" y="135" width="10" height="680" class="activation" />
  <rect x="415.0" y="195" width="10" height="85" class="activation" />
  <rect x="560.0" y="325" width="10" height="135" class="activation" />
  <rect x="695.0" y="555" width="10" height="120" class="activation" />

  <!-- Step 1: User action -->
  <rect x="67.0" y="103" width="280" height="15" class="msg-shield" />
  <line x1="65.0" y1="120" x2="170.0" y2="120" class="msg-line" />
  <text x="70.0" y="115" class="msg-text">1: 拍攝病葉照片、選擇作物類型，點選「開始診斷」</text>

  <!-- Step 2: HTTP POST -->
  <rect x="182.0" y="133" width="415" height="15" class="msg-shield" />
  <line x1="180.0" y1="150" x2="290.0" y2="150" class="msg-line" />
  <text x="185.0" y="145" class="msg-text">2: POST /api/v1/predict (multipart/form-data: image, crop, JWT)</text>

  <!-- Step 3: Image Preprocessing & Filter -->
  <path d="M 300.0 165 L 328.0 165 L 328.0 185 L 300.0 185" class="msg-line" />
  <rect x="331.0" y="167" width="260" height="15" class="msg-shield" />
  <text x="333.0" y="179" class="msg-text">3: 影像預處理與品質濾波 (Laplacian 梯度清晰度檢驗)</text>

  <!-- Step 4: ConvNeXt Inference -->
  <rect x="302.0" y="195" width="255" height="15" class="msg-shield" />
  <line x1="300.0" y1="210" x2="415.0" y2="210" class="msg-line" />
  <text x="305.0" y="205" class="msg-text">4: 執行本地自訓 ConvNeXt 特徵推論與 Softmax 信心度計算</text>

  <!-- Step 5: Grad-CAM Saliency -->
  <path d="M 425.0 220 L 450.0 220 L 450.0 240 L 425.0 240" class="msg-line" />
  <rect x="453.0" y="222" width="265" height="15" class="msg-shield" />
  <text x="455.0" y="234" class="msg-text">5: Grad-CAM 空間注意力前景驗證 (計算葉片前景對齊率)</text>

  <!-- Step 6: Return ConvNeXt & CAM -->
  <rect x="302.0" y="250" width="265" height="15" class="msg-shield" />
  <line x1="415.0" y1="265" x2="300.0" y2="265" class="ret-line" />
  <text x="305.0" y="260" class="ret-text">6: 回傳 Top-1 病名、信心值 (prob) 與前景對齊率 (cam_ratio)</text>

  <!-- Alt Block 1: Dual Safety Gate (ConvNeXt vs Gemini/VisualMemory) -->
  <rect x="270.0" y="285" width="455.0" height="185" class="alt-box" />
  <polygon points="270.0,285 312.0,285 302.0,303 270.0,303" class="alt-header" />
  <text x="277.0" y="298" class="alt-tag">alt</text>
  <rect x="314.0" y="287" width="270" height="15" class="msg-shield" />
  <text x="318.0" y="299" class="alt-cond">[雙重安全門檻通過：快篩≥75% 且 前景≥35%]</text>

  <rect x="302.0" y="315" width="250" height="15" class="msg-shield" />
  <line x1="300.0" y1="330" x2="560.0" y2="330" class="msg-line" />
  <text x="305.0" y="325" class="msg-text">7a: 比對 Visual Memory 專家視覺特徵記憶庫</text>

  <rect x="302.0" y="345" width="250" height="15" class="msg-shield" />
  <line x1="560.0" y1="360" x2="300.0" y2="360" class="ret-line" />
  <text x="305.0" y="355" class="ret-text">8a: 回傳特徵餘弦比對結果與歷史真值校驗校準</text>

  <!-- Divider -->
  <line x1="270.0" y1="375" x2="725.0" y2="375" class="alt-div" />
  <rect x="302.0" y="380" width="250" height="15" class="msg-shield" />
  <text x="305.0" y="392" class="alt-cond">[未通過雙重門檻／疑義分流：雲端兜底]</text>

  <rect x="302.0" y="405" width="250" height="15" class="msg-shield" />
  <line x1="300.0" y1="420" x2="560.0" y2="420" class="msg-line" />
  <text x="305.0" y="415" class="msg-text">7b: 傳送影像至 Gemini 3.8 Flash 執行多模態廣域病徵推論</text>

  <rect x="302.0" y="435" width="250" height="15" class="msg-shield" />
  <line x1="560.0" y1="450" x2="300.0" y2="450" class="ret-line" />
  <text x="305.0" y="445" class="ret-text">8b: 回傳多模態診斷病名、特徵描述與信心評估</text>

  <!-- Alt Block 2: Safety Brake Decision -->
  <rect x="270.0" y="485" width="455.0" height="215" class="alt-box" />
  <polygon points="270.0,485 312.0,485 302.0,503 270.0,503" class="alt-header" />
  <text x="277.0" y="498" class="alt-tag">alt</text>
  <rect x="314.0" y="487" width="230" height="15" class="msg-shield" />
  <text x="318.0" y="499" class="alt-cond">[綜合把握度 &lt; 65%：啟動安全防禦剎車]</text>

  <path d="M 300.0 515 L 328.0 515 L 328.0 535 L 300.0 535" class="msg-line" />
  <rect x="331.0" y="517" width="310" height="15" class="msg-shield" />
  <text x="333.0" y="529" class="msg-text">9a: 標記安全剎車 flag (無法判定/建議採樣送檢，不調用處方)</text>

  <!-- Divider -->
  <line x1="270.0" y1="545" x2="725.0" y2="545" class="alt-div" />
  <rect x="302.0" y="550" width="270" height="15" class="msg-shield" />
  <text x="305.0" y="562" class="alt-cond">[研判明確 (≥65%)：雙軌權威處方檢索與專書溯源]</text>

  <rect x="302.0" y="575" width="290" height="15" class="msg-shield" />
  <line x1="300.0" y1="590" x2="695.0" y2="590" class="msg-line" />
  <text x="305.0" y="585" class="msg-text">9b: 優先查詢本地 MySQL 官方病蟲害審定處方庫</text>

  <rect x="302.0" y="605" width="320" height="15" class="msg-shield" />
  <line x1="695.0" y1="620" x2="300.0" y2="620" class="ret-line" />
  <text x="305.0" y="615" class="ret-text">10b: [若命中審定處方] 回傳官方標準防治處置 (零雲端消耗)</text>

  <rect x="302.0" y="635" width="345" height="15" class="msg-shield" />
  <line x1="695.0" y1="650" x2="300.0" y2="650" class="ret-line" />
  <text x="305.0" y="645" class="ret-text">11b: [若無現成處方] FAISS 檢索專書片段並結合 Gemini 生成處方</text>

  <!-- Step 12: Package Report -->
  <path d="M 300.0 715 L 328.0 715 L 328.0 735 L 300.0 735" class="msg-line" />
  <rect x="331.0" y="717" width="370" height="15" class="msg-shield" />
  <text x="333.0" y="729" class="msg-text">12: 組合結構化診斷報告 (prediction_id, 處方建議, 推論路徑, 剎車旗標)</text>

  <!-- Step 13: HTTP Response -->
  <rect x="182.0" y="753" width="210" height="15" class="msg-shield" />
  <line x1="290.0" y1="770" x2="180.0" y2="770" class="ret-line" />
  <text x="185.0" y="765" class="ret-text">13: HTTP 200 OK (結構化診斷報告 JSON)</text>

  <!-- Step 14: Client Render -->
  <rect x="67.0" y="803" width="280" height="15" class="msg-shield" />
  <line x1="170.0" y1="820" x2="65.0" y2="820" class="ret-line" />
  <text x="70.0" y="815" class="ret-text">14: 渲染圖文診斷結果頁面 (病名、可信度、處方卡片或送檢警示)</text>
</svg>