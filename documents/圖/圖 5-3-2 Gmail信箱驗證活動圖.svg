<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 780" width="740" height="780">
  <defs>
    <style>
      .title { font-family: 'Microsoft JhengHei', sans-serif; font-size: 17px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
      .lane-title { font-family: 'Microsoft JhengHei', sans-serif; font-size: 14px; font-weight: bold; fill: #1e293b; text-anchor: middle; }
      .text-bold { font-family: 'Microsoft JhengHei', sans-serif; font-size: 12px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
      .text-sub { font-family: 'Microsoft JhengHei', sans-serif; font-size: 10px; fill: #64748b; text-anchor: middle; }
      .text-decision { font-family: 'Microsoft JhengHei', sans-serif; font-size: 11px; font-weight: bold; fill: #1e40af; text-anchor: middle; }
      .text-edge { font-family: 'Microsoft JhengHei', sans-serif; font-size: 11px; fill: #1e293b; text-anchor: middle; font-weight: bold; }
      .label-bg { fill: #ffffff; fill-opacity: 0.95; rx: 3; ry: 3; }
      .lane-bg { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
      .lane-header { fill: #e2e8f0; stroke: #94a3b8; stroke-width: 1.5; }
      .action-usr { fill: #ffffff; stroke: #2563eb; stroke-width: 1.5; rx: 6; ry: 6; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.04)); }
      .action-sys { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.5; rx: 6; ry: 6; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.04)); }
      .decision-box { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
      .flow-line { stroke: #334155; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .flow-line-noarrow { stroke: #334155; stroke-width: 1.5; fill: none; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff" />
  <text x="370.0" y="32" class="title">▲圖 5-3-2 Gmail信箱驗證活動圖</text>
  <rect x="45" y="55" width="325.0" height="695" class="lane-bg" />
  <rect x="45" y="55" width="325.0" height="35" class="lane-header" />
  <text x="207.5" y="77" class="lane-title">新使用者</text>
  <rect x="370.0" y="55" width="325.0" height="695" class="lane-bg" />
  <rect x="370.0" y="55" width="325.0" height="35" class="lane-header" />
  <text x="532.5" y="77" class="lane-title">系統伺服器</text>
<circle cx="207.5" cy="105" r="12" fill="#0f172a" />
<rect x="112.5" y="140" width="190" height="44" class="action-usr" />
<text x="207.5" y="166" class="text-bold">開啟 Gmail 信箱</text>
<rect x="112.5" y="225" width="190" height="44" class="action-usr" />
<text x="207.5" y="251" class="text-bold">點擊「驗證我的帳號」</text>
<rect x="437.5" y="225" width="190" height="44" class="action-sys" />
<text x="532.5" y="251" class="text-bold">接收驗證請求</text>
<rect x="437.5" y="310" width="190" height="44" class="action-sys" />
<text x="532.5" y="336" class="text-bold">檢查 Token 有效性</text>
<polygon points="532.5,395 605.0,417.0 532.5,439 460.0,417.0" class="decision-box" />
<text x="532.5" y="421.0" class="text-decision">Token 是否有效</text>
<rect x="112.5" y="395" width="190" height="44" class="action-usr" />
<text x="207.5" y="421" class="text-bold">顯示驗證失敗頁面</text>
<circle cx="207.5" cy="475" r="8" fill="#0f172a" />
<circle cx="207.5" cy="475" r="14" fill="none" stroke="#0f172a" stroke-width="2" />
<rect x="437.5" y="480" width="190" height="44" class="action-sys" />
<text x="532.5" y="506" class="text-bold">更新資料庫狀態</text>
<rect x="437.5" y="560" width="190" height="44" class="action-sys" />
<text x="532.5" y="586" class="text-bold">渲染驗證成功頁面</text>
<rect x="112.5" y="640" width="190" height="44" class="action-usr" />
<text x="207.5" y="666" class="text-bold">檢視驗證成功訊息</text>
<circle cx="207.5" cy="715" r="8" fill="#0f172a" />
<circle cx="207.5" cy="715" r="14" fill="none" stroke="#0f172a" stroke-width="2" />
<line x1="207.5" y1="117" x2="207.5" y2="140" class="flow-line" />
<line x1="207.5" y1="184" x2="207.5" y2="225" class="flow-line" />
<line x1="302.5" y1="247.0" x2="437.5" y2="247.0" class="flow-line" />
<line x1="532.5" y1="269" x2="532.5" y2="310" class="flow-line" />
<line x1="532.5" y1="354" x2="532.5" y2="395" class="flow-line" />
<line x1="460.0" y1="417.0" x2="302.5" y2="417.0" class="flow-line" />
<rect x="304.75" y="399.0" width="153" height="16" class="label-bg" />
<text x="381.25" y="411.0" class="text-edge">[Token 失效或逾期]</text>
<line x1="207.5" y1="439" x2="207.5" y2="461" class="flow-line" />
<line x1="532.5" y1="439" x2="532.5" y2="480" class="flow-line" />
<rect x="505.5" y="457.5" width="54" height="16" class="label-bg" />
<text x="532.5" y="469.5" class="text-edge">[有效]</text>
<line x1="532.5" y1="524" x2="532.5" y2="560" class="flow-line" />
<line x1="532.5" y1="604" x2="532.5" y2="615" class="flow-line-noarrow" />
<line x1="532.5" y1="615" x2="207.5" y2="615" class="flow-line-noarrow" />
<line x1="207.5" y1="615" x2="207.5" y2="640" class="flow-line" />
<line x1="207.5" y1="684" x2="207.5" y2="701" class="flow-line" />
</svg>