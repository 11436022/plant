<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820">
  <defs>
    <style>
      .title { font-family: 'Microsoft JhengHei', 'PingFang TC', sans-serif; font-size: 20px; font-weight: bold; fill: #0f172a; }
      .lifeline-box { fill: #f1f5f9; stroke: #334155; stroke-width: 1.5; rx: 6; ry: 6; }
      .lifeline-local { fill: #ecfdf5; stroke: #059669; stroke-width: 1.5; rx: 6; ry: 6; }
      .lifeline-cloud { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; rx: 6; ry: 6; }
      .lifeline-title { font-family: 'Microsoft JhengHei', 'PingFang TC', sans-serif; font-size: 13px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
      .lifeline-sub { font-family: 'Microsoft JhengHei', 'PingFang TC', sans-serif; font-size: 10px; fill: #64748b; text-anchor: middle; }
      .lifeline-line { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 4,4; }
      .activation { fill: #e2e8f0; stroke: #475569; stroke-width: 1.2; rx: 3; ry: 3; }
      .msg-line { stroke: #1e293b; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .return-line { stroke: #2563eb; stroke-width: 1.5; stroke-dasharray: 4,4; fill: none; marker-end: url(#blue-arrow); }
      .msg-text { font-family: 'Microsoft JhengHei', 'PingFang TC', sans-serif; font-size: 10.5px; fill: #1e293b; }
      .return-text { font-family: 'Microsoft JhengHei', 'PingFang TC', sans-serif; font-size: 10.5px; fill: #1d4ed8; }
      .frame-box { fill: none; stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 6,3; }
      .frame-header { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.2; }
      .frame-text { font-family: 'Microsoft JhengHei', 'PingFang TC', sans-serif; font-size: 11px; font-weight: bold; fill: #334155; }
      .divider-line { stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 4,4; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b" />
    </marker>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Diagram Title -->
  <text x="600" y="32" class="title" text-anchor="middle">圖 6-1-1 植物診斷循序圖 (Sequence Diagram)</text>

  <!-- Lifeline 1: 使用者 -->
  <rect x="50" y="55" width="130" height="42" class="lifeline-box" />
  <text x="115" y="73" class="lifeline-title">使用者 (User)</text>
  <text x="115" y="88" class="lifeline-sub">園藝愛好者 / 農民</text>
  <line x1="115" y1="97" x2="115" y2="795" class="lifeline-line" />

  <!-- Lifeline 2: Android App -->
  <rect x="230" y="55" width="140" height="42" class="lifeline-box" />
  <text x="300" y="73" class="lifeline-title">Android 客戶端</text>
  <text x="300" y="88" class="lifeline-sub">Plant Doctor App (Kotlin)</text>
  <line x1="300" y1="97" x2="300" y2="795" class="lifeline-line" />

  <!-- Lifeline 3: FastAPI Backend -->
  <rect x="420" y="55" width="150" height="42" class="lifeline-box" />
  <text x="495" y="73" class="lifeline-title">FastAPI 後端伺服器</text>
  <text x="495" y="88" class="lifeline-sub">微服務路由與決策仲裁</text>
  <line x1="495" y1="97" x2="495" y2="795" class="lifeline-line" />

  <!-- Lifeline 4: Local ConvNeXt (先本地快篩) -->
  <rect x="620" y="55" width="160" height="42" class="lifeline-local" />
  <text x="700" y="73" class="lifeline-title">本地自訓 ConvNeXt</text>
  <text x="700" y="88" class="lifeline-sub">步驟 1：卷積快篩 (零雲端成本)</text>
  <line x1="700" y1="97" x2="700" y2="795" class="lifeline-line" />

  <!-- Lifeline 5: Gemini 2.5 Flash (後雲端兜底) -->
  <rect x="830" y="55" width="160" height="42" class="lifeline-cloud" />
  <text x="910" y="73" class="lifeline-title">Gemini 2.5 Flash</text>
  <text x="910" y="88" class="lifeline-sub">步驟 2：雲端多模態兜底大模型</text>
  <line x1="910" y1="97" x2="910" y2="795" class="lifeline-line" />

  <!-- Lifeline 6: FAISS RAG & DB -->
  <rect x="1030" y="55" width="140" height="42" class="lifeline-box" />
  <text x="1100" y="73" class="lifeline-title">FAISS &amp; MySQL</text>
  <text x="1100" y="88" class="lifeline-sub">步驟 3：向量檢索與持久化庫</text>
  <line x1="1100" y1="97" x2="1100" y2="795" class="lifeline-line" />

  <!-- Activations -->
  <rect x="110" y="115" width="10" height="670" class="activation" />
  <rect x="295" y="125" width="10" height="660" class="activation" />
  <rect x="490" y="145" width="10" height="640" class="activation" />
  <rect x="695" y="205" width="10" height="50" class="activation" />
  <rect x="905" y="300" width="10" height="50" class="activation" />
  <rect x="1095" y="385" width="10" height="45" class="activation" />
  <rect x="1095" y="615" width="10" height="30" class="activation" />
  <rect x="1095" y="735" width="10" height="30" class="activation" />

  <!-- Step 1: User picks photo & plant name -->
  <line x1="120" y1="125" x2="295" y2="125" class="msg-line" />
  <text x="124" y="120" class="msg-text">1: 選擇植物照片及植物名稱，並按下「開始診斷」</text>

  <!-- Step 2: App sends image & crop_name to FastAPI -->
  <line x1="305" y1="145" x2="490" y2="145" class="msg-line" />
  <text x="312" y="140" class="msg-text">2: POST /api/v1/predict (multipart: image, crop_name, JWT)</text>

  <!-- Step 3: Server caches image and makes prediction_id -->
  <path d="M 500 160 L 530 160 L 530 180 L 500 180" class="msg-line" />
  <text x="535" y="174" class="msg-text">3: 暫存影像快取，生成 prediction_id</text>

  <!-- Step 4: Call Local ConvNeXt first -->
  <line x1="500" y1="210" x2="695" y2="210" class="msg-line" />
  <text x="508" y="205" class="msg-text">4: 步驟 1 (優先)：載入本地權重進行卷積特徵快篩 (ConvNeXt)</text>

  <!-- Step 5: Local ConvNeXt returns -->
  <line x1="695" y1="245" x2="500" y2="245" class="return-line" />
  <text x="508" y="240" class="return-text">5: 回傳分類病害標籤與信心度 (若 ≥ 70% 則命中快篩成功)</text>

  <!-- Optional Frame: Gemini Fallback (if ConvNeXt missed or low confidence) -->
  <rect x="440" y="270" width="510" height="92" class="frame-box" />
  <polygon points="440,270 735,270 725,290 440,290" class="frame-header" />
  <text x="450" y="284" class="frame-text">opt [步驟 2 兜底：若本地模型未命中或信心度 &lt; 70%]</text>

  <!-- 6a: Call Gemini -->
  <line x1="500" y1="305" x2="905" y2="305" class="msg-line" />
  <text x="508" y="300" class="msg-text">6a: 傳送影像與作物名稱，請求雲端多模態分析 (Gemini 2.5 Flash)</text>

  <!-- 6b: Return from Gemini -->
  <line x1="905" y1="340" x2="500" y2="340" class="return-line" />
  <text x="508" y="335" class="return-text">6b: 回傳多模態影像初判、病徵語意描述與信心值 (JSON 格式)</text>

  <!-- Step 7: Query FAISS RAG -->
  <line x1="500" y1="385" x2="1095" y2="385" class="msg-line" />
  <text x="508" y="380" class="msg-text">7: 步驟 3：查詢 FAISS 向量知識庫與農業部開放資料 (RAG 防幻覺)</text>

  <!-- Step 8: Return from FAISS -->
  <line x1="1095" y1="415" x2="500" y2="415" class="return-line" />
  <text x="508" y="410" class="return-text">8: 回傳官方作物/病害標準處置建議與歷史相似案例</text>

  <!-- Step 9: Prescription generation & arbitration -->
  <path d="M 500 440 L 535 440 L 535 465 L 500 465" class="msg-line" />
  <text x="540" y="451" class="msg-text">9: 決策整合：組合精準處方箋 (過濾 RAG 雜訊、標記來源)，</text>
  <text x="540" y="465" class="msg-text">   若總信心度未達標則判定為「未知/無法判定」(安全防禦煞車)</text>

  <!-- Step 10: Return structured result to App -->
  <line x1="490" y1="485" x2="305" y2="485" class="return-line" />
  <text x="312" y="480" class="return-text">10: 回傳結構化診斷結果 JSON (含 prediction_id, crop, status, advice)</text>

  <!-- Step 11: App renders report -->
  <line x1="295" y1="505" x2="120" y2="505" class="return-line" />
  <text x="128" y="500" class="return-text">11: 呈現圖文診斷報告 (若為未知作物則隱藏儲存按鈕，僅保留糾錯反饋)</text>

  <!-- Alt Frame (alt) -->
  <rect x="70" y="525" width="1070" height="260" class="frame-box" />
  <polygon points="70,525 230,525 220,545 70,545" class="frame-header" />
  <text x="80" y="539" class="frame-text">alt [後續操作流程決策]</text>

  <!-- Branch 1: Confirm & Save -->
  <text x="85" y="561" class="frame-text" fill="#16a34a">[分支 A: 確診病害 (信心度 ≥ 70%) 且 使用者確認儲存]</text>

  <line x1="120" y1="578" x2="295" y2="578" class="msg-line" />
  <text x="128" y="573" class="msg-text">12a: 編輯個人備忘筆記 (user_note)，點擊「儲存紀錄」</text>

  <line x1="305" y1="596" x2="490" y2="596" class="msg-line" />
  <text x="312" y="591" class="msg-text">13a: POST /api/v1/diaries/confirm (prediction_id, user_note)</text>

  <line x1="500" y1="615" x2="1095" y2="615" class="msg-line" />
  <text x="508" y="610" class="msg-text">14a: 後端驗證非未知結果 (若為未知則阻擋 400)，移動圖片並寫入 plant_diary</text>

  <line x1="1095" y1="635" x2="500" y2="635" class="return-line" />
  <text x="508" y="630" class="return-text">15a: 資料庫寫入成功，回傳 diary_id</text>

  <line x1="490" y1="653" x2="305" y2="653" class="return-line" />
  <text x="312" y="648" class="return-text">16a: 201 Created 回傳儲存成功，重新整理歷史紀錄清單</text>

  <!-- Divider -->
  <line x1="70" y1="665" x2="1140" y2="665" class="divider-line" />

  <!-- Branch 2: Submit Feedback -->
  <text x="85" y="683" class="frame-text" fill="#7c3aed">[分支 B: 診斷為未知/無法判定 (僅保留此項) 或 使用者認為確診結果有誤]</text>

  <line x1="120" y1="700" x2="295" y2="700" class="msg-line" />
  <text x="128" y="695" class="msg-text">12b: 點擊「結果有誤？」，勾選誤判並填寫修正病名</text>

  <line x1="305" y1="718" x2="490" y2="718" class="msg-line" />
  <text x="312" y="713" class="msg-text">13b: POST /api/v1/feedback (prediction_id, is_disease_error, corrected_status)</text>

  <line x1="500" y1="737" x2="1095" y2="737" class="msg-line" />
  <text x="508" y="732" class="msg-text">14b: 寫入 diagnosis_feedback 資料表 (待管理員審核與模型複訓)</text>

  <line x1="1095" y1="757" x2="500" y2="757" class="return-line" />
  <text x="508" y="752" class="return-text">15b: 反饋記錄成功存檔</text>

  <line x1="490" y1="775" x2="305" y2="775" class="return-line" />
  <text x="312" y="770" class="return-text">16b: 回傳致謝通知「感謝您的糾錯反饋，已記錄供模型複訓」</text>

</svg>