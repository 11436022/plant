<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   viewBox="0 0 740 900"
   width="740"
   height="900"
   version="1.1"
   id="svg53"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <defs id="defs1">
    <style id="style1">
      .title { font-family: 'Microsoft JhengHei', sans-serif; font-size: 17px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
      .lane-title { font-family: 'Microsoft JhengHei', sans-serif; font-size: 14px; font-weight: bold; fill: #1e293b; text-anchor: middle; }
      .text-bold { font-family: 'Microsoft JhengHei', sans-serif; font-size: 12px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
      .text-decision { font-family: 'Microsoft JhengHei', sans-serif; font-size: 11px; font-weight: bold; fill: #1e40af; text-anchor: middle; }
      .text-edge { font-family: 'Microsoft JhengHei', sans-serif; font-size: 11px; fill: #1e293b; text-anchor: middle; font-weight: bold; }
      .label-bg { fill: #ffffff; fill-opacity: 0.95; rx: 3; ry: 3; }
      .lane-bg { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
      .lane-header { fill: #e2e8f0; stroke: #94a3b8; stroke-width: 1.5; }
      .action-usr { fill: #ffffff; stroke: #2563eb; stroke-width: 1.5; rx: 6; ry: 6; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.04)); }
      .action-sys { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.5; rx: 6; ry: 6; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.04)); }
      .decision-box { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
      .flow-line { stroke: #334155; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .flow-line-noarrow { stroke: #334155; stroke-width: 1.5; fill: none; }
    </style>
    <marker
       id="arrow"
       viewBox="0 0 10 10"
       refX="9"
       refY="5"
       markerWidth="6"
       markerHeight="6"
       orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155" id="path1" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff" id="rect1" />
  <text x="370.0" y="32" class="title" id="text1">▲圖 5-3-4 植物病害診斷分析活動圖</text>

  <!-- Swimlanes -->
  <rect x="45" y="55" width="325.0" height="820" class="lane-bg" id="rect2" />
  <rect x="45" y="55" width="325.0" height="35" class="lane-header" id="rect3" />
  <text x="207.5" y="77" class="lane-title" id="text3">使用者 (Android)</text>

  <rect x="370.0" y="55" width="325.0" height="820" class="lane-bg" id="rect4" />
  <rect x="370.0" y="55" width="325.0" height="35" class="lane-header" id="rect5" />
  <text x="532.5" y="77" class="lane-title" id="text5">後端與 AI 協同引擎</text>

  <!-- Start Node -->
  <circle cx="207.5" cy="108" r="11" fill="#0f172a" id="circle5" />

  <!-- User Actions -->
  <rect x="112.5" y="135" width="190" height="42" class="action-usr" id="rect6" />
  <text x="207.5" y="161" class="text-bold" id="text6">拍照或選取照片</text>

  <rect x="112.5" y="205" width="190" height="42" class="action-usr" id="rect7" />
  <text x="207.5" y="231" class="text-bold" id="text8">發起診斷分析請求</text>

  <rect x="112.5" y="275" width="190" height="42" class="action-usr" id="rect12" />
  <text x="207.5" y="301" class="text-bold" id="text13">提示重拍</text>

  <!-- Backend Preprocessing & Quality Check -->
  <rect x="437.5" y="205" width="190" height="42" class="action-sys" id="rect9" />
  <text x="532.5" y="231" class="text-bold" id="text10">影像前處理與品質濾波</text>

  <polygon points="532.5,274 605.0,296.0 532.5,318 460.0,296.0" class="decision-box" id="polygon11" />
  <text x="532.5" y="300.0" class="text-decision" id="text12">影像品質是否合格</text>

  <!-- Step 1: Local ConvNeXt Fast Screen -->
  <rect x="437.5" y="348" width="190" height="42" class="action-sys" id="rect14" />
  <text x="532.5" y="374" class="text-bold" id="text15">本地 ConvNeXt 快篩</text>

  <polygon points="532.5,416 617.5,438.0 532.5,460 447.5,438.0" class="decision-box" id="polygon16" />
  <text x="532.5" y="442" class="text-decision" id="text17">信心度 ≥0.75 ?</text>

  <!-- Disease Identification Branches -->
  <rect x="378.0" y="492" width="142" height="42" class="action-sys" id="rect17" />
  <text x="449.0" y="518" class="text-bold" id="text18">本地命中已知病害</text>

  <rect x="545.0" y="492" width="142" height="42" class="action-sys" id="rect21" />
  <text x="616.0" y="518" class="text-bold" id="text22">雲端 Gemini 3.8 兜底</text>

  <!-- Unified Step 2: Query MySQL Official Prescription DB -->
  <rect x="437.5" y="564" width="190" height="42" class="action-sys" id="rect_db_query" />
  <text x="532.5" y="590" class="text-bold" id="text_db_query">查詢 MySQL 官方防治庫</text>

  <polygon points="532.5,632 617.5,654.0 532.5,676 447.5,654.0" class="decision-box" id="polygon_db" />
  <text x="532.5" y="658" class="text-decision" id="text_db_dec">資料庫是否有處方 ?</text>

  <!-- Prescription Branches -->
  <rect x="378.0" y="708" width="142" height="42" class="action-sys" id="rect19" />
  <text x="449.0" y="734" class="text-bold" id="text20">採用資料庫審定處方</text>

  <rect x="545.0" y="708" width="142" height="42" class="action-sys" id="rect23" />
  <text x="616.0" y="734" class="text-bold" id="text24">FAISS 檢索+Gemini 生成</text>

  <!-- Final Report Packaging & Display -->
  <rect x="437.5" y="782" width="190" height="42" class="action-sys" id="rect25" />
  <text x="532.5" y="808" class="text-bold" id="text26">打包結構化報告 JSON</text>

  <rect x="112.5" y="782" width="190" height="42" class="action-usr" id="rect27" />
  <text x="207.5" y="808" class="text-bold" id="text28">圖文展示診斷結果</text>

  <circle cx="207.5" cy="852" r="8" fill="#0f172a" id="circle29" />
  <circle cx="207.5" cy="852" r="14" fill="none" stroke="#0f172a" stroke-width="2" id="circle30" />

  <!-- Flow Lines -->
  <line x1="207.5" y1="119" x2="207.5" y2="135" class="flow-line" />
  <line x1="207.5" y1="177" x2="207.5" y2="205" class="flow-line" />
  <line x1="302.5" y1="226" x2="437.5" y2="226" class="flow-line" />
  <line x1="532.5" y1="247" x2="532.5" y2="274" class="flow-line" />

  <!-- Quality Fail -> Retake -->
  <line x1="460.0" y1="296.0" x2="302.5" y2="296.0" class="flow-line" />
  <rect x="315.75" y="278.0" width="131" height="16" class="label-bg" />
  <text x="381.25" y="290.0" class="text-edge">[模糊失焦/嚴重過曝]</text>
  <line x1="112.5" y1="296.0" x2="70" y2="296.0" class="flow-line-noarrow" />
  <line x1="70" y1="296.0" x2="70" y2="156.0" class="flow-line-noarrow" />
  <line x1="70" y1="156.0" x2="112.5" y2="156.0" class="flow-line" />

  <!-- Quality Pass -> ConvNeXt -->
  <line x1="532.5" y1="318" x2="532.5" y2="348" class="flow-line" />
  <rect x="505.5" y="325.0" width="54" height="16" class="label-bg" />
  <text x="532.5" y="337.0" class="text-edge">[合格]</text>

  <!-- ConvNeXt -> Confidence Decision -->
  <line x1="532.5" y1="390" x2="532.5" y2="416" class="flow-line" />

  <!-- Confidence >= 0.75 (Left) -->
  <line x1="447.5" y1="438.0" x2="447.5" y2="492" class="flow-line" />
  <text x="425.0" y="430" class="text-edge">[高信心 (≥0.75)]</text>

  <!-- Confidence < 0.75 (Right) -->
  <line x1="617.5" y1="438.0" x2="617.5" y2="492" class="flow-line" />
  <text x="640.0" y="430" class="text-edge">[低信心/未命中]</text>

  <!-- Merge into Query MySQL DB -->
  <line x1="449.0" y1="534" x2="449.0" y2="548" class="flow-line-noarrow" />
  <line x1="449.0" y1="548" x2="507.5" y2="548" class="flow-line-noarrow" />
  <line x1="507.5" y1="548" x2="507.5" y2="564" class="flow-line" />

  <line x1="616.0" y1="534" x2="616.0" y2="548" class="flow-line-noarrow" />
  <line x1="616.0" y1="548" x2="557.5" y2="548" class="flow-line-noarrow" />
  <line x1="557.5" y1="548" x2="557.5" y2="564" class="flow-line" />

  <!-- Query MySQL DB -> DB Decision -->
  <line x1="532.5" y1="606" x2="532.5" y2="632" class="flow-line" />

  <!-- DB Has Prescription (Left) -->
  <line x1="447.5" y1="654.0" x2="447.5" y2="708" class="flow-line" />
  <text x="425.0" y="646" class="text-edge">[有現成處方]</text>

  <!-- DB No Prescription -> FAISS + Gemini (Right) -->
  <line x1="617.5" y1="654.0" x2="617.5" y2="708" class="flow-line" />
  <text x="640.0" y="646" class="text-edge">[無現成處方]</text>

  <!-- Merge into Package JSON -->
  <line x1="449.0" y1="750" x2="449.0" y2="764" class="flow-line-noarrow" />
  <line x1="449.0" y1="764" x2="507.5" y2="764" class="flow-line-noarrow" />
  <line x1="507.5" y1="764" x2="507.5" y2="782" class="flow-line" />

  <line x1="616.0" y1="750" x2="616.0" y2="764" class="flow-line-noarrow" />
  <line x1="616.0" y1="764" x2="557.5" y2="764" class="flow-line-noarrow" />
  <line x1="557.5" y1="764" x2="557.5" y2="782" class="flow-line" />

  <!-- Package JSON -> Display Result -> End -->
  <line x1="437.5" y1="803.0" x2="302.5" y2="803.0" class="flow-line" />
  <line x1="207.5" y1="824" x2="207.5" y2="838" class="flow-line" />
</svg>
