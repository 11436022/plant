<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 960" width="740" height="960">
  <defs>
    <style>
      .title { font-family: 'Microsoft JhengHei', 'PingFang TC', sans-serif; font-size: 16px; font-weight: bold; fill: #0f172a; }
      .lane-title { font-family: 'Microsoft JhengHei', 'PingFang TC', sans-serif; font-size: 14px; font-weight: bold; fill: #1e293b; text-anchor: middle; }
      .text-bold { font-family: 'Microsoft JhengHei', 'PingFang TC', sans-serif; font-size: 12px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
      .text-sub { font-family: 'Microsoft JhengHei', 'PingFang TC', sans-serif; font-size: 10px; fill: #475569; text-anchor: middle; }
      .text-decision { font-family: 'Microsoft JhengHei', 'PingFang TC', sans-serif; font-size: 11px; font-weight: bold; fill: #1d4ed8; text-anchor: middle; }
      .edge-label { font-family: 'Microsoft JhengHei', 'PingFang TC', sans-serif; font-size: 10px; font-weight: bold; fill: #2563eb; text-anchor: middle; }
      .lane-bg { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.2; }
      .lane-header { fill: #e2e8f0; stroke: #94a3b8; stroke-width: 1.2; }
      .action-usr { fill: #ffffff; stroke: #2563eb; stroke-width: 1.5; rx: 8; ry: 8; }
      .action-sys { fill: #ffffff; stroke: #16a34a; stroke-width: 1.5; rx: 8; ry: 8; }
      .action-warn { fill: #fffbeb; stroke: #d97706; stroke-width: 1.5; rx: 8; ry: 8; }
      .decision-box { fill: #ffffff; stroke: #2563eb; stroke-width: 1.5; }
      .flow-line { stroke: #334155; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />
  <text x="370" y="30" class="title" text-anchor="middle">▲ 圖 5-3-4 植物病害診斷分析活動圖</text>

  <!-- Swimlane 1: 使用者 (Android) -->
  <rect x="45" y="50" width="325" height="890" class="lane-bg" />
  <rect x="45" y="50" width="325" height="40" class="lane-header" />
  <text x="207.5" y="75" class="lane-title">使用者 (Android)</text>

  <!-- Swimlane 2: 後端與 AI 協同引擎 -->
  <rect x="370" y="50" width="325" height="890" class="lane-bg" />
  <rect x="370" y="50" width="325" height="40" class="lane-header" />
  <text x="532.5" y="75" class="lane-title">後端與 AI 協同引擎</text>

  <!-- Start Node -->
  <circle cx="207.5" cy="115" r="12" fill="#0f172a" />
  <path d="M 207.5 127 L 207.5 150" class="flow-line" />

  <!-- Usr: 拍照或選取照片 -->
  <rect x="112.5" y="150" width="190" height="44" class="action-usr" />
  <text x="207.5" y="169" class="text-bold">拍照或選取植物照片</text>
  <text x="207.5" y="184" class="text-sub">相機拍攝對焦或自相簿選取</text>

  <path d="M 207.5 194 L 207.5 220" class="flow-line" />

  <!-- Usr: 發起診斷請求 -->
  <rect x="112.5" y="220" width="190" height="44" class="action-usr" />
  <text x="207.5" y="239" class="text-bold">發起診斷分析請求</text>
  <text x="207.5" y="254" class="text-sub">POST /api/v1/predict</text>

  <!-- To Server -->
  <path d="M 302.5 242 L 437.5 242" class="flow-line" />

  <!-- Sys: 影像品質檢驗 -->
  <rect x="437.5" y="220" width="190" height="44" class="action-sys" />
  <text x="532.5" y="239" class="text-bold">影像前處理與品質濾波</text>
  <text x="532.5" y="254" class="text-sub">Laplacian 梯度清晰度檢驗</text>

  <path d="M 532.5 264 L 532.5 290" class="flow-line" />

  <!-- Decision: 品質是否合格 -->
  <polygon points="532.5,290 607.5,312 532.5,334 457.5,312" class="decision-box" />
  <text x="532.5" y="316" class="text-decision">影像品質合格？</text>

  <!-- Failed branch: back to user -->
  <path d="M 457.5 312 L 302.5 312" class="flow-line" />
  <text x="380" y="306" class="edge-label">[失焦/過暗]</text>

  <!-- Usr: 提示重拍 -->
  <rect x="112.5" y="290" width="190" height="44" class="action-warn" />
  <text x="207.5" y="309" class="text-bold">提示照片模糊請重拍</text>
  <text x="207.5" y="324" class="text-sub">防呆攔截避免無效浪費</text>

  <path d="M 112.5 312 L 70 312 L 70 172 L 112.5 172" class="flow-line" />

  <!-- Quality OK -->
  <path d="M 532.5 334 L 532.5 360" class="flow-line" />
  <text x="555" y="348" class="edge-label">[合格]</text>

  <!-- Sys: ConvNeXt 快篩 -->
  <rect x="437.5" y="360" width="190" height="44" class="action-sys" />
  <text x="532.5" y="379" class="text-bold">本地自訓 ConvNeXt 快篩</text>
  <text x="532.5" y="394" class="text-sub">Softmax 信心度與特徵餘弦比對</text>

  <path d="M 532.5 404 L 532.5 430" class="flow-line" />

  <!-- Sys: Grad-CAM 空間前景檢驗 -->
  <rect x="437.5" y="430" width="190" height="44" class="action-sys" />
  <text x="532.5" y="449" class="text-bold">Grad-CAM 空間注意力檢驗</text>
  <text x="532.5" y="464" class="text-sub">檢查病斑熱力圖葉片對齊率</text>

  <path d="M 532.5 474 L 532.5 500" class="flow-line" />

  <!-- Decision: 快篩 ≥0.75 且 前景 ≥35% ? -->
  <polygon points="532.5,500 617.5,522 532.5,544 447.5,522" class="decision-box" />
  <text x="532.5" y="520" class="text-decision">快篩≥75% &amp; 前景≥35%?</text>
  <text x="532.5" y="533" class="text-sub">(雙重安全門檻)</text>

  <!-- Left: Pass ➔ Visual Memory 比對 ➔ 本地高信心 -->
  <path d="M 447.5 522 L 400 522 L 400 565" class="flow-line" />
  <text x="420" y="515" class="edge-label">[通過]</text>

  <rect x="330" y="565" width="140" height="44" class="action-sys" />
  <text x="400" y="584" class="text-bold">比對視覺記憶庫</text>
  <text x="400" y="599" class="text-sub">Visual Memory 檢索校準</text>

  <!-- Right: Fallback ➔ Gemini 3.8 Flash -->
  <path d="M 617.5 522 L 660 522 L 660 565" class="flow-line" />
  <text x="640" y="515" class="edge-label">[未通過/分流]</text>

  <rect x="590" y="565" width="140" height="44" class="action-sys" />
  <text x="660" y="584" class="text-bold">雲端 Gemini 3.8 兜底</text>
  <text x="660" y="599" class="text-sub">多模態廣域病徵推論</text>

  <!-- Converge to Safety Brake Decision -->
  <path d="M 400 609 L 400 635 L 532.5 635" class="flow-line" />
  <path d="M 660 609 L 660 635 L 532.5 635" class="flow-line" />

  <path d="M 532.5 635 L 532.5 655" class="flow-line" />

  <!-- Decision: 綜合把握度 ≥ 65% ? -->
  <polygon points="532.5,655 607.5,677 532.5,699 457.5,677" class="decision-box" />
  <text x="532.5" y="681" class="text-decision">綜合把握度 ≥ 65%？</text>

  <!-- Low confidence: Safety Brake -->
  <path d="M 457.5 677 L 390 677 L 390 720" class="flow-line" />
  <text x="415" y="670" class="edge-label">[把握度不足]</text>

  <rect x="320" y="720" width="140" height="44" class="action-warn" />
  <text x="390" y="739" class="text-bold">啟動安全防禦剎車</text>
  <text x="390" y="754" class="text-sub">標記「無法判定/送檢」</text>

  <!-- High confidence: MySQL + FAISS RAG 處方 -->
  <path d="M 607.5 677 L 660 677 L 660 720" class="flow-line" />
  <text x="640" y="670" class="edge-label">[研判明確]</text>

  <rect x="590" y="720" width="140" height="44" class="action-sys" />
  <text x="660" y="739" class="text-bold">雙軌權威處方檢索</text>
  <text x="660" y="754" class="text-sub">MySQL 與 FAISS 專書溯源</text>

  <!-- Both join to Package JSON -->
  <path d="M 390 764 L 390 790 L 532.5 790" class="flow-line" />
  <path d="M 660 764 L 660 790 L 532.5 790" class="flow-line" />

  <path d="M 532.5 790 L 532.5 810" class="flow-line" />

  <!-- Sys: 打包結構化報告 -->
  <rect x="437.5" y="810" width="190" height="44" class="action-sys" />
  <text x="532.5" y="829" class="text-bold">打包結構化報告 JSON</text>
  <text x="532.5" y="844" class="text-sub">推論路徑、文獻出處與剎車旗標</text>

  <!-- To Usr -->
  <path d="M 437.5 832 L 302.5 832" class="flow-line" />

  <!-- Usr: 圖文展示診斷結果 -->
  <rect x="112.5" y="810" width="190" height="44" class="action-usr" />
  <text x="207.5" y="829" class="text-bold">圖文展示診斷分析結果</text>
  <text x="207.5" y="844" class="text-sub">呈現病徵、處方出處或送檢警示</text>

  <path d="M 207.5 854 L 207.5 890" class="flow-line" />

  <!-- End Node -->
  <circle cx="207.5" cy="898" r="8" fill="#0f172a" />
  <circle cx="207.5" cy="898" r="14" fill="none" stroke="#0f172a" stroke-width="2" />
</svg>