<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 680" width="1060" height="680">
  <defs>
    <style>
      .title { font-family: 'Microsoft JhengHei', sans-serif; font-size: 20px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
      .pkg-title { font-family: 'Microsoft JhengHei', sans-serif; font-size: 14.5px; font-weight: bold; fill: #0f172a; }
      .comp-title { font-family: 'Microsoft JhengHei', sans-serif; font-size: 13.5px; font-weight: bold; fill: #0f172a; }
      .comp-desc { font-family: 'Microsoft JhengHei', sans-serif; font-size: 11.5px; font-weight: 500; fill: #334155; }
      .interface-text { font-family: 'Microsoft JhengHei', sans-serif; font-size: 11.5px; font-weight: bold; fill: #1e40af; paint-order: stroke fill; stroke: #ffffff; stroke-width: 3.5px; stroke-linejoin: round; }
      .dep-label { font-family: 'Microsoft JhengHei', sans-serif; font-size: 11px; font-weight: bold; fill: #334155; paint-order: stroke fill; stroke: #ffffff; stroke-width: 3px; stroke-linejoin: round; }

      .subsystem-bg { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.4; rx: 6; ry: 6; }
      .subsystem-header { fill: #e2e8f0; stroke: #94a3b8; stroke-width: 1.4; }

      .comp-box { fill: #ffffff; stroke: #2563eb; stroke-width: 1.3; rx: 5; ry: 5; }
      .ai-comp-box { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.4; rx: 5; ry: 5; }
      .db-comp-box { fill: #fefce8; stroke: #ca8a04; stroke-width: 1.3; rx: 5; ry: 5; }
      .cloud-comp-box { fill: #f8fafc; stroke: #64748b; stroke-dasharray: 4,3; stroke-width: 1.3; rx: 5; ry: 5; }

      .line-inter { stroke: #1e293b; stroke-width: 1.4; stroke-dasharray: 5,3; fill: none; marker-end: url(#arrow); }
      .line-trunk { stroke: #1e293b; stroke-width: 1.4; stroke-dasharray: 5,3; fill: none; }
      .line-intra { stroke: #475569; stroke-width: 1.2; stroke-dasharray: 4,3; fill: none; marker-end: url(#arrow); }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#1e293b" />
    </marker>

    <!-- Component Icon -->
    <g id="comp-icon">
      <rect x="0" y="0" width="14" height="11" fill="#e2e8f0" stroke="#475569" stroke-width="0.9" />
      <rect x="-3" y="2" width="5" height="2" fill="#ffffff" stroke="#475569" stroke-width="0.7" />
      <rect x="-3" y="6" width="5" height="2" fill="#ffffff" stroke="#475569" stroke-width="0.7" />
    </g>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" />
  <text x="530" y="32" class="title">▲圖 7-3-1 系統架構元件圖 (Component Diagram)</text>

  <!-- ========================================================================= -->
  <!-- 1. CLIENT SUBSYSTEM (x=20, w=245, h=615)                                  -->
  <!-- ========================================================================= -->
  <g transform="translate(20, 52)">
    <rect width="245" height="615" class="subsystem-bg" />
    <path d="M 0 6 Q 0 0 6 0 L 239 0 Q 245 0 245 6 L 245 28 L 0 28 Z" class="subsystem-header" />
    <text x="12" y="19" class="pkg-title">客戶端元件群 (Client Subsystem)</text>

    <!-- C1: Android UI -->
    <g transform="translate(10, 38)">
      <rect width="225" height="86" class="comp-box" />
      <use href="#comp-icon" x="202" y="10" />
      <text x="10" y="24" class="comp-title">Android UI 元件群</text>
      <text x="10" y="48" class="comp-desc">• 拍照診斷、病歷日誌檢視與備忘</text>
      <text x="10" y="68" class="comp-desc">• 糾錯反饋提報與時序警報推播</text>
    </g>

    <!-- C2: REST API Client -->
    <g transform="translate(10, 140)">
      <rect width="225" height="86" class="comp-box" />
      <use href="#comp-icon" x="202" y="10" />
      <text x="10" y="24" class="comp-title">REST API 客戶端元件</text>
      <text x="10" y="48" class="comp-desc">• Retrofit2 HTTP 通訊與 OkHttp3</text>
      <text x="10" y="68" class="comp-desc">• JWT 認證權杖自動注入與圖檔傳輸</text>
    </g>

    <!-- C3: Local Storage -->
    <g transform="translate(10, 242)">
      <rect width="225" height="86" class="comp-box" />
      <use href="#comp-icon" x="202" y="10" />
      <text x="10" y="24" class="comp-title">本機儲存與快取元件</text>
      <text x="10" y="48" class="comp-desc">• EncryptedSharedPreferences (Token)</text>
      <text x="10" y="68" class="comp-desc">• 離線診斷暫存與圖片本機快取</text>
    </g>

    <!-- C4: Admin Web Dashboard -->
    <g transform="translate(10, 360)">
      <rect width="225" height="110" class="comp-box" />
      <use href="#comp-icon" x="202" y="10" />
      <text x="10" y="24" class="comp-title">管理員儀表板 (Admin Web)</text>
      <text x="10" y="48" class="comp-desc">• 糾錯回饋審核與專家真值標註</text>
      <text x="10" y="68" class="comp-desc">• 視覺特徵向量快取批次重建</text>
      <text x="10" y="88" class="comp-desc">• 標準訓練集匯出與模型本地重訓</text>
    </g>

    <!-- C5: Webcam Monitor -->
    <g transform="translate(10, 486)">
      <rect width="225" height="86" class="comp-box" />
      <use href="#comp-icon" x="202" y="10" />
      <text x="10" y="24" class="comp-title">Webcam 監控串流元件</text>
      <text x="10" y="48" class="comp-desc">• 定時影格擷取與連續取樣上傳</text>
      <text x="10" y="68" class="comp-desc">• 即時警報輪詢與郵件通知聯動</text>
    </g>

    <line x1="122" y1="124" x2="122" y2="140" class="line-intra" />
    <line x1="122" y1="226" x2="122" y2="242" class="line-intra" />
  </g>

  <!-- ========================================================================= -->
  <!-- 2. BACKEND SUBSYSTEM (x=315, w=450, h=615)                                -->
  <!-- ========================================================================= -->
  <g transform="translate(315, 52)">
    <rect width="450" height="615" class="subsystem-bg" />
    <path d="M 0 6 Q 0 0 6 0 L 444 0 Q 450 0 450 6 L 450 28 L 0 28 Z" class="subsystem-header" />
    <text x="12" y="19" class="pkg-title">FastAPI 後端核心服務群 (Backend Subsystem)</text>

    <!-- Row 1: B1 API Gateway (w=205) & B2 Auth (w=205) -->
    <g transform="translate(10, 38)">
      <rect width="205" height="74" class="comp-box" />
      <use href="#comp-icon" x="182" y="8" />
      <text x="8" y="22" class="comp-title">API 路由閘道元件</text>
      <text x="8" y="44" class="comp-desc">• REST 路由集中分派與過濾</text>
      <text x="8" y="62" class="comp-desc">• Pydantic 資料契約型別自動校驗</text>
    </g>
    <g transform="translate(235, 38)">
      <rect width="205" height="74" class="comp-box" />
      <use href="#comp-icon" x="182" y="8" />
      <text x="8" y="22" class="comp-title">身分認證與安全元件</text>
      <text x="8" y="44" class="comp-desc">• Bcrypt 密碼安全雜湊與驗證</text>
      <text x="8" y="62" class="comp-desc">• JWT 權杖簽署發放與權限控管</text>
    </g>

    <!-- B1 -> B2 -->
    <line x1="215" y1="75" x2="235" y2="75" class="line-intra" />

    <!-- Row 2: B3 Cascade Diagnosis Core (w=430) -->
    <g transform="translate(10, 124)">
      <rect width="430" height="82" class="ai-comp-box" />
      <use href="#comp-icon" x="406" y="8" />
      <text x="10" y="22" class="comp-title">階層式診斷與處方決策核心 (ai.py)</text>
      <text x="10" y="46" class="comp-desc">• 階段一：ConvNeXt 快篩 (≥75% &amp; 前景≥35%) 與 Gemini 兜底</text>
      <text x="10" y="66" class="comp-desc">• 階段二：優先查詢本地 MySQL 審定處方，缺漏調用 FAISS 專書溯源</text>
    </g>

    <line x1="112" y1="112" x2="112" y2="124" class="line-intra" />

    <!-- Row 3: B4 ConvNeXt (w=205) & B5 Visual Memory (w=205) -->
    <g transform="translate(10, 218)">
      <rect width="205" height="78" class="ai-comp-box" />
      <use href="#comp-icon" x="182" y="8" />
      <text x="8" y="20" class="comp-title">本地 ConvNeXt 快篩推論</text>
      <text x="8" y="42" class="comp-desc">• 38 類自訓特徵 Softmax 信心度</text>
      <text x="8" y="60" class="comp-desc">• Grad-CAM 空間前景注意力驗證</text>
    </g>
    <g transform="translate(235, 218)">
      <rect width="205" height="78" class="ai-comp-box" />
      <use href="#comp-icon" x="182" y="8" />
      <text x="8" y="20" class="comp-title">視覺記憶庫 (Visual RAG)</text>
      <text x="8" y="42" class="comp-desc">• 768維歷史專家標註檢索飛輪</text>
      <text x="8" y="60" class="comp-desc">• 覆核即時刻錄與向量索引重構</text>
    </g>

    <line x1="112" y1="206" x2="112" y2="218" class="line-intra" />
    <line x1="337" y1="206" x2="337" y2="218" class="line-intra" />

    <!-- Row 4: B6 FAISS RAG (w=205) & B7 Model Trainer (w=205) -->
    <g transform="translate(10, 308)">
      <rect width="205" height="78" class="ai-comp-box" />
      <use href="#comp-icon" x="182" y="8" />
      <text x="8" y="20" class="comp-title">FAISS 專書檢索 (rag.py)</text>
      <text x="8" y="42" class="comp-desc">• 農業部官方病蟲害專書文本切片</text>
      <text x="8" y="60" class="comp-desc">• 處方缺漏時注入 Gemini 溯源依據</text>
    </g>
    <g transform="translate(235, 308)">
      <rect width="205" height="78" class="ai-comp-box" />
      <use href="#comp-icon" x="182" y="8" />
      <text x="8" y="20" class="comp-title">主動學習引擎 (Trainer)</text>
      <text x="8" y="42" class="comp-desc">• 標準訓練集與 manifest 匯出組織</text>
      <text x="8" y="60" class="comp-desc">• PyTorch 本地微調重訓與權重更新</text>
    </g>

    <!-- Row 5: B8 Diary & Feedback (w=430) -->
    <g transform="translate(10, 398)">
      <rect width="430" height="76" class="comp-box" />
      <use href="#comp-icon" x="406" y="8" />
      <text x="10" y="20" class="comp-title">植物日誌與反饋管理元件</text>
      <text x="10" y="42" class="comp-desc">• 二階段病歷持久化 (prediction_cache 暫存 ➜ 使用者確認儲存)</text>
      <text x="10" y="60" class="comp-desc">• 個人備忘筆記更新、刪除維護與使用者糾錯反饋歸檔</text>
    </g>

    <!-- Row 6: B9 Webcam Alert Engine (w=430) -->
    <g transform="translate(10, 486)">
      <rect width="430" height="76" class="comp-box" />
      <use href="#comp-icon" x="406" y="8" />
      <text x="10" y="20" class="comp-title">Webcam 時序警報引擎 (webcam.py)</text>
      <text x="10" y="42" class="comp-desc">• 連續 3 影格共識判定 (≥80%) 防誤報機制</text>
      <text x="10" y="60" class="comp-desc">• 觸發高危病害警報並非同步寫入時序資料庫與 SMTP 郵件推播</text>
    </g>

    <path d="M 10 75 L 2 75 L 2 436 L 10 436" class="line-intra" />
    <path d="M 10 75 L 2 75 L 2 524 L 10 524" class="line-intra" />
  </g>

  <!-- ========================================================================= -->
  <!-- 3. EXTERNAL SUBSYSTEM (x=825, w=215, h=615)                              -->
  <!-- ========================================================================= -->
  <g transform="translate(825, 52)">
    <rect width="215" height="615" class="subsystem-bg" />
    <path d="M 0 6 Q 0 0 6 0 L 209 0 Q 215 0 215 6 L 215 28 L 0 28 Z" class="subsystem-header" />
    <text x="10" y="19" class="pkg-title">外部服務與資料庫 (External)</text>

    <!-- E1: Google Gemini API -->
    <g transform="translate(10, 38)">
      <rect width="195" height="82" class="cloud-comp-box" />
      <use href="#comp-icon" x="172" y="8" />
      <text x="8" y="22" class="comp-title">Google Gemini 3.8 API</text>
      <text x="8" y="44" class="comp-desc">• 雲端多模態全域病徵推論</text>
      <text x="8" y="64" class="comp-desc">• 結合 FAISS 專書動態生成處方</text>
    </g>

    <!-- E2: OpenAI Backup Fallback -->
    <g transform="translate(10, 132)">
      <rect width="195" height="74" class="cloud-comp-box" />
      <use href="#comp-icon" x="172" y="8" />
      <text x="8" y="22" class="comp-title">OpenAI gpt-4o-mini (備援)</text>
      <text x="8" y="44" class="comp-desc">• 跨雲自動備援防禦通道</text>
      <text x="8" y="62" class="comp-desc">• Gemini 403/429 異常時自動接棒</text>
    </g>

    <!-- E3: Google SMTP -->
    <g transform="translate(10, 218)">
      <rect width="195" height="74" class="cloud-comp-box" />
      <use href="#comp-icon" x="172" y="8" />
      <text x="8" y="22" class="comp-title">Google SMTP 郵件服務</text>
      <text x="8" y="44" class="comp-desc">• Gmail TLS 安全通訊 (Port 587)</text>
      <text x="8" y="62" class="comp-desc">• 註冊驗證碼與 Webcam 警報信</text>
    </g>

    <!-- E4: MySQL Relational DB -->
    <g transform="translate(10, 304)">
      <rect width="195" height="268" class="db-comp-box" />
      <use href="#comp-icon" x="172" y="8" />
      <text x="8" y="22" class="comp-title">MySQL 關聯式資料庫</text>
      <text x="8" y="52" class="comp-desc">• 官方作物病蟲害權威處方庫</text>
      <text x="8" y="82" class="comp-desc">• 會員帳號、權限與 JWT 憑證</text>
      <text x="8" y="112" class="comp-desc">• 植物病歷日誌與個人備忘筆記</text>
      <text x="8" y="142" class="comp-desc">• Webcam 時序警報觸發歷史</text>
      <text x="8" y="172" class="comp-desc">• 糾錯回饋審核與專家真值標籤</text>
      <text x="8" y="202" class="comp-desc">• SQLAlchemy 2.0 ORM 連線池</text>
      <text x="8" y="232" class="comp-desc">• Alembic 資料庫版本遷移支援</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- 4. INTER-SUBSYSTEM CONNECTORS (BUS TRUNK IN GUTTER 1)                     -->
  <!-- ========================================================================= -->
  <!-- Vertical Bus Trunk in Gutter 1 at x=280 from y=578 to y=127 -->
  <line x1="245" y1="232" x2="280" y2="232" class="line-trunk" />
  <text x="262" y="224" class="interface-text" text-anchor="middle">REST</text>

  <line x1="245" y1="465" x2="280" y2="465" class="line-trunk" />
  <text x="262" y="457" class="interface-text" text-anchor="middle">Web</text>

  <line x1="245" y1="578" x2="280" y2="578" class="line-trunk" />
  <text x="262" y="570" class="interface-text" text-anchor="middle">Stream</text>

  <line x1="280" y1="578" x2="280" y2="127" class="line-trunk" />
  <line x1="280" y1="127" x2="315" y2="127" class="line-inter" />
  <text x="298" y="118" class="interface-text" text-anchor="middle">HTTPS</text>

  <!-- Gutter 2: Backend to External -->
  <!-- B3 ai.py -> E1 Gemini (abs y = 210 -> 130) -->
  <line x1="755" y1="210" x2="825" y2="130" class="line-inter" />
  <text x="790" y="160" class="interface-text" text-anchor="middle">HTTPS API</text>

  <!-- B3 ai.py -> E4 MySQL Prescription (abs y = 210 -> 400) -->
  <line x1="755" y1="210" x2="825" y2="400" class="line-inter" />
  <text x="790" y="295" class="interface-text" text-anchor="middle">查審定處方</text>

  <!-- B8 Diaries -> E4 MySQL (abs y = 486 -> 486) -->
  <line x1="755" y1="486" x2="825" y2="486" class="line-inter" />
  <text x="790" y="478" class="interface-text" text-anchor="middle">SQLAlchemy</text>

  <!-- B9 Webcam -> E4 & E3 -->
  <line x1="755" y1="578" x2="825" y2="578" class="line-inter" />
  <text x="790" y="570" class="interface-text" text-anchor="middle">警報紀錄</text>

  <path d="M 755 578 L 780 578 L 780 305 L 825 305" class="line-inter" />
  <text x="800" y="325" class="interface-text" text-anchor="middle">SMTP</text>

</svg>