  <text
     x="75.0"
     y="115"
     class="msg-text"
     text-anchor="start"
     id="text14">1: 進入管理者「使用者回饋」審核分頁</text>
  <line
     x1="280.0"
     y1="145"
     x2="480.0"
     y2="145"
     class="msg-line"
     id="line15" />
  <text
     x="285.0"
     y="140"
     class="msg-text"
     text-anchor="start"
     id="text15">2: GET /admin/feedback/ (帶管理者認證)</text>
  <line
     x1="490.0"
     y1="175"
     x2="690.0"
     y2="175"
     class="msg-line"
     id="line16" />
  <text
     x="490.78687"
     y="154.83272"
     class="msg-text"
     text-anchor="start"
     id="text16"><tspan
       sodipodi:role="line"
       id="tspan25"
       x="490.78687"
       y="154.83272">3: SELECT * FROM diagnosis_feedback</tspan><tspan
       sodipodi:role="line"
       id="tspan26"
       x="490.78687"
       y="168.58272">ORDER BY created_at DESC LIMIT 20</tspan></text>
  <line
     x1="690.0"
     y1="210"
     x2="490.0"
     y2="210"
     class="ret-line"
     id="line17" />
  <text
     x="495.0"
     y="205"
     class="ret-text"
     text-anchor="start"
     id="text17">4: 回傳使用者回報之疑義病徵紀錄與影像 URL</text>
  <line
     x1="480.0"
     y1="245"
     x2="280.0"
     y2="245"
     class="ret-line"
     id="line18" />
  <text
     x="285.0"
     y="240"
     class="ret-text"
     text-anchor="start"
     id="text18">5: HTTP 200 OK (渲染 feedback.html)</text>
  <line
     x1="270.0"
     y1="280"
     x2="70.0"
     y2="280"
     class="ret-line"
     id="line19" />
  <text
     x="75"
     y="275"
     class="ret-text"
     text-anchor="start"
     id="text19">6: 呈現回報之疑義病徵照片與原始 AI 預測標籤</text>
  <line
     x1="70.0"
     y1="320"
     x2="270.0"
     y2="320"
     class="msg-line"
     id="line20" />
  <text
     x="75.0"
     y="315"
     class="msg-text"
     text-anchor="start"
     id="text20">7: 檢視病徵照片，輸入專家校正之作物與病害名稱，點選「儲存標註」</text>
  <line
     x1="280.0"
     y1="350"
     x2="480.0"
     y2="350"
     class="msg-line"
     id="line21" />
  <text
     x="285.0"
     y="345"
     class="msg-text"
     text-anchor="start"
     id="text21">8: POST /admin/feedback/annotate/{id} (plant_name, disease_name)</text>
  <line
     x1="490.0"
     y1="385"
     x2="690.0"
     y2="385"
     class="msg-line"
     id="line22" />
  <text
     x="495"
     y="380"
     class="msg-text"
     text-anchor="start"
     id="text22">9: UPDATE diagnosis_feedback</text>
