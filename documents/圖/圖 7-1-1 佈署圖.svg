    <text
       x="20"
       y="47"
       class="artifact-desc"
       id="text78">• 階層式快篩與兜底 :優先調度本地 ConvNet 進行極速快篩 (命中即 0 元成本)；未命中或低置信時無縫啟動 Gemini 雲端兜底，兼具極速低成本與超廣域泛化力。</text>
    <text
       x="20"
       y="65"
       class="artifact-desc"
       id="text79">• 零雲端託管成本 ：完全免除 Vertex AI / AutoML 端點高昂固定租金；本地自訓特定作物卷積神經網路直接部署於主機內部，經濟且可隨時複訓迭代。</text>
    <text
       x="20"
       y="83"
       class="artifact-desc"
       id="text80">• 知識庫檢索增強與客觀校驗 (RAG Verification)：整合 FAISS 向量索引與農業部官方病蟲害知識庫，結合 70% 信心度閾值過濾，杜絕 AI 幻覺，確保診斷指引具備農政權威性。</text>
  </g>
