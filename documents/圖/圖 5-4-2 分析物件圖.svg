<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" width="1000" height="530">
  <defs>
    <style>
      .title { font-family: 'Microsoft JhengHei', 'PingFang TC', sans-serif; font-size: 18px; font-weight: bold; fill: #1A281E; }
      .obj-title { font-family: 'Consolas', 'Courier New', monospace; font-size: 12.5px; font-weight: bold; text-decoration: underline; fill: #1A281E; text-anchor: middle; }
      .member-text { font-family: 'Consolas', 'Courier New', monospace; font-size: 11px; fill: #2D3748; }
      .cardinality { font-family: 'Consolas', monospace; font-size: 11px; font-weight: bold; fill: #1A281E; }
      .rel-label { font-family: 'Microsoft JhengHei', sans-serif; font-size: 10.5px; font-weight: bold; fill: #223827; text-anchor: middle; }
      
      .obj-box { fill: #FFFFFF; stroke: #4F7057; stroke-width: 1.5; rx: 4; ry: 4; }
      .obj-header { fill: #DDEAD7; }

      .feedback-box { fill: #FFFFFF; stroke: #4F7057; stroke-dasharray: 4,3; stroke-width: 1.5; rx: 4; ry: 4; }
      .feedback-header { fill: #E5EDE3; }

      .assoc-line { stroke: #334035; stroke-width: 1.4; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Diagram Title -->
  <text x="500" y="32" class="title" text-anchor="middle">圖 5-4-2 分析物件圖 (Analysis Object Diagram)</text>

  <!-- Object 1: user_01:使用者 -->
  <g transform="translate(35, 60)">
    <rect width="250" height="150" class="obj-box" />
    <path d="M 0 4 Q 0 0 4 0 L 246 0 Q 250 0 250 4 L 250 28 L 0 28 Z" class="obj-header" />
    <text x="125" y="19" class="obj-title">user_01 : 使用者</text>
    <text x="12" y="52" class="member-text">username = "john_farmer"</text>
    <text x="12" y="72" class="member-text">email = "john@example.com"</text>
    <text x="12" y="92" class="member-text">role = "user"</text>
    <text x="12" y="112" class="member-text">is_email_verified = true</text>
  </g>

  <!-- Object 2: diary_01:植物日誌 -->
  <g transform="translate(360, 60)">
    <rect width="265" height="165" class="obj-box" />
    <path d="M 0 4 Q 0 0 4 0 L 261 0 Q 265 0 265 4 L 265 28 L 0 28 Z" class="obj-header" />
    <text x="132.5" y="19" class="obj-title">diary_01 : 植物日誌</text>
    <text x="12" y="52" class="member-text">created_at = "2026-05-24"</text>
    <text x="12" y="72" class="member-text">user_note = "葉緣焦枯，先隔離"</text>
    <text x="12" y="92" class="member-text">status_name = "番茄早疫病"</text>
    <text x="12" y="112" class="member-text">confidence = 0.92</text>
    <text x="12" y="132" class="member-text">is_resolved = false</text>
  </g>

  <!-- Object 3: diag_01:診斷結果 -->
  <g transform="translate(695, 60)">
    <rect width="270" height="175" class="obj-box" />
    <path d="M 0 4 Q 0 0 4 0 L 266 0 Q 270 0 270 4 L 270 28 L 0 28 Z" class="obj-header" />
    <text x="135" y="19" class="obj-title">diag_01 : 診斷結果</text>
    <text x="12" y="50" class="member-text">crop_name = "番茄"</text>
    <text x="12" y="68" class="member-text">disease_name = "早疫病"</text>
    <text x="12" y="86" class="member-text">confidence = 0.92 (≥0.75 快篩命中)</text>
    <text x="12" y="104" class="member-text">gradcam_aligned = true (關注比48%)</text>
    <text x="12" y="122" class="member-text">is_safety_brake = false</text>
    <text x="12" y="140" class="member-text">treatment = "及時清除病葉 (官方處方)"</text>
  </g>

  <!-- Object 4: alert_01:監控警報 -->
  <g transform="translate(35, 265)">
    <rect width="250" height="150" class="obj-box" />
    <path d="M 0 4 Q 0 0 4 0 L 246 0 Q 250 0 250 4 L 250 28 L 0 28 Z" class="obj-header" />
    <text x="125" y="19" class="obj-title">alert_01 : 監控警報 (Webcam)</text>
    <text x="12" y="52" class="member-text">snapshot_url = "uploads/alert_01.jpg"</text>
    <text x="12" y="72" class="member-text">alert_status = "番茄晚疫病 (Webcam)"</text>
    <text x="12" y="92" class="member-text">alert_time = "2026-05-24 16:30"</text>
    <text x="12" y="112" class="member-text">is_resolved = false</text>
  </g>

  <!-- Object 5: image_01:病害圖片 -->
  <g transform="translate(360, 265)">
    <rect width="265" height="150" class="obj-box" />
    <path d="M 0 4 Q 0 0 4 0 L 261 0 Q 265 0 265 4 L 265 28 L 0 28 Z" class="obj-header" />
    <text x="132.5" y="19" class="obj-title">image_01 : 病害圖片</text>
    <text x="12" y="52" class="member-text">file_path = "uploads/leaf_01.jpg"</text>
    <text x="12" y="72" class="member-text">mime_type = "image/jpeg"</text>
    <text x="12" y="92" class="member-text">file_size = 348210 (bytes)</text>
    <text x="12" y="112" class="member-text">upload_time = "2026-05-24 14:20"</text>
  </g>

  <!-- Object 6: fb_01:診斷反饋 (主動學習實例) -->
  <g transform="translate(695, 260)">
    <rect width="270" height="165" class="feedback-box" />
    <path d="M 0 4 Q 0 0 4 0 L 266 0 Q 270 0 270 4 L 270 28 L 0 28 Z" class="feedback-header" />
    <text x="135" y="19" class="obj-title">fb_01 : 診斷反饋 (主動學習)</text>
    <text x="12" y="50" class="member-text">original_status = "早疫病 (初判)"</text>
    <text x="12" y="68" class="member-text">user_suggested = "斑枯病 (糾錯)"</text>
    <text x="12" y="86" class="member-text">manager_truth = "番茄斑枯病 (真值)"</text>
    <text x="12" y="104" class="member-text">is_reviewed = true</text>
    <text x="12" y="122" class="member-text">memory_rebuilt = true (記憶庫已更新)</text>
    <text x="12" y="140" class="member-text">dataset_exported = true (已匯出微調)</text>
  </g>

  <!-- Connections -->
  <!-- user_01 to diary_01 -->
  <line x1="285" y1="130" x2="360" y2="130" class="assoc-line" />

  <!-- diary_01 to diag_01 -->
  <line x1="625" y1="130" x2="695" y2="130" class="assoc-line" />

  <!-- user_01 to alert_01 -->
  <line x1="160" y1="210" x2="160" y2="265" class="assoc-line" />
  <text x="180" y="242" class="rel-label">警報</text>

  <!-- diary_01 to image_01 -->
  <line x1="492" y1="225" x2="492" y2="265" class="assoc-line" />
  <text x="525" y="248" class="rel-label">病徵相片</text>

  <!-- diag_01 to fb_01 -->
  <line x1="830" y1="235" x2="830" y2="260" class="assoc-line" />
  <text x="872" y="250" class="rel-label">若診斷有誤</text>

  <!-- Notes (Clean 2-line wrapped text, comfortable padding, zero overflow) -->
  <g transform="translate(35, 445)">
    <rect width="930" height="66" fill="#F8FAF7" stroke="#B5C6B3" stroke-width="1.2" rx="6" />
    <text x="15" y="22" font-family="'Microsoft JhengHei', sans-serif" font-size="11.5" font-weight="bold" fill="#1A281E">分析物件說明：</text>
    <text x="15" y="41" font-family="'Microsoft JhengHei', sans-serif" font-size="10.8" fill="#334035">本圖展現使用者情境下的實例狀態：包含植物日誌、病徵相片、通過 Grad-CAM 空間注意力檢驗之 AI 診斷結果 (diag_01)；</text>
    <text x="15" y="57" font-family="'Microsoft JhengHei', sans-serif" font-size="10.8" fill="#334035">若判斷有誤則提報反饋 (fb_01)，由管理端完成專家真值標註並觸發視覺記憶重建與增量訓練集匯出，完成主動學習閉環實例。</text>
  </g>
</svg>