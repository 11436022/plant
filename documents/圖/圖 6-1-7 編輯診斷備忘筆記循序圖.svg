     class="msg-text"
     text-anchor="start"
     id="text16">3: 驗證 JWT 認證身分並比對 diary_id</text>
  <line
     x1="490.81784"
     y1="245.53903"
     x2="690.81787"
     y2="245.53903"
     class="msg-line"
