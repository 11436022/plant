     id="text17"><tspan
       sodipodi:role="line"
       id="tspan20"
       x="490.91077"
       y="211.91449">4: UPDATE plant_diary</tspan><tspan
       sodipodi:role="line"
       id="tspan21"
       x="490.91077"
       y="225.66449">SET user_note = :note, updated_at = NOW()</tspan><tspan
       sodipodi:role="line"
       x="490.91077"
       y="239.41449"
       id="tspan22">WHERE id = :id</tspan></text>
