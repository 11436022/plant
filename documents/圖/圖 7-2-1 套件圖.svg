<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 700" width="1040" height="700">
  <defs>
    <style>
      .title { font-family: 'Microsoft JhengHei', sans-serif; font-size: 20px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
      .pkg-header-text { font-family: 'Microsoft JhengHei', sans-serif; font-size: 14.5px; font-weight: bold; fill: #0f172a; }
      .subpkg-title { font-family: 'Microsoft JhengHei', sans-serif; font-size: 13.5px; font-weight: bold; fill: #1e293b; }
      .module-text { font-family: 'Microsoft JhengHei', sans-serif; font-size: 12.5px; font-weight: bold; fill: #0f172a; }
      .module-desc { font-family: 'Microsoft JhengHei', sans-serif; font-size: 11.5px; fill: #475569; }
      .dep-label { font-family: 'Microsoft JhengHei', sans-serif; font-size: 11px; fill: #1e3a8a; font-weight: bold; text-anchor: middle; paint-order: stroke fill; stroke: #ffffff; stroke-width: 3.5px; stroke-linejoin: round; }
      .dep-label-start { font-family: 'Microsoft JhengHei', sans-serif; font-size: 11px; fill: #1e3a8a; font-weight: bold; text-anchor: start; paint-order: stroke fill; stroke: #ffffff; stroke-width: 3px; stroke-linejoin: round; }

      .pkg-tab { fill: #e2e8f0; stroke: #94a3b8; stroke-width: 1.3; }
      .pkg-body { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.3; rx: 5; ry: 5; }

      .subpkg-tab { fill: #dbeafe; stroke: #3b82f6; stroke-width: 1.2; }
      .subpkg-body { fill: #ffffff; stroke: #3b82f6; stroke-width: 1.2; rx: 4; ry: 4; }

      .ext-tab { fill: #fef3c7; stroke: #d97706; stroke-width: 1.2; }
      .ext-body { fill: #ffffff; stroke: #d97706; stroke-width: 1.2; rx: 4; ry: 4; }

      .dep-line { stroke: #334155; stroke-width: 1.3; stroke-dasharray: 4,3; fill: none; marker-end: url(#arrow); }
      .http-line { stroke: #2563eb; stroke-width: 1.5; stroke-dasharray: 5,3; fill: none; marker-start: url(#blue-arrow-start); marker-end: url(#blue-arrow-end); }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#334155" />
    </marker>
    <marker id="blue-arrow-end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
    <marker id="blue-arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 10 1.5 L 0 5 L 10 8.5 z" fill="#2563eb" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" />
  <text x="520" y="32" class="title">▲圖 7-2-1 系統軟體架構套件圖 (Package Diagram)</text>

  <!-- ========================================================================= -->
  <!-- 1. PACKAGE 1: ANDROID APP (x=20, y=55, w=240, h=625)                      -->
  <!-- ========================================================================= -->
  <g transform="translate(20, 55)">
    <path d="M 0 0 L 140 0 L 152 22 L 0 22 Z" class="pkg-tab" />
    <text x="12" y="16" class="pkg-header-text">android.app</text>
    <rect y="22" width="240" height="603" class="pkg-body" />
    <text x="12" y="42" class="subpkg-title" fill="#475569">com.example.plantdoctor</text>

    <!-- Subpkg 1: UI Activities -->
    <g transform="translate(10, 52)">
      <path d="M 0 0 L 120 0 L 130 20 L 0 20 Z" class="subpkg-tab" />
      <text x="8" y="14" class="subpkg-title">.ui.activities</text>
      <rect y="20" width="220" height="110" class="subpkg-body" />
      <text x="8" y="38" class="module-text">• MainActivity.kt</text>
      <text x="115" y="38" class="module-desc">(首頁導覽)</text>
      <text x="8" y="58" class="module-text">• DiagnosisActivity.kt</text>
      <text x="135" y="58" class="module-desc">(拍照診斷)</text>
      <text x="8" y="78" class="module-text">• HistoryActivity.kt</text>
      <text x="120" y="78" class="module-desc">(病歷日誌)</text>
      <text x="8" y="98" class="module-text">• AlertActivity.kt</text>
      <text x="110" y="98" class="module-desc">(時序警報)</text>
      <text x="8" y="118" class="module-text">• LoginActivity.kt</text>
      <text x="115" y="118" class="module-desc">(認證登入)</text>
    </g>

    <!-- Subpkg 2: Network -->
    <g transform="translate(10, 192)">
      <path d="M 0 0 L 85 0 L 95 20 L 0 20 Z" class="subpkg-tab" />
      <text x="8" y="14" class="subpkg-title">.network</text>
      <rect y="20" width="220" height="80" class="subpkg-body" />
      <text x="8" y="40" class="module-text">• PlantApiService.kt</text>
      <text x="128" y="40" class="module-desc">(Retrofit2 介面)</text>
      <text x="8" y="60" class="module-text">• AuthInterceptor.kt</text>
      <text x="130" y="60" class="module-desc">(JWT 自動注入)</text>
      <text x="8" y="80" class="module-text">• NetworkClient.kt</text>
      <text x="125" y="80" class="module-desc">(OkHttp3 連線池)</text>
    </g>

    <!-- Subpkg 3: Data Models -->
    <g transform="translate(10, 302)">
      <path d="M 0 0 L 105 0 L 115 20 L 0 20 Z" class="subpkg-tab" />
      <text x="8" y="14" class="subpkg-title">.data.models</text>
      <rect y="20" width="220" height="100" class="subpkg-body" />
      <text x="8" y="40" class="module-text">• PredictionDTO.kt</text>
      <text x="125" y="40" class="module-desc">(診斷結果)</text>
      <text x="8" y="60" class="module-text">• PlantDiaryDTO.kt</text>
      <text x="125" y="60" class="module-desc">(病歷備忘)</text>
      <text x="8" y="80" class="module-text">• FeedbackDTO.kt</text>
      <text x="125" y="80" class="module-desc">(糾錯反饋)</text>
      <text x="8" y="100" class="module-text">• AuthDTO.kt</text>
      <text x="115" y="100" class="module-desc">(帳號憑證)</text>
    </g>

    <!-- Subpkg 4: Utils -->
    <g transform="translate(10, 432)">
      <path d="M 0 0 L 75 0 L 85 20 L 0 20 Z" class="subpkg-tab" />
      <text x="8" y="14" class="subpkg-title">.utils</text>
      <rect y="20" width="220" height="80" class="subpkg-body" />
      <text x="8" y="40" class="module-text">• TokenManager.kt</text>
      <text x="125" y="40" class="module-desc">(憑證加密儲存)</text>
      <text x="8" y="60" class="module-text">• CameraHelper.kt</text>
      <text x="120" y="60" class="module-desc">(CameraX 生命週期)</text>
      <text x="8" y="80" class="module-text">• ImageCompressor.kt</text>
      <text x="145" y="80" class="module-desc">(影像預處理)</text>
    </g>

    <!-- Internal dependencies -->
    <line x1="120" y1="182" x2="120" y2="210" class="dep-line" />
    <text x="126" y="198" class="dep-label-start">&lt;&lt;use&gt;&gt;</text>
    <line x1="120" y1="292" x2="120" y2="320" class="dep-line" />
    <text x="126" y="308" class="dep-label-start">&lt;&lt;use&gt;&gt;</text>
    <line x1="120" y1="422" x2="120" y2="450" class="dep-line" />
    <text x="126" y="438" class="dep-label-start">&lt;&lt;use&gt;&gt;</text>
  </g>

  <!-- ========================================================================= -->
  <!-- 2. PACKAGE 2: PLANT_BACKEND.APP (x=305, y=55, w=470, h=625)               -->
  <!-- ========================================================================= -->
  <g transform="translate(305, 55)">
    <path d="M 0 0 L 165 0 L 178 22 L 0 22 Z" class="pkg-tab" />
    <text x="12" y="16" class="pkg-header-text">plant_backend.app</text>
    <rect y="22" width="470" height="603" class="pkg-body" />
    <text x="12" y="42" class="subpkg-title" fill="#475569">FastAPI 伺服端核心系統 (Python 3.10 / 3.11)</text>

    <!-- Subpkg 0: main.py -->
    <g transform="translate(10, 48)">
      <rect width="450" height="34" class="subpkg-body" />
      <text x="10" y="22" class="module-text">main.py</text>
      <text x="65" y="22" class="module-desc">(ASGI 入口、CORS 安全配置、全域異常與靜態路由)</text>
    </g>

    <!-- Subpkg 1: app.routers -->
    <g transform="translate(10, 98)">
      <path d="M 0 0 L 110 0 L 120 20 L 0 20 Z" class="subpkg-tab" />
      <text x="8" y="14" class="subpkg-title">.routers</text>
      <rect y="20" width="450" height="110" class="subpkg-body" />
      <text x="10" y="38" class="module-text">• prediction.py</text>
      <text x="110" y="38" class="module-desc">(診斷影像上傳、雙模型會診與暫存快取)</text>
      <text x="10" y="56" class="module-text">• admin.py</text>
      <text x="85" y="56" class="module-desc">(儀表板統計、特徵重構、匯出訓練集與模型重訓)</text>
      <text x="10" y="74" class="module-text">• feedback.py</text>
      <text x="105" y="74" class="module-desc">(糾錯反饋提報、專家真值標註與即時刻錄)</text>
      <text x="10" y="92" class="module-text">• diaries.py / webcam.py</text>
      <text x="175" y="92" class="module-desc">(病歷日誌持久化與 Webcam 時序串流警報)</text>
      <text x="10" y="110" class="module-text">• auth.py / knowledge.py</text>
      <text x="180" y="110" class="module-desc">(JWT 帳號認證登入與官方病蟲害資料查詢)</text>
    </g>

    <!-- Subpkg 2: app.services -->
    <g transform="translate(10, 238)">
      <path d="M 0 0 L 95 0 L 105 20 L 0 20 Z" class="subpkg-tab" />
      <text x="8" y="14" class="subpkg-title">.services</text>
      <rect y="20" width="450" height="126" class="subpkg-body" />
      <text x="10" y="38" class="module-text">• ai.py</text>
      <text x="55" y="38" class="module-desc">(Gemini 3.8 Flash 多模態推論、雙模型仲裁與精準處方生成)</text>
      <text x="10" y="58" class="module-text">• convnext.py</text>
      <text x="95" y="58" class="module-desc">(本地自訓 ConvNeXt 快速快篩與 Grad-CAM 空間前景驗證)</text>
      <text x="10" y="78" class="module-text">• visual_memory.py</text>
      <text x="140" y="78" class="module-desc">(768維視覺特徵檢索記憶庫飛輪、即時刻錄與重建)</text>
      <text x="10" y="98" class="module-text">• rag.py</text>
      <text x="65" y="98" class="module-desc">(FAISS 密集向量索引檢索農業部官方審定專書切片)</text>
      <text x="10" y="118" class="module-text">• auth.py / email.py / webcam.py</text>
      <text x="235" y="118" class="module-desc">(帳號安全、郵件通知與時序判定)</text>
    </g>

    <!-- Subpkg 3: app.db -->
    <g transform="translate(10, 394)">
      <path d="M 0 0 L 70 0 L 80 20 L 0 20 Z" class="subpkg-tab" />
      <text x="8" y="14" class="subpkg-title">.db</text>
      <rect y="20" width="450" height="74" class="subpkg-body" />
      <text x="10" y="38" class="module-text">• session.py</text>
      <text x="90" y="38" class="module-desc">(SQLAlchemy 2.0 連線池管理、Pool Pre-Ping 斷線重連)</text>
      <text x="10" y="58" class="module-text">• models.py</text>
      <text x="90" y="58" class="module-desc">(8 大實體模型: User, Crop, Disease, Pest, Diary, Alert 等)</text>
      <text x="10" y="78" class="module-text">• crud.py</text>
      <text x="80" y="78" class="module-desc">(日誌儲存、個人備忘筆記維護與全站聚合統計)</text>
    </g>

    <!-- Subpkg 4: schemas & core -->
    <g transform="translate(10, 498)">
      <path d="M 0 0 L 85 0 L 95 20 L 0 20 Z" class="subpkg-tab" />
      <text x="8" y="14" class="subpkg-title">.schemas</text>
      <rect y="20" width="215" height="85" class="subpkg-body" />
      <text x="8" y="38" class="module-text">• prediction.py / auth.py</text>
      <text x="8" y="56" class="module-desc">(診斷契約與 JWT 憑證)</text>
      <text x="8" y="74" class="module-text">• feedback.py / diaries.py</text>
      <text x="8" y="92" class="module-desc">(真值反饋與日誌筆記)</text>

      <g transform="translate(230, 0)">
        <path d="M 0 0 L 65 0 L 75 20 L 0 20 Z" class="subpkg-tab" />
        <text x="8" y="14" class="subpkg-title">.core</text>
        <rect y="20" width="220" height="85" class="subpkg-body" />
        <text x="8" y="38" class="module-text">• config.py</text>
        <text x="8" y="56" class="module-desc">(BaseSettings 全域環境設定)</text>
        <text x="8" y="74" class="module-text">• security.py / exceptions.py</text>
        <text x="8" y="92" class="module-desc">(密碼安全與全域異常處理)</text>
      </g>
    </g>

    <!-- Backend Internal Dependencies -->
    <line x1="235" y1="82" x2="235" y2="118" class="dep-line" />
    <text x="242" y="102" class="dep-label-start">&lt;&lt;include&gt;&gt;</text>
    <line x1="235" y1="228" x2="235" y2="258" class="dep-line" />
    <text x="242" y="245" class="dep-label-start">&lt;&lt;use&gt;&gt;</text>
    <line x1="235" y1="384" x2="235" y2="414" class="dep-line" />
    <text x="242" y="401" class="dep-label-start">&lt;&lt;use&gt;&gt;</text>
    <line x1="117" y1="488" x2="117" y2="518" class="dep-line" />
    <text x="123" y="505" class="dep-label-start">&lt;&lt;use&gt;&gt;</text>
    <line x1="340" y1="488" x2="340" y2="518" class="dep-line" />
    <text x="346" y="505" class="dep-label-start">&lt;&lt;use&gt;&gt;</text>
  </g>

  <!-- ========================================================================= -->
  <!-- 3. PACKAGE 3: EXTERNAL_LIBS (x=820, y=55, w=200, h=625)                   -->
  <!-- ========================================================================= -->
  <g transform="translate(820, 55)">
    <path d="M 0 0 L 125 0 L 138 22 L 0 22 Z" class="pkg-tab" />
    <text x="12" y="16" class="pkg-header-text">external_libs</text>
    <rect y="22" width="200" height="603" class="pkg-body" />
    <text x="12" y="42" class="subpkg-title" fill="#475569">核心第三方依賴群</text>

    <!-- Subpkg 1: AI & Deep Learning -->
    <g transform="translate(10, 52)">
      <path d="M 0 0 L 140 0 L 150 20 L 0 20 Z" class="ext-tab" />
      <text x="8" y="14" class="subpkg-title">AI &amp; Deep Learning</text>
      <rect y="20" width="180" height="110" class="ext-body" />
      <text x="8" y="40" class="module-text">• google-genai</text>
      <text x="8" y="56" class="module-desc">(Gemini 3.8 Flash SDK)</text>
      <text x="8" y="74" class="module-text">• torch / torchvision</text>
      <text x="8" y="90" class="module-desc">(ConvNeXt 推論與訓練)</text>
      <text x="8" y="108" class="module-text">• faiss-cpu</text>
      <text x="8" y="124" class="module-desc">(密集向量檢索)</text>
    </g>

    <!-- Subpkg 2: Web & DB -->
    <g transform="translate(10, 192)">
      <path d="M 0 0 L 135 0 L 145 20 L 0 20 Z" class="ext-tab" />
      <text x="8" y="14" class="subpkg-title">Web &amp; Persistence</text>
      <rect y="20" width="180" height="100" class="ext-body" />
      <text x="8" y="40" class="module-text">• fastapi / uvicorn</text>
      <text x="8" y="56" class="module-desc">(ASGI 非同步框架)</text>
      <text x="8" y="74" class="module-text">• sqlalchemy 2.0</text>
      <text x="8" y="90" class="module-desc">(ORM 連線池映射)</text>
      <text x="8" y="108" class="module-text">• pydantic v2 / alembic</text>
    </g>

    <!-- Subpkg 3: Security & Utility -->
    <g transform="translate(10, 322)">
      <path d="M 0 0 L 135 0 L 145 20 L 0 20 Z" class="ext-tab" />
      <text x="8" y="14" class="subpkg-title">Security &amp; Utility</text>
      <rect y="20" width="180" height="90" class="ext-body" />
      <text x="8" y="40" class="module-text">• python-jose / passlib</text>
      <text x="8" y="56" class="module-desc">(JWT 簽發與 Bcrypt 雜湊)</text>
      <text x="8" y="74" class="module-text">• pillow (PIL) / jinja2</text>
      <text x="8" y="90" class="module-desc">(影像縮放與後台模板)</text>
    </g>

    <!-- Subpkg 4: Mobile Framework -->
    <g transform="translate(10, 442)">
      <path d="M 0 0 L 130 0 L 140 20 L 0 20 Z" class="ext-tab" />
      <text x="8" y="14" class="subpkg-title">Mobile Framework</text>
      <rect y="20" width="180" height="80" class="ext-body" />
      <text x="8" y="40" class="module-text">• retrofit2 / okhttp3</text>
      <text x="8" y="56" class="module-desc">(REST 通訊與權杖攔截)</text>
      <text x="8" y="74" class="module-text">• camerax / security</text>
      <text x="8" y="90" class="module-desc">(相機生命週期與加密)</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- 4. INTER-PACKAGE CONNECTIONS (CLEAR GUTTERS)                              -->
  <!-- ========================================================================= -->
  <!-- Android -> Backend in gutter (x=260 to x=305) -->
  <line x1="260" y1="320" x2="305" y2="200" class="http-line" />
  <text x="282" y="255" class="dep-label" transform="rotate(-70, 282, 255)">&lt;&lt;HTTPS / JSON&gt;&gt;</text>

  <!-- Backend -> External in gutter (x=775 to x=820) -->
  <line x1="775" y1="320" x2="820" y2="180" class="dep-line" />
  <text x="797" y="245" class="dep-label" transform="rotate(-72, 797, 245)">&lt;&lt;import&gt;&gt;</text>

  <line x1="775" y1="450" x2="820" y2="300" class="dep-line" />
  <text x="797" y="370" class="dep-label" transform="rotate(-72, 797, 370)">&lt;&lt;import&gt;&gt;</text>

  <line x1="775" y1="560" x2="820" y2="420" class="dep-line" />
