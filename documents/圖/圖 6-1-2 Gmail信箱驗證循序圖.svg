     id="text20"><tspan
       sodipodi:role="line"
       id="tspan33"
       x="546.0"
       y="187.5">4: SELECT id, is_verified, token_expiry</tspan><tspan
       sodipodi:role="line"
       id="tspan34"
       x="546.0"
       y="199.5">FROM users</tspan><tspan
       sodipodi:role="line"
       id="tspan35"
       x="546.0"
       y="211.5">WHERE verification_token = :token</tspan></text>
