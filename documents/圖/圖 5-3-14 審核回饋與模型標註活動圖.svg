<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 920" width="740" height="920">
  <defs>
    <style>
      .title { font-family: 'Microsoft JhengHei', 'PingFang TC', sans-serif; font-size: 16px; font-weight: bold; fill: #0f172a; }
      .lane-title { font-family: 'Microsoft JhengHei', 'PingFang TC', sans-serif; font-size: 14px; font-weight: bold; fill: #1e293b; text-anchor: middle; }
      .text-bold { font-family: 'Microsoft JhengHei', 'PingFang TC', sans-serif; font-size: 12px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
      .text-sub { font-family: 'Microsoft JhengHei', 'PingFang TC', sans-serif; font-size: 10px; fill: #475569; text-anchor: middle; }
      .lane-bg { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.2; }
      .lane-header { fill: #e2e8f0; stroke: #94a3b8; stroke-width: 1.2; }
      .action-usr { fill: #ffffff; stroke: #2563eb; stroke-width: 1.5; rx: 8; ry: 8; }
      .action-sys { fill: #ffffff; stroke: #16a34a; stroke-width: 1.5; rx: 8; ry: 8; }
      .action-loop { fill: #f0fdf4; stroke: #15803d; stroke-width: 1.8; rx: 8; ry: 8; }
      .flow-line { stroke: #334155; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />
  <text x="370" y="30" class="title" text-anchor="middle">▲ 圖 5-3-14 審核回饋與主動學習標註微調活動圖</text>

  <!-- Swimlane 1: 系統管理員 -->
  <rect x="45" y="50" width="325" height="850" class="lane-bg" />
  <rect x="45" y="50" width="325" height="40" class="lane-header" />
  <text x="207.5" y="75" class="lane-title">系統管理員 (Admin)</text>

  <!-- Swimlane 2: 管理後台與主動學習管線 -->
  <rect x="370" y="50" width="325" height="850" class="lane-bg" />
  <rect x="370" y="50" width="325" height="40" class="lane-header" />
  <text x="532.5" y="75" class="lane-title">管理後台與主動學習管線</text>

  <!-- Start Node -->
  <circle cx="207.5" cy="115" r="12" fill="#0f172a" />
  <path d="M 207.5 127 L 207.5 145" class="flow-line" />

  <!-- Admin: 點選使用者回饋分頁 -->
  <rect x="112.5" y="145" width="190" height="44" class="action-usr" />
  <text x="207.5" y="164" class="text-bold">點選「使用者回饋」分頁</text>
  <text x="207.5" y="179" class="text-sub">進入待審核紀錄工作台</text>

  <path d="M 302.5 167 L 437.5 167" class="flow-line" />

  <!-- Sys: 查詢待審核回饋 -->
  <rect x="437.5" y="145" width="190" height="44" class="action-sys" />
  <text x="532.5" y="164" class="text-bold">查詢待審核回饋清單</text>
  <text x="532.5" y="179" class="text-sub">SELECT diagnosis_feedback</text>

  <path d="M 437.5 189 L 302.5 227" class="flow-line" />

  <!-- Admin: 檢視疑義病徵特寫 -->
  <rect x="112.5" y="215" width="190" height="44" class="action-usr" />
  <text x="207.5" y="234" class="text-bold">檢視疑義病徵與原 AI 結果</text>
  <text x="207.5" y="249" class="text-sub">對照回報真值與葉片特寫照片</text>

  <path d="M 207.5 259 L 207.5 285" class="flow-line" />

  <!-- Admin: 輸入專家校準作物與病名 -->
  <rect x="112.5" y="285" width="190" height="44" class="action-usr" />
  <text x="207.5" y="304" class="text-bold">輸入專家校準作物與病名</text>
  <text x="207.5" y="319" class="text-sub">填寫專家真值 (Ground Truth)</text>

  <path d="M 207.5 329 L 207.5 355" class="flow-line" />

  <!-- Admin: 點選儲存專家標註按鈕 -->
  <rect x="112.5" y="355" width="190" height="44" class="action-usr" />
  <text x="207.5" y="374" class="text-bold">點選「儲存專家標註」</text>
  <text x="207.5" y="389" class="text-sub">POST /feedback/annotate/{id}</text>

  <path d="M 302.5 377 L 437.5 377" class="flow-line" />

  <!-- Sys: 儲存專家標註真值至資料庫 -->
  <rect x="437.5" y="355" width="190" height="44" class="action-sys" />
  <text x="532.5" y="374" class="text-bold">儲存專家標註至資料庫</text>
  <text x="532.5" y="389" class="text-sub">寫入修正植物與病害真值名稱</text>

  <path d="M 437.5 399 L 302.5 442" class="flow-line" />

  <!-- Admin: 點選一鍵重建視覺記憶庫 -->
  <rect x="112.5" y="430" width="190" height="44" class="action-loop" />
  <text x="207.5" y="449" class="text-bold">點選「重建視覺記憶庫」</text>
  <text x="207.5" y="464" class="text-sub">POST /feedback/rebuild-memory</text>

  <path d="M 302.5 452 L 437.5 452" class="flow-line" />

  <!-- Sys: 提取特徵向量重建 Visual Memory -->
  <rect x="437.5" y="430" width="190" height="44" class="action-sys" />
  <text x="532.5" y="449" class="text-bold">提取真值特徵向量並重建索引</text>
  <text x="532.5" y="464" class="text-sub">即時更新 Visual Memory FAISS 庫</text>

  <path d="M 437.5 474 L 302.5 517" class="flow-line" />

  <!-- Admin: 點選一鍵匯出增量訓練集 -->
  <rect x="112.5" y="505" width="190" height="44" class="action-loop" />
  <text x="207.5" y="524" class="text-bold">點選「匯出增量訓練集」</text>
  <text x="207.5" y="539" class="text-sub">POST /feedback/export-dataset</text>

  <path d="M 302.5 527 L 437.5 527" class="flow-line" />

  <!-- Sys: 依類別打包 PyTorch ImageFolder -->
  <rect x="437.5" y="505" width="190" height="44" class="action-sys" />
  <text x="532.5" y="524" class="text-bold">依類別分類打包訓練集</text>
  <text x="532.5" y="539" class="text-sub">自動生成 PyTorch ImageFolder 結構</text>

  <path d="M 437.5 549 L 302.5 592" class="flow-line" />

  <!-- Admin: 點選一鍵觸發本機增量微調 -->
  <rect x="112.5" y="580" width="190" height="44" class="action-loop" />
  <text x="207.5" y="599" class="text-bold">點選「開始模型增量微調」</text>
  <text x="207.5" y="614" class="text-sub">POST /feedback/retrain</text>

  <path d="M 302.5 602 L 437.5 602" class="flow-line" />

  <!-- Sys: 背景線程微調 ConvNeXt 模型 -->
  <rect x="437.5" y="580" width="190" height="44" class="action-sys" />
  <text x="532.5" y="599" class="text-bold">背景非同步執行模型增量微調</text>
  <text x="532.5" y="614" class="text-sub">重訓 ConvNeXt 頂層並評估驗證集</text>

  <path d="M 532.5 624 L 532.5 655" class="flow-line" />

  <!-- Sys: 更新權重檔與日誌 -->
  <rect x="437.5" y="655" width="190" height="44" class="action-sys" />
  <text x="532.5" y="674" class="text-bold">自動更新模型權重檔與日誌</text>
  <text x="532.5" y="689" class="text-sub">更新 best_model.pth，無縫上線</text>

  <path d="M 437.5 677 L 302.5 732" class="flow-line" />

  <!-- Admin: 檢視後台自進化閉環狀態 -->
  <rect x="112.5" y="720" width="190" height="44" class="action-usr" />
  <text x="207.5" y="739" class="text-bold">檢視後台主動學習閉環狀態</text>
  <text x="207.5" y="754" class="text-sub">呈現「真值已存/記憶已更/微調完成」</text>

  <path d="M 207.5 764 L 207.5 820" class="flow-line" />

  <!-- End Node -->
  <circle cx="207.5" cy="828" r="8" fill="#0f172a" />
  <circle cx="207.5" cy="828" r="14" fill="none" stroke="#0f172a" stroke-width="2" />
</svg>