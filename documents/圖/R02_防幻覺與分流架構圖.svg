    <style
       id="style1">
      .bg { fill: #FFFFFF; }
      .slide-title { font-family: 'Microsoft JhengHei', sans-serif; font-size: 30px; font-weight: 800; fill: #111827; text-anchor: middle; }
      .stage-badge { font-family: 'Microsoft JhengHei', sans-serif; font-size: 13px; font-weight: bold; fill: #3F6212; text-anchor: middle; }
      
      .box-green { fill: #9BBA68; stroke: #6E8B3D; stroke-width: 2; rx: 14; ry: 14; filter: drop-shadow(0 3px 6px rgba(0,0,0,0.08)); }
