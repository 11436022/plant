      .warn-sub { font-family: 'Microsoft JhengHei', sans-serif; font-size: 12.5px; fill: #78350F; text-anchor: middle; }

      .arrow-main { stroke: #374151; stroke-width: 2.4; fill: none; marker-end: url(#arrow-dark); }
      .arrow-pass { stroke: #3F6212; stroke-width: 2.4; fill: none; marker-end: url(#arrow-green); }
      .arrow-fallback { stroke: #B45309; stroke-width: 2.2; stroke-dasharray: 7,4; fill: none; marker-end: url(#arrow-amber); }
      .arrow-reject { stroke: #DC2626; stroke-width: 2.2; stroke-dasharray: 6,4; fill: none; marker-end: url(#arrow-red); }

