     id="line15" />
  <text
     x="285.0"
     y="145"
     class="msg-text"
     text-anchor="start"
     id="text15">2: POST /api/v1/auth/login (username, password)</text>
  <line
     x1="490.0"
     y1="180"
     x2="690.0"
     y2="180"
     class="msg-line"
