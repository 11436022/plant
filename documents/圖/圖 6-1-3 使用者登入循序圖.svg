     text-anchor="start"
     id="text16"><tspan
       sodipodi:role="line"
       id="tspan27"
       x="493.21561"
       y="162.50929">3: SELECT id, password_hash, is_verified</tspan><tspan
       sodipodi:role="line"
       id="tspan28"
       x="493.21561"
       y="176.25929">FROM users WHERE username = :name</tspan></text>
