  <text
     x="955"
     y="355"
     class="text"
     id="text31">步驟 1: 邊緣 ConvNeXt 卷積特徵快篩</text>
  <text
     x="955"
     y="378"
     class="text"
     id="text32">步驟 2: Grad-CAM 空間前景對齊檢驗 (≥35%)</text>
  <text
     x="955"
     y="401"
     class="text"
     id="text33">步驟 3: Visual Memory 記憶檢索與 Prompt 注入</text>
