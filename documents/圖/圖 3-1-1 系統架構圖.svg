  <text
     x="785"
     y="683"
     class="text"
     id="text39">• 專家真值標註持久化 (manager_corrected_plant / disease 寫入 MySQL)</text>
  <text
     x="785"
     y="708"
     class="text"
     id="text40">• Visual Memory 向量快取即時更新 (visual_memory_index.pt)</text>
  <text
     x="785"
     y="733"
     class="text"
     id="text41">• 一鍵匯出標準訓練集 ➔ 本機調用 retrain_from_feedback.py 執行 3-Epoch 增量微調熱更新</text>
