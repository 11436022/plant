  <text
     x="785"
     y="508"
     class="text"
     id="text35">步驟 4: Google Gemini 3.8 Flash 雲端多模態會診 ➔ 軟標籤覆核推翻機制 (Cross-Modal Overrule)</text>
  <text
     x="785"
     y="533"
     class="text"
     id="text36">步驟 5: 雙軌處方驗證：優先查詢 MySQL 專家庫 ➔ 缺漏時強檢 FAISS 農業部專書生成 (附 SHA-256)</text>
  <text
     x="785"
     y="558"
     class="text"
     id="text37">安全防禦剎車：綜合信心度  65% 或 OOD 異物 ➔ 強制安全拒答標記「無法判定」</text>
