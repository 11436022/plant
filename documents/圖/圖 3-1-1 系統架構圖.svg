<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .title { font: 700 42px 'Microsoft JhengHei', 'PingFang TC', sans-serif; fill: #1A281E; }
      .subtitle { font: 400 18px 'Microsoft JhengHei', 'PingFang TC', sans-serif; fill: #2D3748; }
      .lane { font: 700 20px 'Microsoft JhengHei', 'PingFang TC', sans-serif; fill: #4F7057; }
      .lane-sub { font: 400 13px 'Microsoft JhengHei', 'PingFang TC', sans-serif; fill: #2D3748; }
      .head { font: 700 17px 'Microsoft JhengHei', 'PingFang TC', sans-serif; fill: #1A281E; }
      .text { font: 400 13.5px 'Microsoft JhengHei', 'PingFang TC', sans-serif; fill: #1A281E; }
      .small { font: 400 11.5px 'Microsoft JhengHei', 'PingFang TC', sans-serif; fill: #2D3748; }
      .lane-box { fill: #F8FAF7; stroke: #B5C6B3; stroke-width: 2; }
      .client { fill: #DDEAD7; stroke: #B5C6B3; stroke-width: 2; }
      .service { fill: #ffffff; stroke: #B5C6B3; stroke-width: 2; }
      .safety { fill: #DDEAD7; stroke: #4F7057; stroke-width: 2; }
      .external { fill: #E5EDE3; stroke: #4F7057; stroke-width: 2; }
      .ai-box { fill: #E5EDE3; stroke: #4F7057; stroke-width: 2; }
      .line { stroke: #B5C6B3; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .return { stroke: #B5C6B3; stroke-width: 1.6; stroke-dasharray: 5 4; fill: none; marker-end: url(#arrow2); }
      .flow-label {
        font: 700 12px 'Microsoft JhengHei', 'PingFang TC', sans-serif;
        fill: #4F7057;
        paint-order: stroke fill;
        stroke: #ffffff;
        stroke-width: 4px;
        stroke-linejoin: round;
      }
      .halo-text {
        font: 400 12.5px 'Microsoft JhengHei', 'PingFang TC', sans-serif;
        fill: #2D3748;
        paint-order: stroke fill;
        stroke: #ffffff;
        stroke-width: 4px;
        stroke-linejoin: round;
      }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#B5C6B3"/>
    </marker>
    <marker id="arrow2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#B5C6B3"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="60" y="56" class="title">現行系統架構圖 (System Architecture)</text>
  <text x="60" y="86" class="subtitle">前端介面、FastAPI 核心服務、本地快篩與 Gemini 兜底階層架構、RAG 知識檢索與資料持久層</text>

  <!-- Swimlanes -->
  <rect x="50" y="115" width="380" height="712" rx="8" class="lane-box"/>
  <rect x="470" y="115" width="650" height="712" rx="8" class="lane-box"/>
  <rect x="1160" y="115" width="390" height="712" rx="8" class="lane-box"/>
  <text x="240" y="145" text-anchor="middle" class="lane">使用介面</text>
  <text x="240" y="167" text-anchor="middle" class="lane-sub">(Presentation Layer)</text>
  <text x="795" y="145" text-anchor="middle" class="lane">FastAPI 後端核心服務</text>
  <text x="795" y="167" text-anchor="middle" class="lane-sub">(Application Layer)</text>
  <text x="1355" y="145" text-anchor="middle" class="lane">資料層與外部服務</text>
  <text x="1355" y="167" text-anchor="middle" class="lane-sub">(Data &amp; External Services)</text>

  <!-- ================= LANE 1: Presentation Layer ================= -->
  <!-- 1. Android App -->
  <rect x="86" y="185" width="308" height="145" rx="8" class="client"/>
  <text x="240" y="218" text-anchor="middle" class="head">Android 行動端 App</text>
  <text x="240" y="250" text-anchor="middle" class="text">拍照診斷與病害處方查閱</text>
  <text x="240" y="276" text-anchor="middle" class="text">個人備忘筆記與糾錯反饋</text>
  <text x="240" y="304" text-anchor="middle" class="small">Kotlin / Retrofit2 / CameraX</text>

  <!-- 2. Webcam Interface -->
  <rect x="86" y="365" width="308" height="145" rx="8" class="client"/>
  <text x="240" y="398" text-anchor="middle" class="head">Webcam 即時監控介面</text>
  <text x="240" y="430" text-anchor="middle" class="text">連續影像串流與定時取樣</text>
  <text x="240" y="456" text-anchor="middle" class="text">即時病害警報響應與鈴聲提示</text>
  <text x="240" y="484" text-anchor="middle" class="small">CameraX / OpenCV 串流</text>

  <!-- 3. Web Admin Console -->
  <rect x="86" y="545" width="308" height="145" rx="8" class="client"/>
  <text x="240" y="578" text-anchor="middle" class="head">Web 管理者後台</text>
  <text x="240" y="610" text-anchor="middle" class="text">統計儀表板與全站病歷維護</text>
  <text x="240" y="636" text-anchor="middle" class="text">使用者糾錯審核與資料標註</text>
  <text x="240" y="664" text-anchor="middle" class="small">FastAPI / Jinja2 / Bootstrap</text>

  <!-- ================= LANE 2: Application Layer (FastAPI) ================= -->
  <!-- 1. API Gateway / Routing & Security Layer -->
  <rect x="510" y="185" width="570" height="80" rx="8" class="service"/>
  <text x="795" y="217" text-anchor="middle" class="head">API 路由與安全層</text>
  <text x="795" y="245" text-anchor="middle" class="text">OAuth2 / JWT 驗證與各模組端點請求分派</text>

  <!-- 2A. Webcam Edge Monitoring Service (Left) -->
  <rect x="510" y="295" width="270" height="150" rx="8" class="service"/>
  <text x="645" y="328" text-anchor="middle" class="head">Webcam 邊緣監控服務</text>
  <text x="645" y="360" text-anchor="middle" class="text">連續 3 影格共識判定</text>
  <text x="645" y="386" text-anchor="middle" class="text">過濾晃動、快取異常狀態</text>
  <text x="645" y="416" text-anchor="middle" class="small">時序平滑濾波 (防單幀誤報)</text>

  <!-- 2B. Cascade Diagnosis Dispatch Service (Right) -->
  <rect x="810" y="295" width="270" height="150" rx="8" class="service"/>
  <text x="945" y="328" text-anchor="middle" class="head">階層式診斷調度服務</text>
  <text x="945" y="360" text-anchor="middle" class="text">步驟 1: 優先本地快篩</text>
  <text x="945" y="386" text-anchor="middle" class="text">步驟 2: 未命中 Gemini 兜底</text>
  <text x="945" y="416" text-anchor="middle" class="small">瀑布流推論 (Cascade Pipeline)</text>

  <!-- 3. Decision Integration & RAG Core -->
  <rect x="510" y="480" width="570" height="130" rx="8" class="safety"/>
  <text x="795" y="512" text-anchor="middle" class="head">決策整合與 RAG 校驗核心</text>
  <text x="795" y="542" text-anchor="middle" class="text">步驟 3: FAISS 向量檢索比對農業部官方資料庫</text>
  <text x="795" y="568" text-anchor="middle" class="text">動態精準處方生成；信心度門檻評估 (≥ 70%)</text>
  <text x="795" y="594" text-anchor="middle" class="small">未達門檻判定為「無法判定」(安全防禦煞車)</text>

  <!-- 4. Diary, Feedback & Training Data Operations -->
  <rect x="510" y="645" width="570" height="105" rx="8" class="service"/>
  <text x="795" y="675" text-anchor="middle" class="head">日誌與回饋數據管理服務</text>
  <text x="795" y="705" text-anchor="middle" class="text">診斷病歷存檔、檢索與個人備忘筆記維護</text>
  <text x="795" y="730" text-anchor="middle" class="small">使用者糾錯接收與模型複訓資料集匯出</text>

  <!-- ================= LANE 3: Data & External Services ================= -->
  <!-- 1. MySQL Relational DB -->
  <rect x="1196" y="185" width="318" height="100" rx="8" class="external"/>
  <text x="1355" y="215" text-anchor="middle" class="head">MySQL 關聯式資料庫</text>
  <text x="1355" y="244" text-anchor="middle" class="text">帳號、診斷病歷與警報紀錄</text>
  <text x="1355" y="268" text-anchor="middle" class="small">SQLAlchemy ORM / 糾錯反饋資料表</text>

  <!-- 2. Local ConvNeXt Fast Screen (Step 1) -->
  <rect x="1196" y="315" width="318" height="105" rx="8" class="ai-box"/>
  <text x="1355" y="345" text-anchor="middle" class="head">本地自訓 ConvNeXt 模型</text>
  <text x="1355" y="375" text-anchor="middle" class="text">步驟 1: 特定作物病斑分類快篩</text>
  <text x="1355" y="400" text-anchor="middle" class="small">零雲端成本 / ≥ 75% 優先命中</text>

  <!-- 3. Gemini Multimodal Fallback (Step 2) -->
  <rect x="1196" y="435" width="318" height="105" rx="8" class="ai-box"/>
  <text x="1355" y="465" text-anchor="middle" class="head">Gemini 2.5 Flash 雲端模型</text>
  <text x="1355" y="495" text-anchor="middle" class="text">步驟 2: 多模態影像初判與兜底</text>
  <text x="1355" y="520" text-anchor="middle" class="small">廣域特徵分析 (未命中或低信心時啟動)</text>

  <!-- 4. Agricultural Knowledge Base & FAISS (Step 3) -->
  <rect x="1196" y="555" width="318" height="100" rx="8" class="external"/>
  <text x="1355" y="585" text-anchor="middle" class="head">官方知識庫與 FAISS</text>
  <text x="1355" y="615" text-anchor="middle" class="text">步驟 3: 農業部病害知識檢索</text>
  <text x="1355" y="638" text-anchor="middle" class="small">標準防治處方對齊 (防範 AI 幻覺)</text>

  <!-- 5. External Services: SMTP, Weather & Active Learning -->
  <rect x="1196" y="670" width="318" height="95" rx="8" class="external"/>
  <text x="1355" y="700" text-anchor="middle" class="head">外部支援服務 (SMTP / CWA)</text>
  <text x="1355" y="728" text-anchor="middle" class="text">Gmail SMTP 驗證與警報推播</text>
  <text x="1355" y="748" text-anchor="middle" class="small">CWA 氣象署即時溫濕度建議</text>

  <!-- ================= Connecting Flows & Arrows ================= -->
  <!-- 1. Lane 1 -> Lane 2 -->
  <path d="M394 225 H510" class="line"/>
  <path d="M394 410 H510" class="line"/>
  <path d="M394 595 H510" class="line"/>
  <text x="452" y="216" text-anchor="middle" class="halo-text">HTTPS / JSON</text>
  <text x="452" y="401" text-anchor="middle" class="halo-text">Frame Stream</text>
  <text x="452" y="586" text-anchor="middle" class="halo-text">REST / Admin</text>

  <!-- 2. Inside Lane 2 -->
  <path d="M645 265 V295" class="line"/>
  <path d="M945 265 V295" class="line"/>
  <path d="M645 445 V480" class="line"/>
  <path d="M945 445 V480" class="line"/>
  <path d="M795 610 V645" class="line"/>

  <!-- 3. Lane 2 <-> Lane 3 Connections -->
  <!-- Flow 1: API Layer <-> MySQL (y=215 & y=245) -->
  <path d="M1080 215 H1196" class="line"/>
  <path d="M1196 245 H1080" class="return"/>
  <text x="1138" y="204" text-anchor="middle" class="flow-label">查詢／驗證</text>

  <!-- Flow 2: 診斷調度 -> 本地 ConvNeXt (y=348 & y=380) -->
  <path d="M1080 348 H1196" class="line"/>
  <path d="M1196 380 H1080" class="return"/>
  <text x="1138" y="336" text-anchor="middle" class="flow-label">步驟 1: 本地快篩</text>
  <text x="1138" y="398" text-anchor="middle" class="flow-label">回傳病斑特徵</text>

  <!-- Flow 3: 診斷調度 -> Gemini 兜底 (y=468 & y=500) -->
  <path d="M1080 468 H1196" class="line"/>
  <path d="M1196 500 H1080" class="return"/>
  <text x="1138" y="456" text-anchor="middle" class="flow-label">步驟 2: 雲端兜底</text>
  <text x="1138" y="518" text-anchor="middle" class="flow-label">回傳多模態初判</text>

  <!-- Flow 4: 決策整合核心 <-> FAISS RAG (y=580 & y=612) -->
  <path d="M1080 580 H1196" class="line"/>
  <path d="M1196 612 H1080" class="return"/>
  <text x="1138" y="568" text-anchor="middle" class="flow-label">步驟 3: RAG 檢索</text>
  <text x="1138" y="630" text-anchor="middle" class="flow-label">回傳官方處方</text>

  <!-- Flow 5: 決策整合核心 -> SMTP 外部郵件 (x=1168 track) -->
  <path d="M1080 600 H1168 V700 H1196" class="line"/>
  <text x="1168" y="692" text-anchor="middle" class="flow-label">觸發警報</text>

  <!-- Flow 6: 日誌管理服務 -> MySQL (x=1148 track up to MySQL) -->
  <path d="M1080 675 H1148 V270 H1196" class="line"/>
  <text x="1148" y="262" text-anchor="middle" class="flow-label">寫入紀錄</text>

  <!-- Flow 7: CWA 氣象開放資料 -> 服務層 (y=735) -->
  <path d="M1196 735 H1080" class="return"/>
  <text x="1138" y="726" text-anchor="middle" class="flow-label">氣象回傳</text>

  <!-- ================= Bottom System Annotation ================= -->
  <rect x="50" y="836" width="1500" height="42" rx="6" fill="#DDEAD7" stroke="#B5C6B3"/>
  <text x="800" y="862" text-anchor="middle" class="small">診斷架構採三層階層式設計：本地自訓 ConvNeXt 優先快篩（零雲端成本），未命中由 Gemini 雲端多模態兜底，並經 FAISS 官方知識庫校驗生成精準處方；反饋數據留存供模型增量複訓。</text>
</svg>