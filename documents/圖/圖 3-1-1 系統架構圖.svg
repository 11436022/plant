     style="font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-size:16px;line-height:normal;font-family:'Microsoft JhengHei', sans-serif;stroke-width:1.17183">Android 行動端 App (Kotlin)</text>
  <text
     x="220"
     y="242"
     class="text"
     id="text11">• CameraX 對焦拍攝與相簿多圖上傳</text>
  <text
     x="220"
     y="265"
     class="text"
     id="text12">• 拍照防手抖品質檢驗 (Laplacian  5.0)</text>
  <text
     x="220"
     y="288"
     class="text"
     id="text13">• 未儲存防呆返回對話框 (In-Layout Overlay)</text>
  <text
     x="220"
     y="311"
     class="text"
     id="text14">• 個人日誌備忘錄與嵌入式糾錯提報</text>
