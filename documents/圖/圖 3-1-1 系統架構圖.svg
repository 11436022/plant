     class="title"
     id="text3">圖 3-1-1 系統架構圖 (System Architecture)</text>
  <text
     x="60"
     y="78"
     class="subtitle"
     id="text4">前端展示層 ➔ FastAPI 後端微服務 ➔ 五重空間注意力與記憶增強瀑布流 ➔ 雙軌 RAG 處方 ➔ 主動學習本機微調閉環</text>
