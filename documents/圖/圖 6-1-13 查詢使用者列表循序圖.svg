     y="379.08301"
     class="msg-text"
     text-anchor="start"
     id="text22"><tspan
       sodipodi:role="line"
       id="tspan32"
       x="462.90582"
       y="379.08301">9: SELECT * FROM users WHERE username LIKE '%ntub%'</tspan><tspan
       sodipodi:role="line"
       id="tspan33"
       x="462.90582"
       y="392.83301">OR email LIKE '%ntub%'</tspan></text>
