<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .title { font: 700 42px "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif; fill: #26352d; }
      .subtitle { font: 400 19px "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif; fill: #59665f; }
      .head { font: 700 21px "Segoe UI", "Microsoft JhengHei", sans-serif; fill: #ffffff; }
      .field { font: 400 15px "Segoe UI", "Microsoft JhengHei", sans-serif; fill: #334239; }
      .key { font: 700 14px "Segoe UI", Arial, sans-serif; fill: #98651c; }
      .label { font: 700 14px "Segoe UI", Arial, sans-serif; fill: #53665a; }
      .table { fill: #ffffff; stroke: #6f9075; stroke-width: 2; }
      .header { fill: #47765a; }
      .line { stroke: #6b7e70; stroke-width: 2.2; fill: none; }
      .optional { stroke: #87998c; stroke-width: 1.8; stroke-dasharray: 7 5; fill: none; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#f8faf8"/>
  <text x="52" y="55" class="title">資料庫實體關聯圖</text>
  <text x="52" y="86" class="subtitle">依現行 SQLAlchemy models：實線為主要外鍵關聯，虛線為診斷結果的可選病害／蟲害關聯</text>

  <!-- user -->
  <g>
    <rect x="50" y="150" width="300" height="250" rx="8" class="table"/>
    <rect x="50" y="150" width="300" height="48" rx="8" class="header"/>
    <rect x="50" y="190" width="300" height="8" fill="#47765a"/>
    <text x="200" y="181" text-anchor="middle" class="head">user</text>
    <text x="70" y="226" class="key">PK</text><text x="110" y="226" class="field">user_id</text>
    <text x="70" y="254" class="field">username · email</text>
    <text x="70" y="282" class="field">password_hash · full_name</text>
    <text x="70" y="310" class="field">role · is_email_verified</text>
    <text x="70" y="338" class="field">email_verified_at</text>
    <text x="70" y="366" class="field">created_at</text>
  </g>

  <!-- tokens -->
  <g>
    <rect x="50" y="525" width="300" height="245" rx="8" class="table"/>
    <rect x="50" y="525" width="300" height="48" rx="8" class="header"/>
    <rect x="50" y="565" width="300" height="8" fill="#47765a"/>
    <text x="200" y="556" text-anchor="middle" class="head">user_one_time_tokens</text>
    <text x="70" y="601" class="key">PK</text><text x="110" y="601" class="field">id</text>
    <text x="70" y="629" class="key">FK</text><text x="110" y="629" class="field">user_id</text>
    <text x="70" y="657" class="field">purpose · token_hash</text>
    <text x="70" y="685" class="field">expires_at · used_at</text>
    <text x="70" y="713" class="field">created_at</text>
  </g>

  <!-- webcam alert -->
  <g>
    <rect x="470" y="130" width="380" height="285" rx="8" class="table"/>
    <rect x="470" y="130" width="380" height="48" rx="8" class="header"/>
    <rect x="470" y="170" width="380" height="8" fill="#47765a"/>
    <text x="660" y="161" text-anchor="middle" class="head">webcam_alert</text>
    <text x="490" y="206" class="key">PK</text><text x="530" y="206" class="field">id</text>
    <text x="490" y="234" class="key">FK</text><text x="530" y="234" class="field">user_id · crop_id</text>
    <text x="490" y="262" class="field">category · status_name</text>
    <text x="490" y="290" class="field">confidence · consecutive_matches</text>
    <text x="490" y="318" class="field">image_url · email_sent</text>
    <text x="490" y="346" class="field">acknowledged_at · created_at</text>
  </g>

  <!-- plant diary -->
  <g>
    <rect x="470" y="505" width="380" height="330" rx="8" class="table"/>
    <rect x="470" y="505" width="380" height="48" rx="8" class="header"/>
    <rect x="470" y="545" width="380" height="8" fill="#47765a"/>
    <text x="660" y="536" text-anchor="middle" class="head">plant_diary</text>
    <text x="490" y="581" class="key">PK</text><text x="530" y="581" class="field">id</text>
    <text x="490" y="609" class="key">FK</text><text x="530" y="609" class="field">user_id · crop_id</text>
    <text x="490" y="637" class="key">FK?</text><text x="530" y="637" class="field">disease_id · pest_id</text>
    <text x="490" y="665" class="field">status_name · confidence</text>
    <text x="490" y="693" class="field">image_url · suggestion · treatment</text>
    <text x="490" y="721" class="field">user_note · user_corrected_status</text>
    <text x="490" y="749" class="field">created_at</text>
  </g>

  <!-- crop -->
  <g>
    <rect x="1010" y="120" width="250" height="190" rx="8" class="table"/>
    <rect x="1010" y="120" width="250" height="48" rx="8" class="header"/>
    <rect x="1010" y="160" width="250" height="8" fill="#47765a"/>
    <text x="1135" y="151" text-anchor="middle" class="head">crop</text>
    <text x="1030" y="196" class="key">PK</text><text x="1070" y="196" class="field">crop_id</text>
    <text x="1030" y="224" class="field">crop_name</text>
    <text x="1030" y="252" class="field">crop_name_en</text>
  </g>

  <!-- disease -->
  <g>
    <rect x="1320" y="120" width="230" height="290" rx="8" class="table"/>
    <rect x="1320" y="120" width="230" height="48" rx="8" class="header"/>
    <rect x="1320" y="160" width="230" height="8" fill="#47765a"/>
    <text x="1435" y="151" text-anchor="middle" class="head">disease</text>
    <text x="1340" y="196" class="key">PK</text><text x="1380" y="196" class="field">disease_id</text>
    <text x="1340" y="224" class="key">FK</text><text x="1380" y="224" class="field">crop_id</text>
    <text x="1340" y="252" class="field">disease_name</text>
    <text x="1340" y="280" class="field">description · treatment</text>
    <text x="1340" y="308" class="field">source_name</text>
    <text x="1340" y="336" class="field">source_url</text>
    <text x="1340" y="364" class="field">source_record_id</text>
  </g>

  <!-- pests -->
  <g>
    <rect x="1320" y="505" width="230" height="290" rx="8" class="table"/>
    <rect x="1320" y="505" width="230" height="48" rx="8" class="header"/>
    <rect x="1320" y="545" width="230" height="8" fill="#47765a"/>
    <text x="1435" y="536" text-anchor="middle" class="head">pests</text>
    <text x="1340" y="581" class="key">PK</text><text x="1380" y="581" class="field">pest_id</text>
    <text x="1340" y="609" class="key">FK</text><text x="1380" y="609" class="field">crop_id</text>
    <text x="1340" y="637" class="field">pest_name</text>
    <text x="1340" y="665" class="field">description · treatment</text>
    <text x="1340" y="693" class="field">source_name</text>
    <text x="1340" y="721" class="field">source_url</text>
    <text x="1340" y="749" class="field">source_record_id</text>
  </g>

  <!-- Relations -->
  <path d="M200 400 V525" class="line"/>
  <text x="212" y="470" class="label">1 : N</text>
  <path d="M350 265 H470" class="line"/>
  <text x="398" y="250" class="label">1 : N</text>
  <path d="M350 310 H410 V610 H470" class="line"/>
  <text x="420" y="590" class="label">1 : N</text>

  <path d="M1010 210 H920 V234 H850" class="line"/>
  <text x="918" y="198" class="label">1 : N</text>
  <path d="M1010 250 H900 V609 H850" class="line"/>
  <text x="912" y="595" class="label">1 : N</text>
  <path d="M1260 190 H1320" class="line"/>
  <text x="1274" y="178" class="label">1 : N</text>
  <path d="M1135 310 V650 H1320" class="line"/>
  <text x="1148" y="474" class="label">1 : N</text>

  <path d="M1320 380 H1240 V637 H850" class="optional"/>
  <text x="1165" y="625" class="label">0..1 : N</text>
  <path d="M1320 755 H1210 V675 H850" class="optional"/>
  <text x="1135" y="696" class="label">0..1 : N</text>

  <rect x="50" y="852" width="1500" height="30" rx="6" fill="#eef5ee" stroke="#b1c6b1"/>
  <text x="800" y="873" text-anchor="middle" class="subtitle">webcam_alert 只保存通過連續影格與資料庫覆核的異常；disease、pests 保留官方來源欄位。</text>
</svg>
