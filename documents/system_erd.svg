      .head { font: 700 21px "Segoe UI", "Microsoft JhengHei", sans-serif; fill: #ffffff; }
      .field { font: 400 15px "Segoe UI", "Microsoft JhengHei", sans-serif; fill: #1A281E; }
      .key { font: 700 14px "Segoe UI", Arial, sans-serif; fill: #4F7057; }
      .label { font: 700 14px "Segoe UI", Arial, sans-serif; fill: #4F7057; }
      .table { fill: #ffffff; stroke: #B5C6B3; stroke-width: 2; }
      .header { fill: #4F7057; }
      .line { stroke: #B5C6B3; stroke-width: 2.2; fill: none; }
