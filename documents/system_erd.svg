<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1235" viewBox="0 0 1600 1235">
  <defs>
    <style>
      .title { font: 700 42px "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif; fill: #1A281E; }
