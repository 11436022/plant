  <text x="1281" y="785" text-anchor="middle" class="label">0..N</text>
  <path d="M1320 411 H1235 V773 H925" class="optional"/>
  <text x="1282" y="400" text-anchor="middle" class="label">0..1</text>
  <text x="952" y="797" text-anchor="middle" class="label">0..N</text>
  <path d="M1320 948 H1205 V836 H925" class="optional"/>
  <text x="1280" y="972" text-anchor="middle" class="label">0..1</text>
  <text x="958" y="858" text-anchor="middle" class="label">0..N</text>
  <text x="220" y="974" text-anchor="middle" class="field">實線：必填外鍵；虛線：可為 NULL</text>
  <text x="220" y="1004" text-anchor="middle" class="field">父端 1／0..1；子端 0..N</text>
  <text x="220" y="1034" text-anchor="middle" class="field">數字標在對應實體的一端</text>
  <rect x="50" y="1090" width="1500" height="124" rx="6" fill="#DDEAD7" stroke="#B5C6B3"/>
  <text x="800" y="1118" text-anchor="middle" class="field">日誌與警報均保存 category、requires_review、grounding_source 與 reference_* 來源快照；並非即時來源表的替代外鍵。</text>
  <text x="800" y="1147" text-anchor="middle" class="field">image_url 是檔案路徑；圖片存 static/uploads。診斷暫存為記憶體＋static/tmp，不是資料庫實體。</text>
  <text x="800" y="1175" text-anchor="middle" class="field">unknown／需複核可確認保存日誌；新警報須通過門檻與連續判定。requires_review 標記不表示專業複核已完成。</text>
  <text x="800" y="1202" text-anchor="middle" class="field">MySQL 驗證範圍：SQL 離線檢查；未執行實庫遷移或查詢驗證。</text>
</svg>
