<rect x="470" y="682" width="455" height="8" fill="#4F7057"/>
  <text x="697.5" y="673" text-anchor="middle" class="head">plant_diary</text>
  <text x="490" y="719" text-anchor="start" class="key">PK</text>
  <text x="548" y="719" text-anchor="start" class="field">id</text>
