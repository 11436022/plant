  <style>.field {font-size:15px} .key {font-size:13px} .label {font-size:13px}</style>
  <rect width="1600" height="1235" fill="#ffffff"/>
  <text x="52" y="55" text-anchor="start" class="title">資料庫實體關聯圖</text>
  <text x="52" y="86" text-anchor="start" class="subtitle">依現行 SQLAlchemy models；PK＝主鍵、FK＝外鍵、?＝可為 NULL。實體欄位不等於部署 schema 已驗證。</text>
