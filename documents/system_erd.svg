  <text x="128" y="749" text-anchor="start" class="field">id</text>
  <text x="70" y="776" text-anchor="start" class="key">FK</text>
  <text x="128" y="776" text-anchor="start" class="field">user_id (NOT NULL)</text>
  <text x="70" y="803" text-anchor="start" class="field">purpose: String(32) · token_hash</text>
  <text x="70" y="830" text-anchor="start" class="field">expires_at · used_at</text>
  <text x="70" y="857" text-anchor="start" class="field">created_at</text>
  <rect x="470" y="130" width="455" height="430" rx="8" class="table"/>
