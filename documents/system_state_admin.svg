<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 780" width="1440" height="780">
  <defs>
    <style>
      .title { font-family: 'Microsoft JhengHei', sans-serif; font-size: 23px; font-weight: bold; fill: #1A281E; }
      .group-title { font-family: 'Microsoft JhengHei', sans-serif; font-size: 15px; font-weight: bold; fill: #223827; }
      .state-name { font-family: 'Microsoft JhengHei', sans-serif; font-size: 14px; font-weight: bold; fill: #223827; }
      .diamond-text { font-family: 'Microsoft JhengHei', sans-serif; font-size: 12.5px; font-weight: bold; fill: #1A281E; text-anchor: middle; }
      .action-text { font-family: 'Microsoft JhengHei', sans-serif; font-size: 12px; fill: #2D3748; }
      .transition-text { font-family: 'Microsoft JhengHei', sans-serif; font-size: 12px; fill: #2D5837; font-weight: bold; paint-order: stroke fill; stroke: #FFFFFF; stroke-width: 4px; stroke-linejoin: round; }
      .guard-text { font-family: 'Microsoft JhengHei', sans-serif; font-size: 11.5px; fill: #993B36; font-style: italic; font-weight: bold; paint-order: stroke fill; stroke: #FFFFFF; stroke-width: 3.5px; }

      .composite-bg { fill: #F8FAF7; stroke: #B5C6B3; stroke-width: 1.5; stroke-dasharray: 6,4; rx: 8; ry: 8; }
      .composite-header { fill: #E5EDE3; stroke: #B5C6B3; stroke-width: 1.5; }

      .state-box { fill: #FFFFFF; stroke: #4F7057; stroke-width: 1.5; rx: 6; ry: 6; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.04)); }
      .state-header { fill: #DDEAD7; stroke: #4F7057; stroke-width: 1.5; }

      .choice-diamond { fill: #E5EDE3; stroke: #334035; stroke-width: 1.5; }

      .ai-box { fill: #FFFFFF; stroke: #4F7057; stroke-width: 1.5; rx: 6; ry: 6; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.04)); }
      .ai-header { fill: #DDEAD7; stroke: #4F7057; stroke-width: 1.5; }

      .line { stroke: #334035; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .line-branch { stroke: #4F7057; stroke-width: 1.5; fill: none; marker-end: url(#arrow-branch); }
      .line-back { stroke: #BA5D57; stroke-width: 1.5; stroke-dasharray: 5,4; fill: none; marker-end: url(#arrow-back); }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#334035" />
    </marker>
    <marker id="arrow-branch" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#4F7057" />
    </marker>
    <marker id="arrow-back" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#BA5D57" />
    </marker>
  </defs>

  <!-- Root Background (Pure White to prevent dark mode transparency issues) -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Title -->
  <text x="720" y="34" class="title" text-anchor="middle">圖 7-4-5 檢視儀表板與日誌管理 狀態圖 (State Diagram)</text>

  <!-- ========================================================================= -->
  <!-- 1. COMPOSITE 1: DASHBOARD OVERVIEW (x=70, y=60, w=340, h=660)              -->
  <!-- ========================================================================= -->
  <g transform="translate(70, 60)">
    <rect width="340" height="660" class="composite-bg" />
    <path d="M 0 8 Q 0 0 8 0 L 332 0 Q 340 0 340 8 L 340 32 L 0 32 Z" class="composite-header" />
    <text x="16" y="21" class="group-title">管理員儀表板狀態 (Admin Dashboard)</text>

    <!-- State 1: 管理員鑑權 (w=290, h=82) -->
    <g transform="translate(25, 48)">
      <rect width="290" height="82" class="state-box" />
      <path d="M 0 6 Q 0 0 6 0 L 284 0 Q 290 0 290 6 L 290 26 L 0 26 Z" class="state-header" />
      <text x="145" y="18" class="state-name" text-anchor="middle">管理員鑑權 (Admin_Auth)</text>
      <text x="12" y="46" class="action-text">entry / 驗證 JWT Token (Admin 角色)</text>
      <text x="12" y="66" class="guard-text">guard / [無權限] 403 拒絕訪問</text>
    </g>

    <!-- Transition S1 -> S2 -->
    <line x1="170" y1="130" x2="170" y2="190" class="line" />
    <text x="185" y="165" class="transition-text">身分查驗合格</text>

    <!-- State 2: 儀表板總覽態 (w=290, h=106) -->
    <g transform="translate(25, 190)">
      <rect width="290" height="106" class="state-box" />
      <path d="M 0 6 Q 0 0 6 0 L 284 0 Q 290 0 290 6 L 290 26 L 0 26 Z" class="state-header" />
      <text x="145" y="18" class="state-name" text-anchor="middle">儀表板總覽態 (Dashboard_Active)</text>
      <text x="12" y="47" class="action-text">entry / 統計全站總診斷次數與健康率</text>
      <text x="12" y="67" class="action-text">do / 渲染病害排行與用戶活躍圖表</text>
      <text x="12" y="87" class="action-text">do / 顯示待審糾錯數與即時串流狀態</text>
    </g>

    <!-- Transition S2 -> S3 -->
    <line x1="170" y1="296" x2="170" y2="360" class="line" />
    <text x="185" y="333" class="transition-text">進入會話就緒</text>

    <!-- State 3: 後台會話就緒 (w=290, h=85) -->
    <g transform="translate(25, 360)">
      <rect width="290" height="85" class="state-box" />
      <path d="M 0 6 Q 0 0 6 0 L 284 0 Q 290 0 290 6 L 290 26 L 0 26 Z" class="state-header" />
      <text x="145" y="18" class="state-name" text-anchor="middle">後台會話就緒 (Session_Ready)</text>
      <text x="12" y="48" class="action-text">do / 支援多模組切換與審計日誌</text>
      <text x="12" y="68" class="action-text">exit / 點擊登出銷毀管理者 Session</text>
    </g>

    <!-- Final State: Logout -->
    <line x1="170" y1="445" x2="170" y2="540" class="line" />
    <text x="185" y="495" class="transition-text">登出系統</text>
    <circle cx="170" cy="565" r="10" stroke="#1A281E" stroke-width="1.6" fill="none" />
    <circle cx="170" cy="565" r="6" fill="#1A281E" />
    <text x="170" y="595" class="action-text" font-weight="bold" text-anchor="middle">會話結束 [*]</text>
  </g>

  <!-- Initial State: Entry to Admin_Auth -->
  <circle cx="28" cy="149" r="7" fill="#1A281E" />
  <line x1="35" y1="149" x2="93" y2="149" class="line" />

  <!-- ========================================================================= -->
  <!-- 2. SUB-PROCESS 1: LOG MANAGEMENT (x=680, y=60, w=680, h=295)              -->
  <!-- ========================================================================= -->
  <g transform="translate(680, 60)">
    <rect width="680" height="295" class="composite-bg" />
    <path d="M 0 8 Q 0 0 8 0 L 672 0 Q 680 0 680 8 L 680 32 L 0 32 Z" class="composite-header" fill="#E5EDE3" />
    <text x="16" y="21" class="group-title" fill="#1A281E">管理功能 1：全站診斷日誌多維檢索與病徵審計 (日誌不可篡改原則)</text>

    <!-- State 4: 檢閱全站日誌 (w=280, h=88) -->
    <g transform="translate(25, 48)">
      <rect width="280" height="88" class="state-box" />
      <path d="M 0 6 Q 0 0 6 0 L 274 0 Q 280 0 280 6 L 280 26 L 0 26 Z" class="state-header" />
      <text x="140" y="18" class="state-name" text-anchor="middle">檢閱全站日誌 (Browsing_All)</text>
      <text x="12" y="46" class="action-text">entry / 載入 plant_diary 全站歷史記錄</text>
      <text x="12" y="65" class="action-text">do / 支援帳號、作物與病害多維篩選</text>
      <text x="12" y="82" class="action-text">do / 檢視病徵照片與備忘筆記</text>
    </g>

    <!-- Transition S4 -> S5 (gap = 65px) -->
    <line x1="305" y1="92" x2="368" y2="92" class="line" />
    <text x="337" y="82" class="transition-text" text-anchor="middle">條件篩選</text>

    <!-- State 5: 多維檢索與篩選 (w=280, h=88) -->
    <g transform="translate(370, 48)">
      <rect width="280" height="88" class="state-box" />
      <path d="M 0 6 Q 0 0 6 0 L 274 0 Q 280 0 280 6 L 280 26 L 0 26 Z" class="state-header" />
      <text x="140" y="18" class="state-name" text-anchor="middle">多維檢索與篩選 (Filtered_Search)</text>
      <text x="12" y="46" class="action-text">entry / 條件過濾與比對診斷標籤</text>
      <text x="12" y="65" class="action-text">do / 呈現關鍵字精準檢索結果</text>
      <text x="12" y="82" class="action-text">exit / 點選特定記錄進入審查</text>
    </g>

    <!-- Transition S5 -> S6 -->
    <line x1="510" y1="136" x2="510" y2="178" class="line" />
    <text x="520" y="162" class="transition-text">檢閱記錄</text>

    <!-- State 6: 病理審查與審計留存 (w=440, h=92) -->
    <g transform="translate(130, 180)">
      <rect width="440" height="92" class="state-box" />
      <path d="M 0 6 Q 0 0 6 0 L 434 0 Q 440 0 440 6 L 440 26 L 0 26 Z" class="state-header" />
      <text x="220" y="18" class="state-name" text-anchor="middle">病理審查與審計留存 (Audit_Inspection)</text>
      <text x="12" y="46" class="action-text">entry / 放大檢視病斑特徵與高解析照片</text>
      <text x="12" y="65" class="action-text">do / 遵循病歷不可篡改性 (Immutability)</text>
      <text x="12" y="84" class="action-text">do / 永久留存診斷數據供模型審計追蹤</text>
    </g>

    <!-- Loop back Return Path S6 -> S4 (Cleanly routes outside cards directly into State 4 bottom) -->
    <path d="M 130 226 L 70 226 L 70 138" class="line-back" />
    <text x="100" y="216" class="transition-text" text-anchor="middle">返回列表</text>
  </g>

  <!-- ========================================================================= -->
  <!-- 3. SUB-PROCESS 2: FEEDBACK & ACTIVE LEARNING (x=680, y=390, w=680, h=330) -->
  <!-- ========================================================================= -->
  <g transform="translate(680, 390)">
    <rect width="680" height="330" class="composite-bg" />
    <path d="M 0 8 Q 0 0 8 0 L 672 0 Q 680 0 680 8 L 680 32 L 0 32 Z" class="composite-header" fill="#E5EDE3" />
    <text x="16" y="21" class="group-title" fill="#1A281E">管理功能 2：糾錯審核與本地 ConvNet 模型持續訓練標註 (UC-14)</text>

    <!-- State 7: 反饋審查 (w=280, h=92) -->
    <g transform="translate(25, 50)">
      <rect width="280" height="92" class="ai-box" />
      <path d="M 0 6 Q 0 0 6 0 L 274 0 Q 280 0 280 6 L 280 26 L 0 26 Z" class="ai-header" />
      <text x="140" y="18" class="state-name" text-anchor="middle">反饋審查 (Reviewing_Feedback)</text>
      <text x="12" y="46" class="action-text">entry / GET /api/v1/feedback (待審清單)</text>
      <text x="12" y="65" class="action-text">do / 比對 AI 原判與用戶糾錯標籤</text>
      <text x="12" y="84" class="action-text">do / 專家審核並標註真值 (Ground Truth)</text>
    </g>

    <!-- Transition S7 -> S8 (gap = 65px) -->
    <line x1="305" y1="96" x2="368" y2="96" class="line" />
    <text x="337" y="86" class="transition-text" text-anchor="middle">通過標註</text>

    <!-- State 8: 專家標註確認 (w=280, h=92) -->
    <g transform="translate(370, 50)">
      <rect width="280" height="92" class="ai-box" />
      <path d="M 0 6 Q 0 0 6 0 L 274 0 Q 280 0 280 6 L 280 26 L 0 26 Z" class="ai-header" />
      <text x="140" y="18" class="state-name" text-anchor="middle">專家標註確認 (Label_Confirmed)</text>
      <text x="12" y="46" class="action-text">do / 更新 feedback 為已審查並鎖定真值</text>
      <text x="12" y="65" class="action-text">do / 納入主動學習候選池 (Candidate Pool)</text>
      <text x="12" y="84" class="action-text">exit / 觸發批次匯出訓練集流程</text>
    </g>

    <!-- Transition S8 -> S9 -->
    <line x1="510" y1="142" x2="510" y2="188" class="line" />
    <text x="520" y="168" class="transition-text">匯出訓練集</text>

    <!-- State 9: 匯出訓練集供 ConvNet 訓練 (w=440, h=96) -->
    <g transform="translate(130, 190)">
      <rect width="440" height="96" class="ai-box" />
      <path d="M 0 6 Q 0 0 6 0 L 434 0 Q 440 0 440 6 L 440 26 L 0 26 Z" class="ai-header" />
      <text x="220" y="18" class="state-name" text-anchor="middle">匯出訓練集供 ConvNet 訓練 (Export_JSONL)</text>
      <text x="12" y="46" class="action-text">do / 匯出標註資料集並執行資料增強</text>
      <text x="12" y="66" class="action-text">do / 本地 PyTorch 驅動主動學習 (Active Learning)</text>
      <text x="12" y="86" class="action-text">do / 迭代更新 convnet.pth 權重檔</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- 4. CHOICE DIAMOND & ROUTING (Center: x=510, y=340)                        -->
  <!-- ========================================================================= -->
  <!-- From Dashboard State 2 (x=385, y=290) -> Diamond Left Tip (x=465, y=340)  -->
  <path d="M 385 290 L 425 290 L 425 340 L 463 340" class="line" />
  <text x="425" y="315" class="transition-text" text-anchor="middle">選擇維護功能</text>

  <!-- Choice Diamond (Center: x=510, y=340; w=90, h=50) -->
  <polygon points="510,315 555,340 510,365 465,340" class="choice-diamond" />
  <text x="510" y="344" class="diamond-text">模組分支</text>

  <!-- Branch 1: Top tip (510, 315) -> Up to y=150 -> Right to Sub-process 1 (678, 150) -->
  <path d="M 510 315 L 510 150 L 678 150" class="line-branch" />
  <text x="530" y="140" class="transition-text">進入日誌列表 (UC-09)</text>

  <!-- Branch 2: Bottom tip (510, 365) -> Down to y=520 -> Right to Sub-process 2 (678, 520) -->
  <path d="M 510 365 L 510 520 L 678 520" class="line-branch" />
  <text x="530" y="510" class="transition-text">審核糾錯反饋 (UC-14)</text>

</svg>
