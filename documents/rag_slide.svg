<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 562" width="1024" height="562">
  <defs>
    <!-- Background Grid Pattern: 32px x 32px -->
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#C5D9A7" stroke-width="1.3" stroke-opacity="0.85" />
    </pattern>

    <!-- Drop Shadow for Central Card -->
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#2D4022" flood-opacity="0.05" />
    </filter>

    <!-- RAG Emblem Gradients -->
    <linearGradient id="rag-disc-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <linearGradient id="rag-disc-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
    <linearGradient id="rag-disc-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>

    <!-- AI Star Sparkle Gradient (Cyan to Purple, exact match to Gemini star) -->
    <linearGradient id="ai-star-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF" />
      <stop offset="40%" stop-color="#38BDF8" />
      <stop offset="80%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
  </defs>

  <style>
    .font-tc { font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", -apple-system, sans-serif; }
    .font-en { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Slide Background (Pure white base + grid) -->
  <rect width="1024" height="562" fill="#FFFFFF" />
  <rect width="1024" height="562" fill="url(#grid)" />

  <!-- ============================================================ -->
  <!-- ORGANIC CORNER SHAPES (Exact match to reference) -->
  <!-- ============================================================ -->
  <!-- Top-Left Organic Patch -->
  <path d="M 0 0 L 195 0 C 190 70 160 118 110 122 C 70 125 18 112 0 102 Z" fill="#C2D6A4" />

  <!-- Top-Right Organic Shape (Flows into badge) -->
  <path d="M 660 0 C 670 25 690 55 730 60 C 800 64 920 62 1024 62 L 1024 0 Z" fill="#C2D6A4" />

  <!-- Right-Edge Organic Patch -->
  <path d="M 1024 150 C 975 175 960 230 970 290 C 980 345 1002 375 1024 395 Z" fill="#C2D6A4" />

  <!-- Bottom-Right Organic Shape -->
  <path d="M 1024 562 L 885 562 C 895 490 935 442 990 428 C 1010 422 1020 424 1024 426 Z" fill="#C2D6A4" />

  <!-- ============================================================ -->
  <!-- BOTANICAL LINE-ART LEAVES (Delicate olive-green strokes) -->
  <!-- ============================================================ -->
  <!-- Top-Left Leaf Branch -->
  <g transform="translate(10, 10)" stroke="#648252" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 10 10 Q 75 95 160 165" stroke-width="2.2" />
    
    <!-- Leaf 1 (Top Left) -->
    <path d="M 30 30 Q 45 5 65 15 Q 55 45 30 30 Z" />
    <path d="M 30 30 Q 45 18 65 15" stroke-width="1.2" />
    
    <!-- Leaf 2 (Upper right pair) -->
    <path d="M 65 65 Q 100 35 115 50 Q 95 80 65 65 Z" />
    <path d="M 65 65 Q 90 50 115 50" stroke-width="1.2" />

    <!-- Leaf 3 (Middle left pair) -->
    <path d="M 85 95 Q 65 70 60 95 Q 80 115 85 95 Z" />
    <path d="M 85 95 Q 70 82 60 95" stroke-width="1.2" />

    <!-- Leaf 4 (Middle right pair) -->
    <path d="M 105 115 Q 150 95 165 110 Q 135 135 105 115 Z" />
    <path d="M 105 115 Q 135 105 165 110" stroke-width="1.2" />

    <!-- Leaf 5 (Lower pair) -->
    <path d="M 130 140 Q 110 125 100 145 Q 120 165 130 140 Z" />
    <path d="M 130 140 Q 115 135 100 145" stroke-width="1.2" />

    <!-- Leaf 6 (Tip) -->
    <path d="M 160 165 Q 185 150 195 165 Q 175 185 160 165 Z" />
    <path d="M 160 165 Q 178 157 195 165" stroke-width="1.2" />
  </g>

  <!-- Bottom-Right Leaf Branch -->
  <g transform="translate(865, 415)" stroke="#648252" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 130 135 Q 65 65 20 10" stroke-width="2.2" />

    <!-- Leaf 1 -->
    <path d="M 115 115 Q 80 135 65 120 Q 90 95 115 115 Z" />
    <path d="M 115 115 Q 90 125 65 120" stroke-width="1.2" />

    <!-- Leaf 2 -->
    <path d="M 90 90 Q 125 65 140 80 Q 115 105 90 90 Z" />
    <path d="M 90 90 Q 115 75 140 80" stroke-width="1.2" />

    <!-- Leaf 3 -->
    <path d="M 65 60 Q 40 75 30 60 Q 50 40 65 60 Z" />
    <path d="M 65 60 Q 45 67 30 60" stroke-width="1.2" />

    <!-- Leaf 4 -->
    <path d="M 45 35 Q 75 10 90 25 Q 70 50 45 35 Z" />
    <path d="M 45 35 Q 68 20 90 25" stroke-width="1.2" />

    <!-- Leaf 5 (Tip) -->
    <path d="M 20 10 Q 0 5 -10 20 Q 5 30 20 10 Z" />
    <path d="M 20 10 Q 5 12 -10 20" stroke-width="1.2" />
  </g>

  <!-- ============================================================ -->
  <!-- HAND-DRAWN CUTE YELLOW FLOWERS -->
  <!-- ============================================================ -->
  <!-- Flower 1: Bottom-Left (Above Student Badge) -->
  <g transform="translate(125, 435) rotate(-10)">
    <!-- 5 organic rounded petals with yellow fill -->
    <ellipse cx="0" cy="-20" rx="9" ry="15" fill="#FAE053" />
    <ellipse cx="18" cy="-7" rx="9" ry="14" transform="rotate(28 18 -7)" fill="#FAE053" />
    <ellipse cx="12" cy="16" rx="9" ry="14" transform="rotate(72 12 16)" fill="#FAE053" />
    <ellipse cx="-12" cy="16" rx="9" ry="14" transform="rotate(-72 -12 16)" fill="#FAE053" />
    <ellipse cx="-18" cy="-7" rx="9" ry="14" transform="rotate(-28 -18 -7)" fill="#FAE053" />
    <!-- White crayon highlight strokes -->
    <path d="M -3 -24 Q 0 -12 3 -24" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.85" />
    <path d="M 14 -9 Q 20 -7 16 -13" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.85" />
    <path d="M 9 18 Q 13 14 11 9" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.85" />
    <path d="M -9 18 Q -13 14 -11 9" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.85" />
    <path d="M -14 -9 Q -20 -7 -16 -13" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.85" />
    <!-- Center disk -->
    <circle cx="0" cy="0" r="6" fill="#E8C32E" />
  </g>

  <!-- Flower 2: Mid-Right (Beside Card) -->
  <g transform="translate(875, 290) rotate(20) scale(0.92)">
    <ellipse cx="0" cy="-20" rx="9" ry="15" fill="#FAE053" />
    <ellipse cx="18" cy="-7" rx="9" ry="14" transform="rotate(28 18 -7)" fill="#FAE053" />
    <ellipse cx="12" cy="16" rx="9" ry="14" transform="rotate(72 12 16)" fill="#FAE053" />
    <ellipse cx="-12" cy="16" rx="9" ry="14" transform="rotate(-72 -12 16)" fill="#FAE053" />
    <ellipse cx="-18" cy="-7" rx="9" ry="14" transform="rotate(-28 -18 -7)" fill="#FAE053" />
    <path d="M -3 -24 Q 0 -12 3 -24" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.85" />
    <circle cx="0" cy="0" r="6" fill="#E8C32E" />
  </g>

  <!-- ============================================================ -->
  <!-- TOP-RIGHT SECTION BADGE: [03    系統架構] -->
  <!-- ============================================================ -->
  <g transform="translate(680, 0)">
    <!-- Flat top, rounded left curve extending from x=0 to end of slide -->
    <path d="M 32 0 L 344 0 L 344 65 L 32 65 C 14 65 0 51 0 32.5 C 0 14 14 0 32 0 Z" fill="#C2D6A4" />
    <text x="64" y="44" class="font-tc font-en" font-size="25" font-weight="800" fill="#3D4F37" letter-spacing="1">03</text>
    <text x="145" y="44" class="font-tc" font-size="25" font-weight="800" fill="#3D4F37" letter-spacing="5">系統架構</text>
  </g>

  <!-- ============================================================ -->
  <!-- CENTRAL WHITE CARD -->
  <!-- ============================================================ -->
  <rect x="122" y="74" width="778" height="412" rx="32" fill="#FFFFFF" filter="url(#card-shadow)" />

  <!-- ============================================================ -->
  <!-- LEFT COLUMN: RAG ICON & TITLE -->
  <!-- Center: x = 285, y = 280 -->
  <!-- ============================================================ -->
  <g transform="translate(285, 252)">
    <!-- Soft circular aura -->
    <circle cx="0" cy="-20" r="105" fill="url(#emerald-glow)" opacity="0.08" />

    <!-- Layered Vector Database Cylinder (Knowledge Store) -->
    <!-- Bottom Layer -->
    <g transform="translate(0, 36)">
      <path d="M -62 0 C -62 20 62 20 62 0 L 62 18 C 62 38 -62 38 -62 18 Z" fill="url(#rag-disc-1)" />
      <ellipse cx="0" cy="0" rx="62" ry="18" fill="url(#rag-disc-2)" />
    </g>

    <!-- Middle Layer -->
    <g transform="translate(0, 8)">
      <path d="M -62 0 C -62 20 62 20 62 0 L 62 18 C 62 38 -62 38 -62 18 Z" fill="url(#rag-disc-2)" />
      <ellipse cx="0" cy="0" rx="62" ry="18" fill="url(#rag-disc-3)" />
    </g>

    <!-- Top Layer with Vector Knowledge Constellation -->
    <g transform="translate(0, -20)">
      <path d="M -62 0 C -62 20 62 20 62 0 L 62 18 C 62 38 -62 38 -62 18 Z" fill="url(#rag-disc-2)" />
      <ellipse cx="0" cy="0" rx="62" ry="18" fill="#A7F3D0" />
      
      <!-- Vector nodes & edges -->
      <circle cx="-30" cy="0" r="4" fill="#047857" opacity="0.8" />
      <circle cx="0" cy="4" r="4" fill="#047857" opacity="0.8" />
      <circle cx="30" cy="-2" r="4" fill="#047857" opacity="0.8" />
      <line x1="-30" y1="0" x2="0" y2="4" stroke="#047857" stroke-width="2" opacity="0.5" />
      <line x1="0" y1="4" x2="30" y2="-2" stroke="#047857" stroke-width="2" opacity="0.5" />
    </g>

    <!-- Floating 4-Pointed AI Retrieval Star (Gemini Gradient) -->
    <g transform="translate(32, -78) scale(0.74)">
      <path d="M 0 -62 Q 0 0 62 0 Q 0 0 0 62 Q 0 0 -62 0 Q 0 0 0 -62 Z" fill="url(#ai-star-grad)" />
    </g>

    <!-- Accent Mini Sparkle on Left -->
    <g transform="translate(-50, -58) scale(0.35)">
      <path d="M 0 -50 Q 0 0 50 0 Q 0 0 0 50 Q 0 0 -50 0 Q 0 0 0 -50 Z" fill="#10B981" />
    </g>

    <!-- Accent Micro Sparkle on Right -->
    <g transform="translate(70, -22) scale(0.22)">
      <path d="M 0 -50 Q 0 0 50 0 Q 0 0 0 50 Q 0 0 -50 0 Q 0 0 0 -50 Z" fill="#38BDF8" />
    </g>
  </g>

  <!-- Big Bold Title: RAG (Clean sans-serif, matching Gemini weight) -->
  <text x="285" y="402" text-anchor="middle" class="font-en" font-size="40" font-weight="900" fill="#000000" letter-spacing="1">RAG</text>

  <!-- ============================================================ -->
  <!-- RIGHT COLUMN: THREE SAGE GREEN PILLS -->
  <!-- ============================================================ -->
  <!-- Pill 1: 官方農業知識庫整合 -->
  <g transform="translate(445, 160)">
    <rect x="0" y="0" width="345" height="66" rx="33" fill="#C2D6A4" stroke="#000000" stroke-width="2.6" />
    <text x="172.5" y="42" text-anchor="middle" class="font-tc" font-size="22" font-weight="800" fill="#000000" letter-spacing="1.2">官方農業知識庫整合</text>
  </g>

  <!-- Pill 2: FAISS 768維向量檢索 -->
  <g transform="translate(445, 247)">
    <rect x="0" y="0" width="345" height="66" rx="33" fill="#C2D6A4" stroke="#000000" stroke-width="2.6" />
    <text x="172.5" y="42" text-anchor="middle" class="font-tc font-en" font-size="22" font-weight="800" fill="#000000" letter-spacing="1.2">FAISS 768維向量檢索</text>
  </g>

  <!-- Pill 3: 杜絕 AI 幻覺與精準處方 -->
  <g transform="translate(445, 334)">
    <rect x="0" y="0" width="345" height="66" rx="33" fill="#C2D6A4" stroke="#000000" stroke-width="2.6" />
    <text x="172.5" y="42" text-anchor="middle" class="font-tc font-en" font-size="21.5" font-weight="800" fill="#000000" letter-spacing="0.8">杜絕 AI 幻覺與精準處方</text>
  </g>

  <!-- ============================================================ -->
  <!-- FOOTER: STUDENT BADGE & PAGE NUMBER -->
  <!-- ============================================================ -->
  <!-- Student ID Badge (Bottom Left) -->
  <g transform="translate(18, 520)">
    <rect x="0" y="0" width="132" height="28" rx="8" fill="#C2D6A4" />
    <text x="66" y="19" text-anchor="middle" class="font-tc font-en" font-size="12.5" font-weight="700" fill="#2E4024" letter-spacing="0.5">11436015 陳浩民</text>
  </g>

  <!-- Page Number (Bottom Right, next to leaf stem) -->
  <text x="965" y="534" class="font-en" font-size="18" font-weight="700" fill="#4B633F">8</text>

</svg>
