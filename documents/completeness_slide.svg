<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 562" width="1024" height="562">
  <defs>
    <!-- Background Grid Pattern: 32px x 32px -->
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#C5D9A7" stroke-width="1.3" stroke-opacity="0.85" />
    </pattern>

    <!-- Drop Shadow for Central Card -->
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#2D4022" flood-opacity="0.05" />
    </filter>

    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <linearGradient id="teal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>

    <linearGradient id="badge-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
  </defs>

  <style>
    .font-tc { font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", -apple-system, sans-serif; }
    .font-en { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Slide Background (Pure white base + grid) -->
  <rect width="1024" height="562" fill="#FFFFFF" />
  <rect width="1024" height="562" fill="url(#grid)" />

  <!-- ============================================================ -->
  <!-- ORGANIC CORNER SHAPES (Exact match to theme) -->
  <!-- ============================================================ -->
  <!-- Top-Left Organic Patch -->
  <path d="M 0 0 L 195 0 C 190 70 160 118 110 122 C 70 125 18 112 0 102 Z" fill="#C2D6A4" />

  <!-- Top-Right Organic Shape (Flows into badge) -->
  <path d="M 640 0 C 650 25 670 55 710 60 C 780 64 900 62 1024 62 L 1024 0 Z" fill="#C2D6A4" />

  <!-- Right-Edge Organic Patch -->
  <path d="M 1024 150 C 975 175 960 230 970 290 C 980 345 1002 375 1024 395 Z" fill="#C2D6A4" />

  <!-- Bottom-Right Organic Shape -->
  <path d="M 1024 562 L 885 562 C 895 490 935 442 990 428 C 1010 422 1020 424 1024 426 Z" fill="#C2D6A4" />

  <!-- ============================================================ -->
  <!-- BOTANICAL LINE-ART LEAVES -->
  <!-- ============================================================ -->
  <!-- Top-Left Leaf Branch -->
  <g transform="translate(10, 10)" stroke="#648252" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 10 10 Q 75 95 160 165" stroke-width="2.2" />
    <path d="M 30 30 Q 45 5 65 15 Q 55 45 30 30 Z" />
    <path d="M 30 30 Q 45 18 65 15" stroke-width="1.2" />
    <path d="M 65 65 Q 100 35 115 50 Q 95 80 65 65 Z" />
    <path d="M 65 65 Q 90 50 115 50" stroke-width="1.2" />
    <path d="M 85 95 Q 65 70 60 95 Q 80 115 85 95 Z" />
    <path d="M 85 95 Q 70 82 60 95" stroke-width="1.2" />
    <path d="M 105 115 Q 150 95 165 110 Q 135 135 105 115 Z" />
    <path d="M 105 115 Q 135 105 165 110" stroke-width="1.2" />
  </g>

  <!-- Bottom-Right Leaf Branch -->
  <g transform="translate(865, 415)" stroke="#648252" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 130 135 Q 65 65 20 10" stroke-width="2.2" />
    <path d="M 115 115 Q 80 135 65 120 Q 90 95 115 115 Z" />
    <path d="M 115 115 Q 90 125 65 120" stroke-width="1.2" />
    <path d="M 90 90 Q 125 65 140 80 Q 115 105 90 90 Z" />
    <path d="M 90 90 Q 115 75 140 80" stroke-width="1.2" />
    <path d="M 65 60 Q 40 75 30 60 Q 50 40 65 60 Z" />
    <path d="M 65 60 Q 45 67 30 60" stroke-width="1.2" />
  </g>

  <!-- Cute Yellow Flowers -->
  <g transform="translate(125, 435) rotate(-10)">
    <ellipse cx="0" cy="-20" rx="9" ry="15" fill="#FAE053" />
    <ellipse cx="18" cy="-7" rx="9" ry="14" transform="rotate(28 18 -7)" fill="#FAE053" />
    <ellipse cx="12" cy="16" rx="9" ry="14" transform="rotate(72 12 16)" fill="#FAE053" />
    <ellipse cx="-12" cy="16" rx="9" ry="14" transform="rotate(-72 -12 16)" fill="#FAE053" />
    <ellipse cx="-18" cy="-7" rx="9" ry="14" transform="rotate(-28 -18 -7)" fill="#FAE053" />
    <path d="M -3 -24 Q 0 -12 3 -24" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.85" />
    <circle cx="0" cy="0" r="6" fill="#E8C32E" />
  </g>

  <g transform="translate(875, 290) rotate(20) scale(0.92)">
    <ellipse cx="0" cy="-20" rx="9" ry="15" fill="#FAE053" />
    <ellipse cx="18" cy="-7" rx="9" ry="14" transform="rotate(28 18 -7)" fill="#FAE053" />
    <ellipse cx="12" cy="16" rx="9" ry="14" transform="rotate(72 12 16)" fill="#FAE053" />
    <ellipse cx="-12" cy="16" rx="9" ry="14" transform="rotate(-72 -12 16)" fill="#FAE053" />
    <ellipse cx="-18" cy="-7" rx="9" ry="14" transform="rotate(-28 -18 -7)" fill="#FAE053" />
    <path d="M -3 -24 Q 0 -12 3 -24" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.85" />
    <circle cx="0" cy="0" r="6" fill="#E8C32E" />
  </g>

  <!-- ============================================================ -->
  <!-- TOP-RIGHT SECTION BADGE: [04    成果與完整度] -->
  <!-- ============================================================ -->
  <g transform="translate(640, 0)">
    <path d="M 32 0 L 384 0 L 384 65 L 32 65 C 14 65 0 51 0 32.5 C 0 14 14 0 32 0 Z" fill="#C2D6A4" />
    <text x="50" y="44" class="font-tc font-en" font-size="25" font-weight="800" fill="#3D4F37" letter-spacing="1">04</text>
    <text x="120" y="44" class="font-tc" font-size="25" font-weight="800" fill="#3D4F37" letter-spacing="4">系統與功能完整度</text>
  </g>

  <!-- ============================================================ -->
  <!-- CENTRAL WHITE CARD -->
  <!-- ============================================================ -->
  <rect x="115" y="74" width="794" height="412" rx="32" fill="#FFFFFF" filter="url(#card-shadow)" />

  <!-- ============================================================ -->
  <!-- CARD CONTENT: TWO BALANCED PILLARS -->
  <!-- Left Pillar: 系統完整度 (x: 145 .. 490, width: 345) -->
  <!-- Right Pillar: 功能完整度 (x: 525 .. 870, width: 345) -->
  <!-- ============================================================ -->

  <!-- --- LEFT COLUMN: 系統架構與驗證完整度 --- -->
  <g transform="translate(145, 96)">
    <!-- Header Block -->
    <rect x="0" y="0" width="350" height="48" rx="24" fill="#EBF4DE" stroke="#3D4F37" stroke-width="2" />
    <text x="175" y="32" text-anchor="middle" class="font-tc" font-size="20" font-weight="900" fill="#1C2D16" letter-spacing="1">🛡️ 系統架構完整度</text>

    <!-- Highlight Metric Pill -->
    <g transform="translate(0, 58)">
      <rect x="0" y="0" width="350" height="42" rx="12" fill="#C2D6A4" stroke="#000000" stroke-width="2" />
      <text x="175" y="27" text-anchor="middle" class="font-tc font-en" font-size="16" font-weight="800" fill="#000000">核心驗收通過率：100% (Pass)</text>
    </g>

    <!-- 3 Core Technical Metric Cards -->
    <!-- Metric 1: TC-01 ~ TC-16 -->
    <g transform="translate(0, 110)">
      <rect x="0" y="0" width="350" height="68" rx="16" fill="#F8FAF5" stroke="#CADBB2" stroke-width="1.8" />
      <text x="18" y="28" class="font-tc font-en" font-size="15" font-weight="800" fill="#0F172A">16 項核心端到端測試 (TC-01~16)</text>
      <text x="18" y="52" class="font-tc font-en" font-size="12.5" font-weight="600" fill="#4B633F">✓ 帳號鑑權 / 雙模型推論 / 3幀防抖全過</text>
      <!-- Green Pass Pill Badge -->
      <rect x="272" y="14" width="62" height="24" rx="8" fill="#10B981" />
      <text x="303" y="31" text-anchor="middle" class="font-en" font-size="12" font-weight="900" fill="#FFFFFF">100%</text>
    </g>

    <!-- Metric 2: 111 回歸測試 -->
    <g transform="translate(0, 186)">
      <rect x="0" y="0" width="350" height="68" rx="16" fill="#F8FAF5" stroke="#CADBB2" stroke-width="1.8" />
      <text x="18" y="28" class="font-tc font-en" font-size="15" font-weight="800" fill="#0F172A">自動化回歸測試套件 (Pytest + Node)</text>
      <text x="18" y="52" class="font-tc font-en" font-size="12.5" font-weight="600" fill="#4B633F">✓ 後端 111 項 + 瀏覽器 18 項無縫通過</text>
      <rect x="272" y="14" width="62" height="24" rx="8" fill="#10B981" />
      <text x="303" y="31" text-anchor="middle" class="font-en" font-size="12" font-weight="900" fill="#FFFFFF">129/129</text>
    </g>

    <!-- Metric 3: 全端四大子系統連通 -->
    <g transform="translate(0, 262)">
      <rect x="0" y="0" width="350" height="88" rx="16" fill="#F8FAF5" stroke="#CADBB2" stroke-width="1.8" />
      <text x="18" y="26" class="font-tc font-en" font-size="15" font-weight="800" fill="#0F172A">全端四層架構全鏈路交付</text>
      <text x="18" y="50" class="font-tc font-en" font-size="12.5" font-weight="600" fill="#334155">• Android App 雙模式即時拍照診斷</text>
      <text x="18" y="72" class="font-tc font-en" font-size="12.5" font-weight="600" fill="#334155">• FastAPI + MySQL 8.0 + FAISS 411向量</text>
      <rect x="272" y="14" width="62" height="24" rx="8" fill="#059669" />
      <text x="303" y="31" text-anchor="middle" class="font-tc" font-size="11.5" font-weight="800" fill="#FFFFFF">已就緒</text>
    </g>
  </g>

  <!-- --- RIGHT COLUMN: 業務功能需求完整度 --- -->
  <g transform="translate(525, 96)">
    <!-- Header Block -->
    <rect x="0" y="0" width="350" height="48" rx="24" fill="#EBF4DE" stroke="#3D4F37" stroke-width="2" />
    <text x="175" y="32" text-anchor="middle" class="font-tc" font-size="20" font-weight="900" fill="#1C2D16" letter-spacing="1">✨ 業務功能完整度</text>

    <!-- Highlight Metric Pill -->
    <g transform="translate(0, 58)">
      <rect x="0" y="0" width="350" height="42" rx="12" fill="#C2D6A4" stroke="#000000" stroke-width="2" />
      <text x="175" y="27" text-anchor="middle" class="font-tc font-en" font-size="16" font-weight="800" fill="#000000">12 項核心功能需求：100% 達成</text>
    </g>

    <!-- 6 Compact Functional Module Tags (2 rows x 3 or 3 rows x 2) -->
    <!-- Row 1: F1 & F2 -->
    <g transform="translate(0, 110)">
      <!-- F1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="170" height="68" rx="14" fill="#C2D6A4" stroke="#000000" stroke-width="2" />
        <text x="85" y="27" text-anchor="middle" class="font-tc font-en" font-size="13.5" font-weight="800" fill="#000000">FR-01 帳號與郵件</text>
        <text x="85" y="50" text-anchor="middle" class="font-tc font-en" font-size="11.5" font-weight="700" fill="#1E293B">JWT + Gmail 認證</text>
      </g>
      <!-- F2 -->
      <g transform="translate(180, 0)">
        <rect x="0" y="0" width="170" height="68" rx="14" fill="#C2D6A4" stroke="#000000" stroke-width="2" />
        <text x="85" y="27" text-anchor="middle" class="font-tc font-en" font-size="13.5" font-weight="800" fill="#000000">FR-02 雙模型快篩</text>
        <text x="85" y="50" text-anchor="middle" class="font-tc font-en" font-size="11.5" font-weight="700" fill="#1E293B">ConvNeXt + Gemini</text>
      </g>
    </g>

    <!-- Row 2: F3 & F4 -->
    <g transform="translate(0, 186)">
      <!-- F3 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="170" height="68" rx="14" fill="#C2D6A4" stroke="#000000" stroke-width="2" />
        <text x="85" y="27" text-anchor="middle" class="font-tc font-en" font-size="13.5" font-weight="800" fill="#000000">FR-03 官方 RAG</text>
        <text x="85" y="50" text-anchor="middle" class="font-tc font-en" font-size="11.5" font-weight="700" fill="#1E293B">FAISS 向量防幻覺</text>
      </g>
      <!-- F4 -->
      <g transform="translate(180, 0)">
        <rect x="0" y="0" width="170" height="68" rx="14" fill="#C2D6A4" stroke="#000000" stroke-width="2" />
        <text x="85" y="27" text-anchor="middle" class="font-tc font-en" font-size="13.5" font-weight="800" fill="#000000">FR-04 兩階段日記</text>
        <text x="85" y="50" text-anchor="middle" class="font-tc font-en" font-size="11.5" font-weight="700" fill="#1E293B">確認暫存 + 筆記CRUD</text>
      </g>
    </g>

    <!-- Row 3: F5 & F6 -->
    <g transform="translate(0, 262)">
      <!-- F5 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="170" height="88" rx="14" fill="#C2D6A4" stroke="#000000" stroke-width="2" />
        <text x="85" y="27" text-anchor="middle" class="font-tc font-en" font-size="13.5" font-weight="800" fill="#000000">FR-06 Webcam 監控</text>
        <text x="85" y="50" text-anchor="middle" class="font-tc font-en" font-size="11.5" font-weight="700" fill="#1E293B">3 幀共識連續防抖</text>
        <text x="85" y="70" text-anchor="middle" class="font-tc font-en" font-size="11" font-weight="600" fill="#1E293B">聲音/Email/網頁告警</text>
      </g>
      <!-- F6 -->
      <g transform="translate(180, 0)">
        <rect x="0" y="0" width="170" height="88" rx="14" fill="#C2D6A4" stroke="#000000" stroke-width="2" />
        <text x="85" y="27" text-anchor="middle" class="font-tc font-en" font-size="13.5" font-weight="800" fill="#000000">FR-11 糾錯與後台</text>
        <text x="85" y="50" text-anchor="middle" class="font-tc font-en" font-size="11.5" font-weight="700" fill="#1E293B">農友主動糾錯反饋</text>
        <text x="85" y="70" text-anchor="middle" class="font-tc font-en" font-size="11" font-weight="600" fill="#1E293B">訓練集匯出重訓閉環</text>
      </g>
    </g>

  </g>

  <!-- ============================================================ -->
  <!-- FOOTER: STUDENT BADGE & PAGE NUMBER -->
  <!-- ============================================================ -->
  <g transform="translate(18, 520)">
    <rect x="0" y="0" width="132" height="28" rx="8" fill="#C2D6A4" />
    <text x="66" y="19" text-anchor="middle" class="font-tc font-en" font-size="12.5" font-weight="700" fill="#2E4024" letter-spacing="0.5">11436015 陳浩民</text>
  </g>

  <!-- Page Number (Bottom Right) -->
  <text x="965" y="534" class="font-en" font-size="18" font-weight="700" fill="#4B633F">9</text>

</svg>
