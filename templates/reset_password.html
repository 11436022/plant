<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重設密碼 - 植物醫生 Plant Doctor</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            color: #2e382d;
        }
        .card {
            background: #ffffff;
            width: 100%;
            max-width: 440px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            padding: 32px 28px;
            text-align: center;
        }
        .logo-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            background: #e8f5e9;
            color: #2e7d32;
            font-size: 32px;
            border-radius: 50%;
            margin-bottom: 16px;
        }
        h2 {
            font-size: 1.5rem;
            color: #1b5e20;
            margin-bottom: 8px;
            font-weight: 700;
        }
        p.subtitle {
            font-size: 0.95rem;
            color: #616161;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .btn {
            display: inline-block;
            width: 100%;
            padding: 14px 20px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease-in-out;
            box-sizing: border-box;
        }
        .btn-app {
            background: #2e7d32;
            color: #ffffff;
            margin-bottom: 8px;
            box-shadow: 0 4px 12px rgba(46, 125, 50, 0.25);
        }
        .btn-app:hover {
            background: #1b5e20;
        }
        .btn-app:active {
            transform: scale(0.98);
        }
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 22px 0 18px 0;
            color: #9e9e9e;
            font-size: 0.85rem;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e0e0e0;
        }
        .divider:not(:empty)::before {
            margin-right: 0.75em;
        }
        .divider:not(:empty)::after {
            margin-left: 0.75em;
        }
        .form-group {
            text-align: left;
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #424242;
            margin-bottom: 6px;
        }
        input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #cfd8dc;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s;
            outline: none;
        }
        input[type="password"]:focus {
            border-color: #2e7d32;
            box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.15);
        }
        .btn-submit {
            background: #388e3c;
            color: #ffffff;
            margin-top: 8px;
        }
        .btn-submit:hover {
            background: #2e7d32;
        }
        .btn-submit:disabled {
            background: #bdbdbd;
            cursor: not-allowed;
        }
        .alert {
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-top: 16px;
            line-height: 1.4;
            display: none;
            text-align: left;
        }
        .alert-error {
            background: #ffebee;
            color: #c62828;
            border: 1px solid #ffcdd2;
        }
        .alert-success {
            background: #e8f5e9;
            color: #1b5e20;
            border: 1px solid #c8e6c9;
        }
        .alert-info {
            background: #e3f2fd;
            color: #1565c0;
            border: 1px solid #bbdefb;
        }
        .hint {
            font-size: 0.8rem;
            color: #757575;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo-badge">🌱</div>
        <h2>植物醫生 重設密碼</h2>
        <p class="subtitle" id="subtitle">正在為您開啟 App，若未跳轉亦可直接在網頁完成重設</p>

        <!-- 開啟 App 區域 -->
        <div id="appActionArea">
            <button type="button" class="btn btn-app" id="btnOpenApp">📱 開啟 Plant Doctor App</button>
        </div>

        <div class="divider" id="dividerText">或直接在網頁端重設</div>

        <!-- 網頁直接重設表單 -->
        <form id="resetForm" onsubmit="handleResetPassword(event)">
            <div class="form-group">
                <label for="newPassword">新密碼</label>
                <input type="password" id="newPassword" placeholder="請輸入至少 8 碼新密碼" autocomplete="new-password" required minlength="8">
                <div class="hint">密碼長度需至少 8 個字元</div>
            </div>
            <div class="form-group">
                <label for="confirmPassword">確認新密碼</label>
                <input type="password" id="confirmPassword" placeholder="請再次輸入新密碼" autocomplete="new-password" required minlength="8">
            </div>
            <button type="submit" class="btn btn-submit" id="btnSubmit">確認送出重設</button>
        </form>

        <!-- 訊息提示框 -->
        <div id="alertBox" class="alert"></div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const target = urlParams.get('target');

        const alertBox = document.getElementById('alertBox');
        const btnSubmit = document.getElementById('btnSubmit');
        const resetForm = document.getElementById('resetForm');
        const btnOpenApp = document.getElementById('btnOpenApp');
        const appActionArea = document.getElementById('appActionArea');
        const dividerText = document.getElementById('dividerText');

        function showAlert(message, type = 'info') {
            alertBox.className = `alert alert-${type}`;
            alertBox.innerHTML = message;
            alertBox.style.display = 'block';
        }

        function hideAlert() {
            alertBox.style.display = 'none';
        }

        if (!token) {
            showAlert('❌ 連結缺少權杖 (Token) 或連結已損毀，請回到 App 重新點選「忘記密碼」。', 'error');
            resetForm.style.display = 'none';
            appActionArea.style.display = 'none';
            dividerText.style.display = 'none';
            document.getElementById('subtitle').textContent = '無效的重設請求';
        } else {
            // 建構 Chrome Android Intent 語法與自訂 Scheme 語法
            const intentUrl = `intent://reset/reset-password?token=${encodeURIComponent(token)}#Intent;scheme=plantdoctor;package=com.example.plantdoctor;end`;
            const appUrl1 = `plantdoctor://reset/reset-password?token=${encodeURIComponent(token)}`;
            const appUrl2 = `plantdoctor://reset-password?token=${encodeURIComponent(token)}`;

            function tryOpenApp() {
                const isAndroid = /Android/i.test(navigator.userAgent);
                if (isAndroid) {
                    window.location.href = intentUrl;
                } else {
                    window.location.href = appUrl1;
                }
            }

            btnOpenApp.addEventListener('click', function(e) {
                e.preventDefault();
                tryOpenApp();
            });

            // 進入頁面時嘗試自動喚醒 App
            setTimeout(() => {
                tryOpenApp();
            }, 300);
        }

        async function handleResetPassword(e) {
            e.preventDefault();
            hideAlert();

            const newPassword = document.getElementById('newPassword').value.trim();
            const confirmPassword = document.getElementById('confirmPassword').value.trim();

            if (!token) {
                showAlert('❌ 缺少重設權杖，無法送出。', 'error');
                return;
            }

            if (newPassword.length < 8) {
                showAlert('⚠️ 密碼長度至少需要 8 個字元。', 'error');
                return;
            }

            if (newPassword !== confirmPassword) {
                showAlert('⚠️ 兩次輸入的密碼不一致，請再次確認。', 'error');
                return;
            }

            btnSubmit.disabled = true;
            btnSubmit.textContent = '處理中...';

            try {
                const response = await fetch('/api/v1/auth/user/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        token: token,
                        new_password: newPassword,
                        confirm_password: confirmPassword
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    showAlert('🎉 <strong>密碼重設成功！</strong><br>您現在可以返回 Plant Doctor App，使用新密碼進行登入。', 'success');
                    resetForm.style.display = 'none';
                    dividerText.style.display = 'none';
                    document.getElementById('subtitle').textContent = '密碼已成功更新！';
                    btnOpenApp.textContent = '📱 返回並開啟 App 登入';
                } else {
                    let errMsg = data.detail || '重設失敗，請稍後再試。';
                    if (errMsg === 'Token has expired.') {
                        errMsg = '⏰ 重設連結已過期（超過 30 分鐘），請回到 App 重新申請忘記密碼。';
                    } else if (errMsg === 'Token has already been used.') {
                        errMsg = '⚠️ 此連結已被使用過，如需重新設定請重新申請。';
                    } else if (errMsg === 'Invalid token.') {
                        errMsg = '❌ 無效的權杖，請確認連結是否正確。';
                    } else if (errMsg === 'Passwords do not match.') {
                        errMsg = '⚠️ 兩次輸入的密碼不一致。';
                    }
                    showAlert(errMsg, 'error');
                    btnSubmit.disabled = false;
                    btnSubmit.textContent = '確認送出重設';
                }
            } catch (err) {
                showAlert('❌ 網路連線錯誤，請確認伺服器連線正常後再試。', 'error');
                btnSubmit.disabled = false;
                btnSubmit.textContent = '確認送出重設';
            }
        }
    </script>
</body>
</html>
