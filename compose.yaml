# Docker Compose 現行標準規範（Compose Specification 官方預設標準檔名 compose.yaml）
services:
  web:
    # 使用當前目錄的 Dockerfile 來建構映像檔
    build:
      context: .
      dockerfile: Dockerfile
    # 建構映像檔名稱
    image: plant-backend
    # 容器名稱
    container_name: plant_app_container
    # 將主機的 8000 port 映射到容器的 8000 port
    ports:
      - "8000:8000"
    # 讀取 .env 檔案中的環境變數
    env_file:
      - .env
    # 支援跨平台以 host.docker.internal 連線至主機 MySQL 或其他本機服務
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 掛載 volumes，確保上傳檔案資料持久化
    volumes:
      - ./static/uploads:/app/static/uploads
      - ./static/feedback_uploads:/app/static/feedback_uploads
    # 自動重啟策略
    restart: always
