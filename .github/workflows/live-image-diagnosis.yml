name: Live Internet Image Diagnosis

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/live-image-diagnosis.yml
      - scripts/live_image_smoke_test.py
      - app/services/ai.py
      - app/db/models.py
      - seed.py
      - data.json

permissions:
  contents: read

concurrency:
  group: live-image-diagnosis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose-labeled-images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      DB_USER: cloud_test
      DB_PASSWORD: cloud_test
      DB_HOST: 127.0.0.1
      DB_NAME: plant_cloud_test
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Verify Gemini secret
        shell: bash
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Repository secret GEMINI_API_KEY is not configured."
            exit 1
          fi

      - name: Install live-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "faiss-cpu==1.14.3" \
            "google-genai==1.72.0" \
            "numpy>=1.26.4" \
            "Pillow==12.2.0" \
            "PyMySQL==1.1.2" \
            "python-dotenv==1.2.2" \
            "requests==2.33.1" \
            "SQLAlchemy==2.0.49"

      - name: Diagnose labeled internet images
        run: |
          python scripts/live_image_smoke_test.py \
            --minimum-exact 2 \
            --report artifacts/live-image-results.json

      - name: Upload diagnosis report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-image-diagnosis-${{ github.run_number }}
          path: artifacts/live-image-results.json
          if-no-files-found: ignore
          retention-days: 14
